[cli.help._root.read.screen.arg.lines]
help = "화면 아래에서부터 읽을 줄 수. 내용의 끝에서부터 센다 — 뒤쪽 빈 줄은 건너뛰고 모자란 만큼을 스크롤백에서 채운다. 상한은 격자가 아니라 내용이라, 마지막으로 찍힌 줄 아래의 행은 돌아오지 않는다. 그래서 대부분 비어 있는 화면은 스크롤백이 남아 있어도 N 보다 적게 돌려준다. 대체 화면(전체 화면 TUI)에서는 채움이 주 버퍼의 스크롤백에서 오고 표지 없이 붙으므로, N 이 크면 TUI 자신의 화면 위에 셸 기록이 얹혀 나올 수 있다"

