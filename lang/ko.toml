[cli.help._root.hook-handler.upsert]
about = "사용자 핸들러를 TOML 을 직접 열지 않고 그 자리에서 만들거나 고친다"
long = "사용자 핸들러를 TOML 을 직접 열지 않고 그 자리에서 만들거나 고친다.\n\n안 준 필드는 그대로 둔다 — 핸들러를 갈아끼우는 것이 아니라 **덧대는** 것이라, id 와 그 id 를 가리키는 모든 binding 이 편집을 넘겨 살아남는다. 필드는 적어도 하나는 줘야 한다. 변경은 곧바로 `~/.tasty/hook-handlers.toml` 에 쓴다.\n\nwebhook 이 이미 묶여 있던 IpcSequence 는 등록 시점에 담아 둔 것을 계속 쏜다 — 이 변경을 태우려면 webhook 을 다시 등록해라."

