[cli.help._root.remote]
about = "다른 호스트의 서피스·워크스페이스에 원격(SSH) attach — `remote attach`"

[cli.help._root.remote.attach]
about = "SSH로 원격 서피스/워크스페이스에 일회성 attach"
long = "SSH로 원격 서피스/워크스페이스에 일회성 attach합니다. `ssh -L` 터널을 열고 그 안에서 attach 세션을 실행합니다. 원격 대상은 `--ssh` 또는 `--profile`로 지정합니다."

[cli.help._root.remote.attach.arg.surface]
help = "대상 서피스 ID(명시적으로 지정하며 포커스에서 추론하지 않음). `--workspace`와 함께 사용 불가"

[cli.help._root.remote.attach.arg.workspace]
help = "대상 워크스페이스 ID. 모든 터미널을 트리로 미러링합니다. 위치 인자 `surface`와 함께 사용 불가. 터미널이 아닌 서피스는 자리 표시자로 표시"

[cli.help._root.remote.attach.arg.dump_after]
help = "미러 덤프 모드: attach 후 N ms 동안 출력을 모아 미러 화면을 stdout에 출력하고 종료(GUI 없는 자동 검증). 워크스페이스 모드에서는 서피스별로 구분해 출력"

[cli.help._root.remote.attach.arg.send]
help = "attach 직후 한 번 보낼 입력(이스케이프 해석: \\\\n \\\\r \\\\t \\\\xNN). 비대화형 검증용"

[cli.help._root.remote.attach.arg.send_to]
help = "워크스페이스 모드에서 `--send` 입력을 받을 원격 서피스 ID"

[cli.help._root.remote.attach.arg.raw]
help = "원시 브리지 모드: stdin/stdout 그대로 전달(Ctrl+\\\\로 detach)"

[cli.help._root.remote.attach.arg.force_detach]
help = "점유된 서피스/워크스페이스의 attach 잠금을 서버에서 강제로 해제(attach하지 않음). 이 서버에 로컬 `attach.force_detach` 요청을 보내 원격 클라이언트의 잠금을 해제합니다. `--ssh`와 함께 사용 불가(터널을 통한 강제 detach 미지원)"

[cli.help._root.remote.attach.arg.ssh]
