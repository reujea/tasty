# mirror 워크스페이스 안에서 구조 변경(split / 새 탭 / 닫기 / 순서 변경)을 시도했을 때
# 표시. mirror 워크스페이스는 원격 워크스페이스의 뷰라, 변경은 원격 인스턴스에서
