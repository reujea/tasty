long = "카테고리 순서를 변경합니다('normal'은 인덱스 0에 고정, from/to는 1 이상). `--id`를 권장합니다. 카테고리 ID는 소유 윈도우를 식별하므로 포커스에 관계없이 같은 대상을 가리킵니다. `--from`은 윈도우 내부 인덱스여서 포커스된 윈도우에 적용됩니다."

[cli.help._root.workspace-category.move.arg.id]
