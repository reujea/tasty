[cli.help._root.events]
about = "호스트 사건 피드를 위치로 읽는다 (fetch, follow)"
long = "호스트 사건 피드를 위치로 읽는다 (fetch, follow)\n\n피드는 메모리에만 산다: 재시작하면 비워지고 위치도 처음부터 다시 시작하므로, 모든 답이 그 위치가 어느 세대의 것인지 말하는 `epoch` 을 함께 들고 온다. 링에서 밀려난 위치는 가장 오래된 것으로 조용히 바뀌지 않는다 — 답이 몇 개를 건너뛰었는지 말한다."

[cli.help._root.events.fetch]
about = "어떤 위치부터 사건을 읽는다. 답을 JSON 객체 하나로 찍는다"
long = "어떤 위치부터 사건을 읽는다. 답을 JSON 객체 하나로 찍는다.\n\n사건은 그 객체의 `events` 배열에 있고, 옆에 `next_offset` · `epoch` 등 답의 다른 필드가 함께 있다. 한 줄에 사건 하나씩 받으려면 `follow` 를 쓴다.\n\n커서는 호스트가 아니라 **네 것**이다: 앞 답의 `next_offset` 을 넘겨 이어 읽어라. 같은 인자로 두 번 물으면 같은 답이 오고, 느린 소비자가 호스트 쪽에 쌓는 것은 없다.\n\n사건은 메모리에만 산다. 재시작하면 비워지고 위치도 처음부터 시작하므로 모든 답이 `epoch` 을 들고 온다 — 네 offset 이 온 세대와 다르면 그 offset 은 앞 세대의 것이다."

[cli.help._root.events.fetch.arg.offset]
help = "읽기 시작할 위치. 기본 0, 아직 남아 있는 것 중 가장 오래된 자리"

[cli.help._root.events.fetch.arg.max]
help = "최대 몇 개까지. 호스트가 상한을 건다"

[cli.help._root.events.fetch.arg.filter]
help = "키 패턴: 정확한 키(`agent.task_finished`) 또는 네임스페이스 와일드카드(`agent.*`). 구독이 쓰는 것과 같은 문법이다"

[cli.help._root.events.fetch.arg.wait_ms]
help = "답하기 전에 뭔가 올 때까지 이만큼 기다린다. 기본 0, 지금 있는 것으로 곧바로 답한다"

[cli.help._root.events.follow]
about = "피드를 따라간다: 어떤 위치부터 long-poll 하며 사건마다 JSON 한 줄을 계속 찍는다. 끊을 때까지 돈다"
long = "피드를 따라간다: 어떤 위치부터 long-poll 하며 사건마다 JSON 한 줄을 계속 찍는다. 끊을 때까지 돈다.\n\n다시 붙는 것은 마지막 위치로 같은 호출을 하는 것이다 — 멈췄던 소비자는 멈춘 자리에서 이어 읽는다. 위치가 링에서 밀려날 만큼 오래 멈춰 있었으면, 답은 가장 오래된 사건부터 조용히 다시 시작하지 않고 그 사실을 말한다. 이 명령은 그 알림을 stderr 로 찍는다 — stdout 을 읽는 `while read` 루프가 흐트러지지 않게.\n\ntasty 가 재시작하면 위치가 처음부터 다시 매겨진다. 다시 붙을 때 네 offset 이 온 `--epoch` 을 넘겨라: 그 사이 tasty 가 재시작했으면 이 명령이 stderr 로 그렇다고 말하고 새 세대의 처음부터 잇는다. 넘기지 않아도 새 피드의 끝보다 뒤인 위치는 같은 방식으로 알리고 처리한다. 연결이 끊기면 이 명령은 다시 붙을 `--offset` 과 `--epoch` 을 찍고 끝난다. `--reconnect` 를 주면 대신 계속 다시 붙어 이어 간다."

[cli.help._root.events.follow.arg.offset]
help = "시작할 위치. 기본 0, 아직 남아 있는 것 중 가장 오래된 자리"

[cli.help._root.events.follow.arg.filter]
help = "키 패턴. `fetch --filter` 와 같은 문법이다"

[cli.help._root.events.follow.arg.batch]
help = "요청 하나에 사건 몇 개까지"

[cli.help._root.events.follow.arg.wait_ms]
help = "요청 하나가 빈 손으로 돌아오기까지 얼마나 기다리는가"

[cli.help._root.events.follow.arg.epoch]
help = "네 offset 이 온 세대 — 연결이 끊길 때 찍히거나 `fetch` 가 돌려준 값. 그 사이 tasty 가 재시작했으면 무관한 위치를 읽지 않고 새 세대의 처음부터 다시 잇는다"

[cli.help._root.events.follow.arg.reconnect]
help = "연결이 끊기면 끝내지 않고 1 초마다 다시 붙는다. 세대를 들고 가므로 재시작은 알리고 그 처음부터 따라간다"

[cli.help._root.telemetry]
about = "에이전트 텔레메트리 (지표 기록, 요약, 시계열, 상위 N)"
long = "에이전트 텔레메트리 (메트릭 기록 · 요약 · 시계열 · 상위 N)\n\n들어오는 경로가 둘이다: 에이전트가 `telemetry record` 로 직접 보고하는 것, 그리고 에이전트의 IPC 호출마다 호스트가 method 태그를 달아 하나씩 남기는 `ipc_calls` 이벤트 (호스트 자신의 호출 · `telemetry.*` · throttled 호출은 안 센다). 조회는 raw 이벤트만 읽는다 — 영속 rollup 이 없다 — 그리고 저장소는 최근 2 만 건으로 잘리므로 `--since` 를 그보다 과거로 줘도 닿지 않는다. anomaly 기록은 따로 잘린다: 최근 5 천 건, 최대 50 시간."

[cli.help._root.telemetry.record-batch]
about = "여러 이벤트를 한 번에 기록한다 — 같은 타임스탬프를 공유하므로 순서가 보존된다. 이벤트 사이의 순서가 중요하면 `record` 를 반복하는 대신 이것을 쓴다"

