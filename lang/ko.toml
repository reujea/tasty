[cli.help._root.plugin.show.arg.id]
help = "plugin id"

[cli.help._root.plugin.install]
about = "tasty-plugin.toml 이 있는 디렉토리에서 plugin 을 설치한다"
long = "tasty-plugin.toml 이 있는 디렉토리에서 plugin 을 설치한다.\n\n둘이 더 일어나고, 둘 다 묻지 않는다: 매니페스트가 선언한 권한이 즉시 전부 부여되고, 그 id 의 비활성 자국이 이미 남아 있지 않으면 곧바로 활성화·기동된다. `tasty-plugin.toml` 을 먼저 들여다보거나, 설치 뒤에 `plugin permissions <id>` 와 `plugin revoke <id> <permission>` 으로 확인하고 되돌려라."

[cli.help._root.plugin.install.arg.path]
help = "plugin 디렉토리 경로 (tasty-plugin.toml 이 있어야 한다)"

[cli.help._root.plugin.remove]
about = "설치된 plugin 을 id 로 제거한다"
long = "설치된 plugin 을 id 로 제거한다.\n\nplugin 디렉토리가 통째로 지워지므로, 그 plugin 이 그 안에 두었던 것도 함께 없어진다. 기본 제공 plugin 이면 제거된 사실까지 기록되어 다음 실행에 다시 놓이지 않는다 — 되돌리는 것은 `plugin upgrade-builtins --restore-removed <id>` 이고, 돌아올 때는 활성 상태다."

[cli.help._root.plugin.remove.arg.id]
help = "plugin id (예: com.example.explorer)"

[cli.help._root.plugin.upgrade-builtins]
about = "기본 제공 plugin 전부를 번들에서 다시 맞춘다"
long = "기본 제공 plugin 전부를 번들에서 다시 맞춘다.\n\n매니페스트 버전이 갈래를 고르고 그 안에서는 내용이 정한다: 번들 버전이 더 높으면 디렉토리를 통째로 다시 쓰고, 같은 버전이면 다른 것만 다시 쓰고, 설치본이 번들보다 높으면 내용을 보지 않고 건너뛴다 — `--force` 는 그 마지막 갈래를 위한 것이다. 바뀐 기본 제공 plugin 이 새로 선언한 권한은 같은 호출에서 부여된다."

[cli.help._root.plugin.upgrade-builtins.arg.force]
help = "설치본 버전이 번들 버전 이상이어도 덮어쓴다"

[cli.help._root.plugin.upgrade-builtins.arg.restore_removed]
help = "`removed_builtins` 에서 특정 기본 제공 plugin 을 되살려 같은 호출에서 자동 설치 대상이 되게 한다. 여러 개면 반복해서 준다"

[cli.help._root.plugin.upgrade-builtins.arg.restore_all]
help = "`removed_builtins` 에 있는 기본 제공 plugin 을 전부 되살린다. `--restore-removed` 와 함께 주면 이쪽이 이긴다"

[cli.help._root.plugin.upgrade-builtins.arg.restart_running]
help = "바이너리가 교체된 기본 제공 plugin 이 돌고 있으면 재시작한다 — 정상 교체. 제자리 덮어쓰기에서 나는 Windows 공유 위반도 이것으로 풀린다. 기본은 꺼짐 (보수적으로 — 해당 plugin 의 표면이 잠깐 닫힌다)"

[cli.help._root.plugin.enable]
about = "비활성화된 plugin 을 활성화하고 기동한다"

[cli.help._root.plugin.enable.arg.id]
help = "plugin id"

[cli.help._root.plugin.disable]
about = "plugin 을 비활성화한다 (돌고 있으면 정상 종료)"
long = "plugin 을 비활성화한다 (돌고 있으면 정상 종료).\n\n자국이 디스크에 남아 재시작을 넘긴다 — 그 뒤에 같은 id 를 `plugin install` 해도 다시 켜지지 않는다. 이것은 제거가 아니다: 디렉토리는 남고 명령 네임스페이스의 소유도 그대로라, `tasty <네임스페이스> ...` 는 없는 메서드라고 답하지 않고 `plugin ... is not running` 으로 답한다. 대신 그 plugin 이 기여하던 것 — 파일 detector 와 handler, hook handler, completion strategy, 설정 페이지 — 이 전부 빠지므로, 그 plugin 이 열던 파일은 이제 다른 경로로 열린다."

[cli.help._root.plugin.disable.arg.id]
help = "plugin id"

