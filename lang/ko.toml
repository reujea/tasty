[cli.help._root.list.pressure]
about = "이 인스턴스가 뜬 뒤의 요청 압력을 보여준다 — 요청에 답하는 동안 시간이 어디로 갔는가"
long = "이 인스턴스가 뜬 뒤의 요청 압력을 보여준다 — 요청에 답하는 동안 시간이 어디로 갔는가.\n\n답은 모수마다 한 블록이고, 모수는 **일부러** 서로 다르다. `queue_before_gate` 는 권한 게이트 **앞**에서 재므로 나중에 거절된 요청도 센다. `handler_after_gate` 는 게이트 **뒤**에서 재므로 실제로 돈 요청만 센다. `plugin_round_trip` 은 이 인스턴스가 plugin 의 답을 기다린 시간이고, 답이 온 요청만 센다. `db` 는 쓰기가 디스크에 안착하기까지의 시간이고, 성공한 커밋만 센다. 한 블록에서 다른 블록을 빼지 마라 — 게이트를 지나고도 핸들러 블록이 보기 전에 답이 나가는 요청이 있다.\n\n`connections` 는 다섯째 블록이고 시간이 아니라 **자리**다: 이 포트에 붙은 모든 TCP 연결이며, 요청을 한 번도 안 보내는 attach·mesh 스트림도 포함한다. 여기서 누계·순간값 중 내려가는 것은 `live` 뿐이고(아래 accept 대기 평균은 파생값이라 내려갈 수 있다), `limit` 은 서버가 강제하는 천장이라 값과 함께 다녀 둘을 같이 읽을 수 있으며, `refused_saturated` 는 그 천장에서 돌려보낸 연결 수다 — 요청이 되기 전이라 위 네 블록 어디에도 안 나온다.\n\n`connections` 에는 시간이 하나 있는데, 잰 값이 아니라 **상한**이다: accept 루프가 꺼낸 연결마다(`accept_waits` — `accepted` 와 `refused_saturated` 의 합과 같다) accept 큐를 마지막으로 비어 있다고 본 뒤 지난 시간이고, 그 연결이 OS 큐에서 기다린 시간은 이 값을 넘을 수 없다(`accept_wait_bound_us_sum` · `accept_wait_bound_us_max` · `accept_wait_bound_us_mean`). 루프는 큐가 비면 100 ms 자므로, 호출마다 새 연결을 여는 client 는 요청이 읽히기 전에 그만큼까지 잃을 수 있고, 그 시간이 보이는 블록은 여기뿐이다.\n\n그 넷 중 셋(`queue_before_gate` · `handler_after_gate` · `plugin_round_trip`)은 같은 관측의 분포를 담은 `*_hist` 도 함께 들고 온다. 평균과 최대만으로는 \"전부 조금씩 느리다\" 와 \"대부분 빠르고 몇 개가 아니다\" 를 못 가르기 때문이다. `bounds_us` 와 `counts` 는 짝으로 다니고, `counts` 는 한 칸 더 길며 누적이 아니다 — 항목의 합이 관측 수이고, 마지막 항목은 맨 위 경계를 넘었다는 뜻일 뿐이다. 분위수는 여기서 계산하지 않는다. `db` 도 시간이지만 분포가 없고, `connections` 는 자리는 시간이 아니고 하나 있는 시간도 상한일 뿐이라 분포가 없다.\n\n`db_pragmas` 는 여섯째 블록이고 애초에 누계가 아니다 — SQLite DB(`memory_db` · `state_db`)마다 열 때 요청한 연결 설정과 거기서 되읽은 값을 나란히 보여준다. journal_mode=WAL 같은 요청은 조용히 거절될 수 있기 때문이다. `degraded` 는 설정이 하나라도 안 걸렸을 때 true 이고, `memory_db` 는 파일을 못 열어 in-memory 대체로 떴을 때도 true 이며 그때 `init_failure` 가 원인을 말한다(아니면 null). 그래도 DB 는 계속 쓰인다. `state_db` 는 그 DB 가 이 프로세스에 열려 있지 않을 때 null 이고, 헤드리스 인스턴스는 늘 그렇다.\n\n`stream_push` 는 일곱째 블록이고 이 인스턴스가 답한 요청이 아니라 **밀어낸** 프레임을 센다 — attach·mesh 스트림 연결로 보낸 프레임이다. `frames_dropped` 는 연결이 살아 있는데 그 연결의 큐가 차서 버린 프레임 수이고, `clients_lagged_out` 는 너무 뒤처져 끊은 연결 수다. 둘 다 올라가기만 한다. `backlog` 은 지금 쌓여 있고 아직 안 쓰인 프레임 수를 살아 있는 연결에 걸쳐 더한 값이고, `sink_capacity` 는 그것과 견줄 연결 하나의 큐 상한이다.\n\n`queue_admission` 과 `queue_dispatch` 는 명령 큐의 양 끝이다. `queue_admission` 은 지금 큐에 든 것(바이트 · 명령 수 · 그중 이 인스턴스가 스스로 주입한 명령 수)과 최고 바이트, 바이트 상한(`refused_bytes`)이나 주입 깊이 상한(`refused_depth`)에서 돌려보낸 요청 수, 그리고 그것과 견줄 두 상한(`limit_bytes` · `limit_injected_depth`)이다. 돌려보낸 요청은 큐에 한 번도 안 들어갔으므로 다른 어느 블록에도 안 남는다. 이 프로세스에 IPC 서버가 없으면 null 이다. `queue_dispatch` 는 꺼낸 쪽이다 — 회차와 그중 명령 수 · 시간 예산에서 멈춘 수, 기다리는 동안 기한이 지난 명령(`expired_before_run`), 시작한 명령, 그리고 `in_flight` — 지금 실행 중이고 호출자가 아직 기다리는 요청 — 와 그 최댓값이다.\n\n`keyed_requests` 는 멱등 키를 실은 요청만 센다. 판정마다 한 칸이다: `executed`(처음 보는 키, 실행했다) · `replayed`(같은 요청이 다시 와서 보관된 답을 냈다) · `conflicted`(같은 키에 다른 요청, 아무것도 실행하지 않았다) · `discarded`(실행은 됐고 답은 버려졌다) · `in_flight`(같은 요청이 아직 실행 중이라 거기에 합류했다). 요청 하나는 한 번만 세진다. 이 `in_flight` 는 `queue_dispatch` 의 것과 다르다.\n\n`slow_requests` 는 열한째 블록이고 누계가 아니라 느린 요청을 한 건씩 보여준다: 큐 대기 · 호스트 처리 · 플러그인 대기의 합이 `threshold_us`(100 ms) 이상인 요청마다 한 줄이고, 오래된 것부터 `capacity` 줄까지다. 한 줄에는 `request_seq`(이 인스턴스가 요청마다 매기는 번호 — JSON-RPC id 도 이벤트 trace id 도 아니다) · `method` · `caller` · `queue_wait_us` · `host_us` 가, 플러그인으로 넘긴 요청이면 `plugin_hops`(플러그인 · 그 플러그인이 요청 id 로 받은 `host_request_id` · 대기 · 결과)가 실린다. `admitted` 는 지금까지 남긴 줄의 누계라 밀려난 줄 수는 `admitted` 에서 보이는 줄 수를 뺀 것이다. 이 답을 묻는 조회 자신은 남기지 않는다.\n\n느린 줄의 `host` 에는 호출자가 실제로 받은 답도 실린다: `outcome` 은 플러그인 hop 과 같은 낱말로 `ok` 또는 `error` 이고, 오류면 `error_code` 가 그 JSON-RPC 오류 코드다. 그래서 큐에서 실행 전에 만료된 요청(-32067) · 거절된 요청(-32001) · 정상 답을 링만으로 가를 수 있다. 아직 답이 안 나갔으면(플러그인으로 넘긴 요청이 답을 기다리는 동안 등) 둘 다 null 이다.\n\n`queue_before_gate.waits` 는 큐 대기를 기록한 명령 수이고, 명령을 꺼내는 순간 오른다. `wait_us_mean` 의 분모이며 `wait_us_hist.counts` 의 합과 같다. `commands` 는 명령을 꺼내는 한 회차가 끝나야 오르므로, 한 답 안에서 아직 도는 회차(조회 자신이 든 회차)만큼 `waits` 보다 작을 수 있다.\n\n뒤에 아무 관측도 없는 평균은 0 이 아니라 null 로 온다."

