[cli.help._root.remote.attach.arg.profile]
help = "저장된 tasty-attach 프로필 이름으로 attach. `~/.tasty/remote-profiles.toml`에서 사용자/포트/인증 키/추가 옵션을 가져옵니다. `--ssh`와 함께 사용 불가. 프로필 값이 `--remote-tasty`와 `--remote-port-mode`를 대체"

[cli.help._root.remote.attach.arg.remote_tasty]
help = "원격 host의 tasty 바이너리 경로. 포트 탐색의 하위 명령 단계(`ssh host <path> port`)에 사용. 기본값은 \"tasty\"(원격 PATH에 있다고 가정)"

[cli.help._root.remote.attach.arg.remote_port_mode]
help = "원격 포트 발견 방식: auto (기본값) | subcommand | file-unix | file-windows"

[cli.help._root.remote.attach.arg.no_reconnect]
help = "자동 재연결 비활성화(기본적으로 SSH 연결이 끊기면 지연을 늘리며 재연결)"

[cli.help._root.remote.attach.arg.into_gui]
help = "로컬 GUI가 클라이언트가 되어 원격 워크스페이스를 미러로 재구성하도록 요청(`attach.into_gui` IPC). `--workspace`와 `--target-port` 필수"

[cli.help._root.remote.attach.arg.target_port]
help = "`--into-gui`용 원격 tasty 서버의 루프백 포트(GUI가 연결할 포트)"

[cli.help._root.remote.check]
about = "SSH로 원격 tasty 인스턴스의 생존 여부 확인"
long = "SSH로 원격 tasty 인스턴스의 생존 여부를 확인합니다. 포트 탐색(`tasty port` 또는 포트 파일)만으로는 종료된 인스턴스의 오래된 포트 파일을 오인할 수 있어, 포트 발견 후 `ssh -L` 터널을 열고 가벼운 IPC 요청(`system.info`)을 한 번 보냅니다. 응답해야 살아 있는 것으로 판단하며 연결 거부나 시간 초과는 종료 상태(오래된 포트)를 뜻합니다. 인자 이름은 `remote attach`와 같습니다."

[cli.help._root.remote.check.arg.ssh]
help = "원격 SSH 대상(예: --ssh user@host, --ssh gx10). `--profile`과 함께 사용 불가"

[cli.help._root.remote.check.arg.profile]
help = "저장된 tasty-attach 프로필 이름으로 확인. `~/.tasty/remote-profiles.toml`에서 사용자/포트/인증 키/추가 옵션을 가져옵니다. `--ssh`와 함께 사용 불가. 프로필 값이 `--remote-tasty`와 `--remote-port-mode`를 대체"

[cli.help._root.remote.check.arg.remote_tasty]
help = "원격 host의 tasty 바이너리 경로. 포트 탐색의 하위 명령 단계(`ssh host <path> port`)에 사용. 기본값은 \"tasty\"(원격 PATH에 있다고 가정)"

[cli.help._root.remote.check.arg.remote_port_mode]
help = "원격 포트 발견 방식: auto (기본값) | subcommand | file-unix | file-windows"

[cli.help._root.remote.workspaces]
about = "SSH로 원격 tasty 인스턴스의 워크스페이스 나열"
long = "SSH로 원격 tasty 인스턴스의 워크스페이스를 나열합니다. SSH 대상이나 attach 프로필로 연결하여 원격 `workspace.list`와 `attach.list`를 합칩니다. 워크스페이스별 ID, 이름, 페인 수, 실행 중 여부, 다른 클라이언트의 attach 여부를 표시합니다. `remote attach --workspace`에 필요한 ID를 찾을 때 사용합니다. 읽기 전용이며 로컬 사용자 상태(포커스 등)를 바꾸지 않습니다. `--ssh 127.0.0.1:<port>`는 터널 없이 루프백으로 직접 연결합니다(로컬 종단 간 검증). 로컬 IPC `remote.workspaces`도 같은 기능을 제공합니다."

[cli.help._root.remote.workspaces.arg.ssh]
help = "원격 SSH 대상(예: --ssh user@host, --ssh gx10, --ssh 127.0.0.1:45123). `--profile`과 함께 사용 불가"

[cli.help._root.remote.workspaces.arg.profile]
help = "저장된 tasty-attach 프로필 이름으로 나열. `--ssh`와 함께 사용 불가. 프로필 값이 `--remote-tasty`와 `--remote-port-mode`를 대체"

[cli.help._root.remote.workspaces.arg.remote_tasty]
help = "원격 host의 tasty 바이너리 경로(포트 탐색 하위 명령에 사용). 기본값 \"tasty\""

[cli.help._root.remote.workspaces.arg.remote_port_mode]
help = "원격 포트 발견 방식: auto (기본값) | subcommand | file-unix | file-windows"

[cli.help._root.remote.workspaces.arg.json]
help = "사람용 텍스트 대신 JSON 배열 출력(스크립트·UI 소비용)"

[cli.help._root.remote.new-workspace]
about = "SSH로 원격 tasty 인스턴스에 새 워크스페이스 생성"
long = "SSH로 원격 tasty 인스턴스에 새 워크스페이스를 생성합니다. `remote workspaces`에 대응하는 쓰기 명령입니다. 출력된 ID를 `tasty remote attach --workspace <id>`에 넘기면 원격 생성 후 attach할 수 있습니다. 원격의 활성 워크스페이스는 바뀌지 않습니다. 로컬 IPC `remote.attach`의 `new_workspace` 옵션도 같은 기능을 제공합니다."

[cli.help._root.remote.new-workspace.arg.ssh]
