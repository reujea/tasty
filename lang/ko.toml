long = "barrier 를 만든다 (신호 N 개가 모일 때까지 기다린다).\n\n타이머는 돌지 않는다. `--timeout-ms` 는 게으르게 도장 찍힌다: barrier 가 `TimedOut` 이 되는 것은 다음 `barrier-signal`·`barrier-state`·`barrier-list` 안에서이고, 그래서 아무도 묻지 않는 barrier 는 남겨진 상태 그대로 앉아 있는다. 도장이 찍힌 뒤에는 `barrier-signal` 이 실패하고, 기록 자체는 `barrier-delete` 로 지울 때까지 남는다."

