about = "핸들러 하나를 id 로 보여준다 — action 본문 전체를 포함해서"
long = "핸들러 하나를 id 로 보여준다 — action 본문 전체를 포함해서.\n\n`list` 는 IpcSequence 의 단계 수만 세고, 이쪽은 그 호출들 자체를 찍는다. 찍히는 `action` 객체는 `upsert --action` 이 받는 것과 정확히 같은 모양이라, sequence 를 읽어 고쳐서 도로 보낼 수 있다."

