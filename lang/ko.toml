# 원격 attach 가 하드 점유 중인 surface 를 닫으려 했을 때 표시. 점유는 "지금 원격
# 사용자가 이 터미널을 쓰고 있다" 는 선언이라 닫으면 그 세션이 예고 없이 죽는다.
