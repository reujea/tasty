close_blocked_hard_occupied = "원격 세션이 사용 중인 터미널이 있어 닫지 않았습니다. 강제 끊기로 회수한 뒤 다시 시도하세요."
# mirror 워크스페이스에 포커스된 상태에서 찍은 인터랙티브 스크린샷이 업로드되어
# 원격 인스턴스의 클립보드로 반영됐을 때 표시.
mirror_capture_saved = "스크린샷을 원격 클립보드로 복사했습니다."
# 위 업로드/원격 클립보드 반영이 실패했을 때 표시.
mirror_capture_failed = "스크린샷을 원격 클립보드로 복사하지 못했습니다."
# 원격 연결이 끊겨(EOF / force-detach / heartbeat 타임아웃 / 송신 프레임 write 실패)
# mirror 워크스페이스가 정리될 때 표시. anchor 매핑 없이 임시로 attach 한 mirror 에만
# 해당 — 매핑된 mirror 는 아래 세 키(자동 재연결 대상)로 대신 표시된다.
mirror_disconnected = "원격 연결이 끊어졌습니다. 미러 워크스페이스를 닫았습니다."
# 매핑된 mirror 워크스페이스의 연결이 끊겼을 때 표시 — 워크스페이스와 터미널(scrollback
# 포함)은 그대로 유지한 채 백그라운드 backoff 재시도가 자동으로 재연결을 시도한다.
mirror_reconnecting = "원격 연결이 끊어졌습니다. 재연결을 시도합니다…"
# backoff 재시도가 성공해 mirror 가 다시 살아났을 때 표시.
mirror_reconnected = "원격 워크스페이스에 다시 연결했습니다."
# 원격이 이 mirror 로 보내던 것 일부를 버려 화면이 이어지지 않게 됐을 때 표시 — mirror 가
# 다시 attach 해 화면을 새로 받아 온다.
mirror_desynced = "원격 화면 일부를 놓쳤습니다. 다시 받아 옵니다…"
# 반복 실패로 자동 backoff 재시도를 포기했을 때 1회 표시. 워크스페이스를 벗어났다가
# 돌아오면 여전히 수동으로 재시도된다.
mirror_reconnect_giveup = "여러 번 시도했지만 재연결하지 못했습니다. 이 워크스페이스에서 벗어났다가 돌아오면 다시 시도합니다."

# 원격 파일 전송 피드백 팝업 — 진행(determinate) + 실패.
[transfer.progress]
# 전송 진행 팝업 헤더(download 글리프). 수신 측(원격 인스턴스가 파일을 받는다) 관점.
title = "파일 수신 중"
# ghost 버튼 — 진행 관망만 중단(백그라운드 전송은 계속 완료된다).
