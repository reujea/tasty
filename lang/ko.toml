[cli.help._root.approval]
about = "사람 인계 승인 게이트 (request/respond/await/cancel/list/get)"
long = "사람 인계 승인 게이트 (request/respond/await/cancel/list/get)\n\n살아 있는 게이트는 호스트를 넘기지 못한다. `request`·`respond`·`await`·`cancel`·`list`·`get` 은 전부 메모리 안의 저장소 하나를 읽고, 그 저장소는 부팅마다 비어서 시작한다. 그래서 호스트가 멈출 때 `pending` 이던 요청은 그 뒤에 없다 — `list` 에 안 나오고 그 id 로 `await` 하면 \"not found\" 가 온다. 남는 것은 적힌 기록이고, 그것을 memory store 에서 읽는 것이 `history` 다. `history` 는 로그, `list` 는 지금 답할 수 있는 것으로 읽어라."

[cli.help._root.approval.request]
about = "새 승인을 요청한다. 성공하면 새 id 를 찍는다"
long = "새 승인을 요청한다. 성공하면 새 id 를 찍는다.\n\n저절로 만료되는 것은 없다. `--timeout-ms` 를 재는 자리는 `approval await` 안이고, 요청을 제시간에 `pending` 밖으로 옮기는 것은 그 호출뿐이다 — 기다리는 쪽이 없으면 요청은 timeout 값이 얼마였든 `pending` 으로 남고 `approval list --state pending` 에 계속 나온다."

