[cli.help._root.remote.check.arg.remote_tasty]
help = "リモートホストの tasty 実行ファイルのパスです。ポート照会コマンド (`ssh host <path> port`) に使います。既定値は \"tasty\" で、リモートの PATH 上にある必要があります。"

