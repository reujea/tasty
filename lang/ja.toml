help = "検出の深さ: `cheap` (拡張子、ファイル名パターン、ディレクトリ判定) または `deep` (内容の検査も含む)。基準サーフェスがミラーされたリモートワークスペースにある場合は無視されます。パスはリモートのファイルなので、拡張子とファイル名パターンのみを確認します。応答には要求した深さがそのまま返されます"

