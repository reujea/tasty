[cli.help._root.agent.task-purge.arg.older_than_ms]
help = "経過時間（created_at、終端の task は finished_at）がこのミリ秒を超える task だけを候補にする"

[cli.help._root.agent.task-purge.arg.dry_run]
help = "何も削除せず計画だけ計算して表示する"

[cli.help._root.agent.barrier-create]
about = "N個の信号を受け取ると完了するbarrierを作成します"
long = "N個の信号を受け取ると完了するbarrierを作成します。\n\n期限はタイマーではなく、次のbarrier-signal、barrier-state、barrier-listの呼び出しで確認します。期限切れのbarrierは信号を拒否し、barrier-deleteで削除するまで残ります。"

