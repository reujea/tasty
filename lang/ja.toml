long = "所有者ごとにアクセスを制限する secret ストアです。CLI は `_host` 所有者として動作し、--owner オプションがないため、プラグインの secret 領域にはアクセスできません。\n\nアクセス制限は IPC にのみ適用します。値は同じ `memory.db` に暗号化せず保存するため、DB ファイルを開ける人は値を読めます。ディスク上でも保護したい秘密は OS のキーチェーンか別の権限を設定したファイルに保存し、ここにはパスだけを保存してください。"

