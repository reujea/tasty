[cli.help._root.agent.task-create]
about = "ワークスペースにタスクを作成します。まだ実行はしません"
long = "ワークスペースにタスクを作成します。まだ実行はしません。\n\n`task-run --action start`でワークスペースのrunnerを明示的に起動してください。ホストの起動だけではrunnerは開始されません。runnerがないとReadyのタスクは待機したままとなり、task-awaitがタイムアウトすることがあります。"

[cli.help._root.agent.task-create.arg.workspace_id]
help = "ワークスペース id（フォーカス非依存 — 必須）"

[cli.help._root.agent.task-create.arg.name]
help = "表示名"

[cli.help._root.agent.task-create.arg.command]
help = "タスクのコマンドを JSON で指定します (例: `{\"kind\":\"run\",\"command\":[\"cargo\",\"build\"]}`)。`workspace_id` を省略すると `--workspace` から補います。両者が異なる場合は `--workspace` を使い、警告を出します。JSON を直接指定するか `@path/to/file.json` から読み取れます。"

[cli.help._root.agent.task-create.arg.depends_on]
help = "カンマ区切りの依存 task id 一覧"

[cli.help._root.agent.task-create.arg.on_failure]
help = "失敗時の処理: abort | continue_downstream | fallback:<task_id> (既定値: abort)。abort と continue_downstream は先行タスクに依存する後続タスクに設定します。fallback は失敗する可能性のあるタスク自身に設定します。後続タスクに fallback を設定しても、先行タスクの失敗によるスキップには適用されません。"

[cli.help._root.agent.task-create.arg.metadata]
help = "メタデータ JSON（自由形式、task に付く）"

[cli.help._root.agent.task-create.arg.concurrency_limit]
help = "`metadata.semaphore.name` を簡単に指定するオプションです。同じセマフォのタスクの同時実行数を制限し、残りは許可が空くまで `ready` で待ちます。`--metadata` と併用するとマージしますが、既に `semaphore` があれば競合します。"

[cli.help._root.agent.task-create.arg.reserved_for_fallback]
help = "後のtask-create --on-failure fallback:<this-id>で主タスクに関連付けるまで、fallback候補をwaitingに保ちます。2つの呼び出しの間にrunnerが候補を実行するのを防ぎます。主タスクが関連付けられなければ待機し続けます"

[cli.help._root.agent.task-graph-submit]
about = "型付き（contract_version 2）のタスクグラフを一度に送信します"
long = "型付き（contract_version 2）のタスクグラフを一度に送信します。\n\nまずグラフ全体を検証します。id、参照、入力 binding、型、マッピング、fallback、循環を確認します。検証に失敗したグラフは何も保存せず、エラーにはタスクと送信したグラフ内の JSON Pointer の位置が示されます。正しいグラフはまとめて保存して有効化するため、すべてのタスクが保存されるまでどのタスクも実行されません。`workspace_id` のない run・agent コマンド（inline fallback のコマンドを含む）には `--workspace` の値を補います。ほかの種類のコマンドにはこのフィールドがないため、そのまま送ります。"

[cli.help._root.agent.task-graph-submit.arg.workspace_id]
help = "ワークスペース id（フォーカス非依存 — 必須）"

[cli.help._root.agent.task-graph-submit.arg.graph]
help = "グラフ JSON（`{\"contract_version\":2,\"types\":{..},\"tasks\":[..]}`）。JSON を直接指定するか `@path/to/file.json` から読み込みます"

[cli.help._root.agent.task-graph-submit.arg.dry_run]
help = "検証のみ行います。何も保存も実行もしません"

[cli.help._root.agent.task-list]
about = "ワークスペースの task を並べる"

[cli.help._root.agent.task-list.arg.workspace_id]
help = "ワークスペース id（フォーカス非依存 — 必須）"

[cli.help._root.agent.task-list.arg.state]
help = "状態で絞り込む（カンマ区切り: waiting,ready,running,succeeded,failed,cancelled,skipped,unknown）。複数の状態を与えると、そのいずれかに合う task を全て出す（`--state waiting,ready,running` = まだ終わっていない task）"

[cli.help._root.agent.task-list.arg.json]
help = "テキストの代わりに IPC 応答を JSON で出力する"

[cli.help._root.agent.task-get]
about = "task を 1 つ取得する"

[cli.help._root.agent.task-get.arg.workspace_id]
help = "ワークスペース id（フォーカス非依存 — 必須）"

[cli.help._root.agent.task-get.arg.id]
help = "task id"

[cli.help._root.agent.task-get.arg.json]
help = "テキストの代わりに IPC 応答を JSON で出力する。`typed_result.raw` と `input_snapshot` も含む"

[cli.help._root.agent.task-await]
about = "task が終端状態に達するまで待つ（ブロッキング）。応答の `outcome` を確認する: 終了コード 0 はタスクの成功を意味しない"
long = "task が終端状態に達するまで待つ（ブロッキング）。応答の `outcome` を確認する: 終了コード 0 はタスクの成功を意味しない。\n\n`--timeout-ms` を省略すると最大 10 分待つ（暫定のデフォルト）。`--timeout-ms 0` は無期限に待つ。応答の `outcome` は `terminal`（`state` に succeeded・failed など）、`timed_out`、`not_found` のいずれか。いずれも終了コード 0 なので、まず `outcome`、次に `state` を読む。ルートの `--response-timeout-ms` は CLI がサーバーの応答を待つ上限であり、タスクのタイムアウトではない。"

[cli.help._root.agent.task-await.arg.workspace_id]
help = "ワークスペース id（フォーカス非依存 — 必須）"

[cli.help._root.agent.task-await.arg.id]
help = "待つ task id"

[cli.help._root.agent.task-await.arg.timeout_ms]
help = "このミリ秒を過ぎたら待つのをやめる。`0` = 無期限に待つ"

[cli.help._root.agent.task-cancel]
about = "タスクをキャンセルします。後続タスクは on_failure に従って処理します。"

[cli.help._root.agent.task-cancel.arg.workspace_id]
help = "ワークスペース id（フォーカス非依存 — 必須）"

[cli.help._root.agent.task-cancel.arg.id]
help = "キャンセルする task id"

[cli.help._root.agent.task-retry]
about = "Failed/Cancelled/Skipped/Unknown の task をやり直す"

[cli.help._root.agent.task-retry.arg.workspace_id]
help = "ワークスペース id（フォーカス非依存 — 必須）"

[cli.help._root.agent.task-retry.arg.id]
help = "やり直す task id"

[cli.help._root.agent.task-retry.arg.reset_downstream]
help = "下流の Skipped/Failed の task も Waiting に戻す。型契約 (contract_version 2) の task では拒否される"

[cli.help._root.agent.task-graph]
about = "タスク DAG を親 ID 表、JSON または Graphviz dot で出力します"

[cli.help._root.agent.task-graph.arg.workspace_id]
help = "ワークスペース id（フォーカス非依存 — 必須）"

[cli.help._root.agent.task-graph.arg.format]
help = "形式: `table` | `json` | `dot`. デフォルト: `table` (親 ID 表). 表では、すべてのエッジの始点を親として一覧表示します。エッジの種類を確認するには、`json` または `dot` を使用してください"

[cli.help._root.agent.dag-list]
about = "登録済みタスクから DAG 一覧を計算します。同じ `metadata.dag` 文字列を持つタスクを 1 つのグループにし、残りは `depends_on` / `Fallback.task` / `Reduce.inputs` / `metadata.fallback_of` / v2 `bindings` / v2 `transitions` の接続を方向に関係なくたどってまとめます。DAG を別に保存することはありません。`--workspace` を省略すると現在の全ワークスペースを調べます。"

[cli.help._root.agent.dag-list.arg.workspace_id]
help = "1 つのワークスペースに絞る。省略すると生きているワークスペース全部"

[cli.help._root.agent.dag-list.arg.include_tasks]
help = "各 DAG の task id 一覧（`task_ids`）も一緒に出す"

[cli.help._root.agent.dag-get]
about = "（`dag-list` に表示される）DAG を 1 つ、親 ID 表、JSON または Graphviz dot で出力します。`task-graph` と同じノード/エッジ構造を使用し、対象をその DAG に限定します"

[cli.help._root.agent.dag-get.arg.id]
help = "`dag-list` が出した DAG id（`d:<metadata.dag>` または `c:<ルート task id>`）"

[cli.help._root.agent.dag-get.arg.workspace_id]
help = "照会するワークスペースを 1 つ指定します。ユーザーが指定した DAG ID が 2 つのワークスペースで重複した場合に、対象を区別するために使います。"

[cli.help._root.agent.dag-get.arg.format]
help = "形式: `table` | `json` | `dot`. デフォルト: `table` (親 ID 表). 表では、すべてのエッジの始点を親として一覧表示します。エッジの種類を確認するには、`json` または `dot` を使用してください"

[cli.help._root.agent.dag-report]
about = "DAG の report を出す — task ごとに保存された状態から作る自動項目と、試行ごとの custom 記録だ。`--include-raw` を付けなければ標準出力・エラーは含まない"

[cli.help._root.agent.dag-report.arg.dag]
help = "`dag-list` の DAG id (`d:<metadata.dag>` または `c:<ルート task id>`)"

[cli.help._root.agent.dag-report.arg.workspace_id]
help = "1 つのワークスペースだけで探す。省略すると稼働中の全ワークスペース"

[cli.help._root.agent.dag-report.arg.task]
help = "この task だけ"

[cli.help._root.agent.dag-report.arg.attempt]
help = "`--task` のこの試行だけ。retry で閉じた試行は、その retry のときに一度だけ固定した自動項目を載せる(この保存より前に閉じた試行は null)"

[cli.help._root.agent.dag-report.arg.include_raw]
help = "保存された標準出力・エラーも含める"

[cli.help._root.agent.report]
about = "実行中のタスク試行の report に custom 記録を残す"

[cli.help._root.agent.report.append]
about = "試行の report ブロックにテキスト記録を 1 つ追加する。`--address` がなければタスクランナーが起動したプロセスに渡す `TASTY_TASK_REPORT` からアドレスを読む。上限を超える記録は拒否せず切り詰めるか数える"

[cli.help._root.agent.report.append.arg.address]
help = "report アドレス (`TASTY_TASK_REPORT` の値または agent の指示文にある値)"

[cli.help._root.agent.report.append.arg.text]
help = "記録。プレーンテキストで、1 回の呼び出しが 1 項目だ"

[cli.help._root.agent.report.usage]
about = "report の書き方を出力する"

[cli.help._root.agent.task-run]
about = "ワークスペースのrunnerを起動・停止し、状態を確認します。startを繰り返しても重複起動しません。ホスト起動時に保存済みの状態は復元されますが、runnerは停止したままです"
long = "ワークスペースのrunnerを起動・停止し、状態を確認します。startを繰り返しても重複起動しません。ホスト起動時に保存済みの状態は復元されますが、runnerは停止したままです。\n\nrunnerを停止しても、開始済みのプロセスは実行を続け、タスクはRunningのまま残ります。ただし実行中の後処理は終了してキャンセルとして記録し、そのタスクはrunnerを再起動したときに失敗します。再起動するとハンドルを復元し、プロセスが動いているか、終了結果が保存されているかを確認します。"

[cli.help._root.agent.task-run.arg.workspace_id]
help = "runner を操作するワークスペース id（フォーカス非依存 — 必須）"

[cli.help._root.agent.task-run.arg.action]
help = "start | stop | status。デフォルト: status"

[cli.help._root.agent.task-set-result]
about = "task の終端の結果を手で報告する（succeeded | failed）。runner スレッドが dispatch していない外部・手動の task の完了を知らせるためのものだ"

[cli.help._root.agent.task-set-result.arg.workspace_id]
help = "ワークスペース id（フォーカス非依存 — 必須）"

[cli.help._root.agent.task-set-result.arg.id]
help = "結果を報告する task id"

[cli.help._root.agent.task-set-result.arg.state]
help = "終端状態: `succeeded` | `failed`"

[cli.help._root.agent.task-set-result.arg.output]
help = "任意の出力 JSON。インライン JSON か `@path/to/file.json` を受ける"

[cli.help._root.agent.task-set-result.arg.error]
help = "任意のエラーメッセージ（state=failed なら勧める）"

[cli.help._root.agent.task-set-result.arg.exit_code]
help = "任意のプロセス終了コード"

[cli.help._root.agent.task-set-result.arg.attempt_id]
help = "任意の typed task 実行回の id。別の実行回の報告は拒否する"

[cli.help._root.agent.task-submit]
about = "agent タスクの現在の試行に構造化された結果を提出します。値はその場でタスクの出力型と照合し、agent のターンが終わったときに結果になります。提出に成功してもタスクは終わりません。同じ値は再提出でき、同じ試行に別の値を出すと拒否されます"

[cli.help._root.agent.task-submit.arg.workspace_id]
help = "ワークスペース id（フォーカス非依存 — 必須）"

[cli.help._root.agent.task-submit.arg.id]
help = "agent タスク ID"

[cli.help._root.agent.task-submit.arg.attempt_id]
help = "指示に書かれた試行 ID。別の試行への提出は拒否されます"

[cli.help._root.agent.task-submit.arg.token]
help = "指示に書かれた試行トークン。別のトークンでの提出は拒否されます"

[cli.help._root.agent.task-submit.arg.output]
help = "結果 JSON。インライン JSON または `@path/to/file.json`"

[cli.help._root.agent.task-delete]
about = "タスクを削除します。depends_on / on_failure.fallback.task / reduce.inputs から参照されていれば既定では拒否し、参照元のタスク ID を返します。`Running` のタスクは `--cascade` や `--force` があっても削除できません。先にキャンセルしてください。"

