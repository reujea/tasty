about = "ファイルハンドラー経由でパスを開く（エクスプローラーのダブルクリックと同じ経路）"
long = "ファイルハンドラー経由でパスを開きます（エクスプローラーのダブルクリックと同じ経路）。\n\n受付応答（`run` 番号を含む）を 1 行出力したあと、最終結果を待って 2 行目に出力します。`state` は `succeeded` または `failed` で、`result` に何を開いたか、または開けなかった理由が出ます。開いたタブは `surface_id` で示します。最終状態が `succeeded` でなければ終了コード 1 で終わります。"

