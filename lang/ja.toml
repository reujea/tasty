[cli.help._root.agent.task-delete.arg.force]
help = "参照チェックだけを飛ばす — 状態の制約（Running）はそのまま適用される"

[cli.help._root.agent.task-purge]
about = "状態と経過時間の条件に一致するタスクを一括削除します。`--states` または `--older-than-ms` の少なくとも 1 つが必要です。Running の項目や、削除候補以外のタスクから参照される項目は残し、応答で報告します。"

