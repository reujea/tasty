long = "ID でハンドラー 1 件の action 全体を取得します。\n\n`list` は IpcSequence のステップ数だけを示しますが、`get` は実際の呼び出し配列を出力します。出力した `action` は `upsert --action` と同じ形式なので、編集してから再適用できます。"

