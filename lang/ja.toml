[cli.help._root.surface.html-remote-allow]
about = "リモートコンテンツの案内ボタンと同様に、htmlサーフェスが表示する文書にリモートコンテンツ（ネットワークのスタイルシート、画像、フォント、フレーム、スクリプト）を許可して再読み込み"
long = "リモートコンテンツの案内ボタンと同様に、htmlサーフェスが表示する文書にリモートコンテンツ（ネットワークのスタイルシート、画像、フォント、フレーム、スクリプト）を許可して再読み込みします。許可はこの文書にのみ適用され、スクリプトの許可とは別です。html-script が出力した url と fingerprint を渡すと、照会後に置き換わった文書は許可せず拒否します。結果フィールドは \"allowed\" または \"already_allowed\" です。拒否した場合は unsupported_view、globally_allowed、document_changed、loading、no_document、no_fingerprint のいずれかで理由を示します。フォーカス、選択、アクティブなタブ、案内は変わりません。対象は必ず --surface で指定します。ヘッドレスビルドでは使用できません。"

[cli.help._root.surface.html-remote-allow.arg.surface]
