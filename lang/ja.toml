[cli.help._root.plugin.install]
about = "tasty-plugin.toml のあるディレクトリから plugin をインストールする"
long = "tasty-plugin.toml のあるディレクトリからプラグインをインストールします。\n\n追加の確認なしで 2 つの処理を行います。マニフェストの全権限を付与し、その ID の無効化設定が残っていなければ有効化して起動します。インストール前に `tasty-plugin.toml` を確認してください。インストール後は `plugin permissions <id>` で権限を確認し、`plugin revoke <id> <permission>` で取り消せます。\n\nTasty が信頼済みの鍵で署名を確認できないプラグインは未検証です。`--allow-unverified` を指定しない限りインストールせず、その理由を表示します。この選択はマニフェストが変わるかプラグインを削除するまで記憶されます。"

