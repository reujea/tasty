hint_config = "`tasty webhook port` で保存したポートです。`tasty webhook port <空きポート>` で置き換えるか `tasty webhook port --unset` で削除すると、次回の起動から反映されます。または一度だけ `--webhook-port <空きポート>` で起動してください。"
