[cli.help._root.hook-handler.dispatch]
about = "登録済みフックハンドラーをIDで手動実行（テスト・自動化の入口）"
long = "登録済みフックハンドラーをIDで手動実行します（テスト・自動化の入口）。IpcSequenceハンドラーでは `--body`/`--header`/`--query` で `${body.x}`/`${header.x}`/`${query.x}` の値を埋めます。1行目に受付応答（`run` 番号付き）を出力し、最終結果を待って2行目に出力します。`state` は `succeeded`・`partial`・`failed`・`unknown` のいずれかで、`result` は何が起きたか、`steps` はステップごとの結果です。シェルコマンドハンドラーはプロセスが起動すれば成功で、`exit_code` は終了後に入り、判定には使いません。最終状態が `succeeded` でなければ終了コード 1 で終わります。"

