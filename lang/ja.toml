# 전체 디스크 접근은 Automation·화면 기록·손쉬운 사용 권한과 별개다.
# body 강조 표기: **도입부** · *설정 경로* · `명령` (info modal 셸이 해석한다).
[macos_permissions.notice]
title = "許可されていない権限があります"
intro = """Tasty で実行したコマンドがユーザーに代わってファイルを読み書きし、macOS はそのアクセスを Tasty のものとして扱います。権限がないと、作業の途中でダイアログが表示されて中断されたり、機能が動作しなかったりすることがあります。

現在、許可されていないと見られる権限があります。どの権限がどの状態かは、*設定 > 一般 > 権限* で確認できます。"""
fda_never = "**フルディスクアクセス:** macOS はアプリがこの権限を要求する手段を用意していません。*システム設定 > プライバシーとセキュリティ > フルディスクアクセス*で Tasty を自分で追加してください。この権限を与えるとファイルアクセスのダイアログ(他アプリのデータ、ダウンロード、書類、デスクトップ、マウント済みボリューム)が出なくなります。ただし他アプリの制御(Automation / Apple Events、例: osascript)・画面収録・アクセシビリティは別の権限なので引き続きダイアログが出ます。"
fda_stale = "**フルディスクアクセス:** Tasty にはこの権限がありましたが、その後 Tasty が変わりました(アップデートまたは再ビルド)。macOS は権限をそのアプリそのものに結び付けています。*システム設定 > プライバシーとセキュリティ > フルディスクアクセス*では、Tasty の項目がオンのまま見えたり、一覧から消えていたりすることがあります。"
fda_stale_step_remove = "一覧で Tasty を選び、− で削除してください。"
fda_stale_step_add = "+ で Tasty をもう一度追加し、オンにしてください。"
fda_stale_retry = "それでもアクセスに失敗する場合は、Tasty を終了して開き直してください。"
fda_revoked = "**フルディスクアクセス:** Tasty にはこの権限がありましたが、Tasty の外でオフにされました。*システム設定 > プライバシーとセキュリティ > フルディスクアクセス*で Tasty をもう一度オンにしてください。一覧に Tasty がない場合(例: `tccutil reset` の後)は、+ でもう一度追加してオンにしてください。"
fda_covers = "**この権限の範囲:** この権限を与えるとファイルアクセスのダイアログ(他アプリのデータ、ダウンロード、書類、デスクトップ、マウント済みボリューム)が出なくなります。ただし他アプリの制御(Automation / Apple Events、例: osascript)・画面収録・アクセシビリティは別の権限なので引き続きダイアログが出ます。"
screen_recording = "**画面収録:** スクリーンショット機能が使用します。*システム設定 > プライバシーとセキュリティ > 画面とシステムオーディオの収録*で有効にしてください。一度拒否するとアプリからは再度尋ねられず、システム設定からのみ有効にできます。"
self_built = "ダウンロードした配布版も自分でビルドした Tasty も ad-hoc 署名のため、アップデートや再ビルドのたびに macOS から別のアプリに見え、以前の権限は適用されなくなります。Tasty を自分でビルドして使う場合は、先に \"Tasty Dev\" 証明書で署名してください(`./scripts/macos-codesign-identity.sh --create`)。"
closing = "権限を与えればこの案内は表示されなくなります。案内をオフにする設定はありません。オフにした記録を残すと、後で権限がリセットされたときに知らせる手段がなくなるためです。"
open_settings = "権限設定を開く"

# CLI 도움말. 영어 값은 소스에서 생성되는 clap 도움말과 정확히 같아야 한다.
[cli.help._root]
about = "AI コーディングエージェントのための GPU アクセラレーテッドターミナルエミュレータ"

[cli.help._root.arg.port_file]
help = "ポートファイルのパスを指定（テスト分離用）"

[cli.help._root.arg.webhook_port]
help = "この実行の Webhook リスナーポート。`tasty webhook port` で保存したポートより優先する。ポートを開けない場合 Tasty はリスナーなしで実行し、警告通知を残す"
long = "この実行の Webhook リスナーポート。`tasty webhook port` で保存したポートより優先する。ポートを開けない場合 Tasty はリスナーなしで実行し、警告通知を残す。\n\nこの場合ほかのポートには移らない。このオプションも保存済みポートもなければ、28429 から続く 63 個のポートを試し、最初に空いているポートを使う。"

[cli.help._root.arg.response_timeout_ms]
help = "1 回のリクエストに対するサーバーの応答待ち上限 (ミリ秒)。-32061 の場合は結果が不明で、リクエストは実行を続けている可能性がある。0 または未指定なら上限なし"
long = "1 回のリクエストに対するサーバーの応答待ち上限 (ミリ秒)。-32061 の場合は結果が不明で、リクエストは実行を続けている可能性がある。0 または未指定なら上限なし。\n\n処理開始後に制限に達するとサーバーは -32061 を返す。キューで待機中に制限に達すると -32067 を返し、リクエストは実行されない。インスタンスが ipc.response-timeout の対応を通知しない場合、元のリクエストは送信しない。対応確認にかかった時間はリクエストの残り時間から差し引く。確認がタイムアウトするか残り時間を使い切ると -32067 を返し、元のリクエストは送信しない。確認中は個々のソケット読み取りにもタイムアウトを設定する。このオプションは接続、送信、繰り返しの読み取りを含む処理全体の絶対期限ではない。ループやストリームを行うコマンドでは使えない"

[cli.help._root.arg.launch]
help = "tasty ターミナル内でも GUI を強制的に起動する"

[cli.help._root.arg.headless]
help = "ヘッドレスで実行 (GUI なし)。ヘッドレスは no-default-features ビルドのみで、GUI ビルドは警告を残してウィンドウを開く"
long = "ヘッドレスで実行 (GUI なし)。ヘッドレスは no-default-features ビルドのみで、GUI ビルドは警告を残してウィンドウを開く。\n\nヘッドレスは IPC、PTY、プラグインのみを実行する。GUI ビルド (default features) にはヘッドレスモードが含まれない。このオプションは警告を記録してそのまま GUI を起動し、引き継いだ DISPLAY にウィンドウが開く。"

