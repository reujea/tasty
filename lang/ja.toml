long = "ターミナル内プログラムのマウス入力捕捉状態とレベルを出力します。マウスシーケンス送信やドラッグ選択の前に確認してください。追跡が有効ならプログラムが入力を消費し、無効ならシーケンスが画面に不要な文字として表示されます。対象は必ず --surface で指定します。"

