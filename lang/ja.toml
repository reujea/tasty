report_address_invalid = "エラー: {}"
report_usage = """
タスク report: 実行中のタスク試行に記録を残します。

  tasty agent report append --address '<アドレス>' '<テキスト>'

アドレスは渡された値を使います (agent の指示文には "Report address" として表示されます)。タスクランナーが起動したプロセス (run タスク、その後処理コマンド、custom reduce シェル) は TASTY_TASK_REPORT にアドレスがあるため --address を省略できます。

  tasty agent report append '<テキスト>'

- プレーンテキストで書きます。1 回の呼び出しが 1 項目で、後続タスクが読むデータではなく人が読む記録です。
- append 上限 (設定で変えていなければ 1 KiB) を超える項目は切り詰められ omit_by_limit が付きます。試行のブロックがいっぱいになると、以降の記録は omitted_appends として数えるだけです。どちらの場合もコマンドは成功し何も出力しないため、標準出力がタスクの結果になるコマンドの中で使っても結果に影響しません。
- 試行の実行中だけ受け付けます。試行が終わるとアドレスは閉じられ、コマンドは失敗します。
- run タスクはこのコマンドの代わりに ::tasty-report:: で始まる標準エラー行を出力してもかまいません。
- report の参照: tasty agent dag-report <DAG ID> [--task <タスク ID> [--attempt <番号>]]"""

