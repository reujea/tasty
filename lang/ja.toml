[cli.help._root.surface.html-script]
about = "htmlサーフェスのスクリプト・リモートコンテンツの状態を出力：現在の文書の検出結果、スクリプト実行とリモートコンテンツ読み込みの許可の有無、案内の状態"
long = "htmlサーフェスのスクリプト・リモートコンテンツの状態を出力します。現在の文書の検出結果、スクリプト実行とリモートコンテンツ読み込みの許可の有無、案内の状態を表示します。照会のみのため、バナーを表示したりユーザーが文書を見たと記録したりしません。対象は必ず --surface で指定します。ヘッドレスビルドでは使用できません。"

[cli.help._root.surface.html-script.arg.surface]
help = "サーフェスID（必須）"

[cli.help._root.surface.html-script-allow]
about = "バナーのボタンと同様に、htmlサーフェスが表示する文書のスクリプトを許可して再読み込み"
long = "バナーのボタンと同様に、htmlサーフェスが表示する文書のスクリプトを許可して再読み込みします。html-script が出力した url と fingerprint を渡すと、照会後に置き換わった文書は許可せず拒否します。結果フィールドは \"allowed\" または \"already_allowed\" です。拒否した場合は document_changed、loading、no_document、no_fingerprint のいずれかで理由を示します。フォーカス、選択、アクティブなタブは変わりません。対象は必ず --surface で指定します。ヘッドレスビルドでは使用できません。"

