[cli.help._root.surface.html-nav]
about = "html サーフェスが表示している文書のアドレスと、履歴で戻る・進むができるかを出力"
long = "html サーフェスが表示している文書のアドレスと、履歴で戻る・進むができるかを出力します。アドレスは最後に commit されたものです。リダイレクト後は最終アドレス、#fragment 移動後はその fragment 付きのアドレスで、読み込み中や読み込み失敗後は前の文書のアドレスです。照会のみです。対象は必ず --surface で指定します。ヘッドレスビルドでは使用できません。"

