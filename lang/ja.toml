long = "SSH 経由でリモートの tasty インスタンスに接続できるか確認します。\n\n`tasty port` またはポートファイルでリモートポートを探し、`ssh -L` トンネルを開いて `system.info` を要求します。成功応答を受け取ると接続可能と判断します。接続失敗、タイムアウト、不正な応答、エラー応答は確認に失敗したことを示しますが、それだけでサーバーの終了を意味するわけではありません。引数名は `remote attach` と同じです。"

