intro = """Commands you run in Tasty read and write files on your behalf, and macOS attributes that access to Tasty. Without permission, a prompt may interrupt your work or a feature may not work.

Some permissions currently look like they are not granted. *Settings > General > Permissions* shows which ones and what state they are in."""
fda_never = "**Full Disk Access:** macOS has no way for an app to ask for this, so add Tasty yourself in *System Settings > Privacy & Security > Full Disk Access*. Granting it removes the file-access prompts (other apps' data, Downloads, Documents, Desktop and mounted volumes). It does not cover controlling other apps (Automation / Apple Events, e.g. osascript), screen recording, or accessibility: those are separate permissions and will still prompt."
fda_stale = "**Full Disk Access:** Tasty had this permission, but Tasty has changed since (an update or a rebuild) and macOS ties the permission to the exact app. In *System Settings > Privacy & Security > Full Disk Access* the entry for Tasty may still look switched on, or may be missing."
