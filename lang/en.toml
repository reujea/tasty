about = "Remote (SSH) attach to a surface/workspace on another host — `remote attach`"

[cli.help._root.remote.attach]
about = "Attach to a remote surface/workspace over SSH (one-shot)"
long = "Attach to a remote surface/workspace over SSH (one-shot).\n\nOpens an `ssh -L` tunnel and runs the attach session through it; the remote target comes from `--ssh` or `--profile`."

[cli.help._root.remote.attach.arg.surface]
help = "Target surface id (given explicitly, never inferred from focus). Mutually exclusive with `--workspace`"

[cli.help._root.remote.attach.arg.workspace]
help = "Target workspace id; mirrors every terminal in it as a tree. Mutually exclusive with the `surface` positional. Non-terminal surfaces are shown as placeholders"

[cli.help._root.remote.attach.arg.dump_after]
help = "Mirror-dump mode: collect output for N ms after attaching, print the mirrored screen to stdout, then exit (automated verification without a GUI). In workspace mode each surface is printed as its own section"

[cli.help._root.remote.attach.arg.send]
help = "Input to send once right after attaching (escapes decoded: \\n \\r \\t \\xNN). For non-interactive verification"

[cli.help._root.remote.attach.arg.send_to]
help = "Remote surface id that receives the `--send` input in workspace mode"

[cli.help._root.remote.attach.arg.raw]
help = "Raw bridge mode: stdin/stdout passthrough (detach with Ctrl+\\)"

[cli.help._root.remote.attach.arg.force_detach]
help = "Forcibly release the attach lock on an occupied surface/workspace (server-side; does not attach). Sends the local `attach.force_detach` request to this server to release a remote client's lock. Mutually exclusive with `--ssh` (force-detach through a tunnel is not supported)"

[cli.help._root.remote.attach.arg.ssh]
help = "Remote SSH target, e.g. --ssh user@host or --ssh gx10. Mutually exclusive with `--profile`"

[cli.help._root.remote.attach.arg.profile]
help = "Attach using a saved tasty-attach profile name. The profile is resolved from `~/.tasty/remote-profiles.toml` to supply user/port/identity/extra options. Mutually exclusive with `--ssh`. The profile's values replace `--remote-tasty` and `--remote-port-mode`"

[cli.help._root.remote.attach.arg.remote_tasty]
help = "Path to the tasty binary on the remote host, used by the subcommand step of port discovery (`ssh host <path> port`). Defaults to \"tasty\" (assumed to be on the remote PATH)"

[cli.help._root.remote.attach.arg.remote_port_mode]
help = "Remote port discovery mode: auto (default) | subcommand | file-unix | file-windows"

[cli.help._root.remote.attach.arg.no_reconnect]
help = "Disable automatic reconnection (by default the session reconnects with backoff when SSH drops)"

[cli.help._root.remote.attach.arg.into_gui]
help = "Ask the local GUI to become the client and rebuild the remote workspace as a mirror (`attach.into_gui` IPC). Requires `--workspace` and `--target-port`"

[cli.help._root.remote.attach.arg.target_port]
help = "Loopback port of the remote tasty server for `--into-gui` (the port the GUI connects to)"

[cli.help._root.remote.check]
about = "Check whether a remote tasty instance is alive over SSH"
long = "Check whether a remote tasty instance is alive over SSH.\n\nPort discovery alone (`tasty port` / the port file) can mistake a stale port file left by a dead instance for a live one, so after discovering the port this opens an `ssh -L` tunnel and sends one lightweight IPC request (`system.info`). The instance counts as alive only if it responds; a refused connection or a timeout means dead (stale port). Argument names match `remote attach`."

[cli.help._root.remote.check.arg.ssh]
help = "Remote SSH target, e.g. --ssh user@host or --ssh gx10. Mutually exclusive with `--profile`"

[cli.help._root.remote.check.arg.profile]
help = "Check using a saved tasty-attach profile name. The profile is resolved from `~/.tasty/remote-profiles.toml` to supply user/port/identity/extra options. Mutually exclusive with `--ssh`. The profile's values replace `--remote-tasty` and `--remote-port-mode`"

[cli.help._root.remote.check.arg.remote_tasty]
help = "Path to the tasty binary on the remote host, used by the subcommand step of port discovery (`ssh host <path> port`). Defaults to \"tasty\" (assumed to be on the remote PATH)"

[cli.help._root.remote.check.arg.remote_port_mode]
help = "Remote port discovery mode: auto (default) | subcommand | file-unix | file-windows"

[cli.help._root.remote.workspaces]
about = "List the workspaces of a remote tasty instance over SSH"
long = "List the workspaces of a remote tasty instance over SSH.\n\nConnects to the ssh target or attach profile, fetches the remote `workspace.list` and `attach.list`, and merges them: each workspace is reported with its id, name, pane count, busy flag, and whether another client has it attached. Use this to discover the workspace id that `remote attach --workspace` expects. Read-only; the local user's state (focus etc.) is untouched. `--ssh 127.0.0.1:<port>` connects directly over loopback without a tunnel (local end-to-end checks).\n\nThe local IPC method `remote.workspaces` exposes the same capability."

[cli.help._root.remote.workspaces.arg.ssh]
help = "Remote SSH target, e.g. --ssh user@host, --ssh gx10, or --ssh 127.0.0.1:45123. Mutually exclusive with `--profile`"

[cli.help._root.remote.workspaces.arg.profile]
help = "List using a saved tasty-attach profile name. Mutually exclusive with `--ssh`. The profile's values replace `--remote-tasty` and `--remote-port-mode`"

[cli.help._root.remote.workspaces.arg.remote_tasty]
help = "Path to the tasty binary on the remote host (used by the subcommand step of port discovery). Defaults to \"tasty\""

[cli.help._root.remote.workspaces.arg.remote_port_mode]
help = "Remote port discovery mode: auto (default) | subcommand | file-unix | file-windows"

[cli.help._root.remote.workspaces.arg.json]
help = "Print a JSON array instead of human-readable text (for scripts and UI consumers)"

[cli.help._root.remote.new-workspace]
about = "Create a new workspace on a remote tasty instance over SSH"
long = "Create a new workspace on a remote tasty instance over SSH.\n\nThe write-side counterpart of `remote workspaces`. Pass the printed id to `tasty remote attach --workspace <id>` to create a workspace remotely and attach to it in one go. The remote's active workspace does not change. The local IPC method `remote.attach` exposes the same capability through its `new_workspace` option."

[cli.help._root.remote.new-workspace.arg.ssh]
help = "Remote SSH target, e.g. --ssh user@host, --ssh gx10, or --ssh 127.0.0.1:45123. Mutually exclusive with `--profile`"

[cli.help._root.remote.new-workspace.arg.profile]
help = "Create using a saved tasty-attach profile name. Mutually exclusive with `--ssh`. The profile's values replace `--remote-tasty` and `--remote-port-mode`"

[cli.help._root.remote.new-workspace.arg.remote_tasty]
help = "Path to the tasty binary on the remote host (used by the subcommand step of port discovery). Defaults to \"tasty\""

[cli.help._root.remote.new-workspace.arg.remote_port_mode]
help = "Remote port discovery mode: auto (default) | subcommand | file-unix | file-windows"

[cli.help._root.remote.new-workspace.arg.name]
help = "Name of the new workspace (remote default if omitted)"

[cli.help._root.remote.new-workspace.arg.cwd]
help = "Working directory of the new workspace, as a path on the remote filesystem. The remote checks that it exists and rejects the request with `cwd does not exist` otherwise"

[cli.help._root.remote.new-workspace.arg.json]
help = "Print a JSON object instead of human-readable text (for scripts and agents)"

