# CLI 도움말. 영어 값은 소스에서 생성되는 clap 도움말과 정확히 같아야 한다.
[cli.help._root]
about = "GPU-accelerated terminal emulator for AI coding agents"

[cli.help._root.arg.port_file]
help = "Custom port file path (for test isolation)"

[cli.help._root.arg.webhook_port]
help = "Webhook listener port for this run, overriding `tasty webhook port`. If it cannot be opened, Tasty runs without the listener and leaves a warning notification"
long = "Webhook listener port for this run, overriding `tasty webhook port`. If it cannot be opened, Tasty runs without the listener and leaves a warning notification.\n\nTasty does not move to another port in that case. Without this option and without a saved port, Tasty tries 28429 and the next 63 ports and takes the first free one."

[cli.help._root.arg.response_timeout_ms]
help = "Server response wait limit for one request, in milliseconds. On -32061 the outcome is unknown and the request may still run; 0 or no flag means no limit"
long = "Server response wait limit for one request, in milliseconds. On -32061 the outcome is unknown and the request may still run; 0 or no flag means no limit.\n\nIf the limit expires after processing starts, the server returns -32061. If it expires while queued, the server returns -32067 and the request did not run. The instance must declare ipc.response-timeout; otherwise the original request is not sent. Time spent checking support is subtracted from the request's remaining budget. If the check times out or uses up that budget, the result is -32067 and the original request is not sent. The check also sets a timeout for each socket read. This option is not an absolute deadline covering connection setup, sending, and repeated reads. Commands that loop or stream refuse the flag"

[cli.help._root.arg.launch]
help = "Force GUI launch even inside a tasty terminal"

[cli.help._root.arg.headless]
help = "Run headless (no GUI). Only a no-default-features build is headless; a GUI build warns and still opens a window"
long = "Run headless (no GUI). Only a no-default-features build is headless; a GUI build warns and still opens a window.\n\nHeadless mode runs IPC, PTYs and plugins only. A default-features (GUI) build does NOT embed headless mode: this flag logs a warning and boots the GUI anyway, so a window opens on whatever DISPLAY it inherits."

[cli.help._root.arg.all]
help = "Show all commands in a tree. Only valid before any command; see each command's --help for its arguments"

[cli.help._root.arg.enable_input_simulation]
help = "Enable input simulation IPC (debug builds only). Required for debug.inject_mouse, debug.inject_key, etc"

[cli.help._root.new]
about = "Create a new resource (window, workspace, tab)"

[cli.help._root.new.window]
about = "Create a new window"

[cli.help._root.new.workspace]
about = "Create a new workspace"

