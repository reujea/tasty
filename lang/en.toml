about = "Close a whole workspace by its ID, with every pane, tab and surface in it"
long = "Close a whole workspace by its ID, with every pane, tab and surface in it.\n\nThis cannot be undone: every terminal in the workspace is killed, the workspace does not enter the user's reopen history, and its scrollback is not kept. Only closes the user made by hand can be reopened.\n\nThe target is always given explicitly with --workspace (see `tasty list workspaces`); it is never inferred from what is on screen. Closing a workspace the user is not looking at leaves their current workspace on screen. A workspace holding your own surface is refused, as is a workspace mirroring a remote attach session and the last remaining workspace - closing the window is a separate decision, see `tasty close window`."

