[cli.help._root.list.pressure]
about = "Show IPC pressure and diagnostic statistics since this instance started"
long = "Show IPC pressure and diagnostic statistics since this instance started.\n\nThe blocks measure different requests and must not be subtracted: queue_before_gate includes requests later rejected by permissions; handler_after_gate covers handled requests; plugin_round_trip covers answered plugin calls; db covers successful database commits. A request may pass the gate and receive an answer before handler timing.\n\nconnections counts TCP connections, including attach and mesh streams. live is current usage, limit is the enforced ceiling, and refused_saturated counts connections rejected before they made requests. Cumulative counts do not decrease; live and derived means can decrease. accept_waits equals accepted + refused_saturated. The accept_wait_bound_us_sum/max/mean fields bound time in the OS accept queue using elapsed time since that queue was last observed empty. They are bounds, not measured waits. The empty-queue sleep is 100 ms.\n\nqueue_before_gate, handler_after_gate, and plugin_round_trip also have histograms. bounds_us contains the limits; counts has one extra overflow bucket and is not cumulative. Counts sum to the observation count. Quantiles are not calculated. db and connections have no histogram. queue_before_gate.waits is the denominator of wait_us_mean and the sum of wait_us_hist.counts. commands updates at the end of a dispatch round, so it can lag waits during the current round, including this query.\n\ndb_pragmas compares requested and actual settings for memory_db and state_db. degraded reports a setting mismatch or, for memory_db, an in-memory fallback after file-open failure. init_failure records that failure or is null. The fallback database remains usable. state_db is null when unopened, including in headless instances.\n\nstream_push counts attach/mesh frames: frames_dropped records full-queue drops on live connections; clients_lagged_out records disconnected slow clients. backlog is current queued frames across live connections, and sink_capacity is the limit for one connection.\n\nqueue_admission reports current bytes, commands, injected commands, peak bytes, and the limit_bytes/limit_injected_depth ceilings. refused_bytes and refused_depth count requests rejected before entering the queue; they appear in no other block. The block is null without an IPC server. queue_dispatch records rounds, command/time budget stops, expired_before_run, commands started, and current/peak in_flight requests. A started request remains in_flight until both the command and its response waiter release the shared lifecycle state.\n\nkeyed_requests counts each keyed request once: executed, replayed, conflicted (nothing ran), discarded (answer was not retained), or in_flight (joined an existing request). This in_flight is a cumulative decision count, unlike the current count in queue_dispatch.\n\nslow_requests retains requests whose queue wait + host time + plugin waits meet threshold_us (100 ms), oldest first, up to capacity. Rows contain request_seq (neither JSON-RPC id nor trace id), method, caller, queue_wait_us, host_us, and plugin_hops. Each hop includes its plugin, host_request_id, wait, and outcome. admitted counts all retained rows; admitted minus rows shown counts evictions. The query excludes itself. A row's host outcome is ok/error and error_code is its JSON-RPC error, distinguishing expiry (-32067), refusal (-32001), and success. Both are null before an answer, for example while waiting for a plugin.\n\ngate_refusals.judged counts requests reaching permission checks, including Local and plugin callers. Gates run in order: permission_denied (-32001), cap_blocked (-32007), then throttled (-32010). A request is counted in at most one refusal slot. Permission refusal can mean missing permission, an unknown method, or a method forbidden to that caller; a grant only addresses the first case. Local callers without a token pass this gate. Invalid/expired/revoked session tokens are rejected before judged, while -32001 errors after the gate count as passed. Malformed idempotency keys are not counted here. These totals reset at restart; the per-bucket throttled_count in agent rate-limit-status persists and is a different count.\n\nAn average with no observations is null, not zero."

