long = "Secret memory store. CLI acts as `_host` owner; no --owner flag exists. Plugin secret areas are inaccessible from the CLI by design.\n\nSecret means \"another owner cannot read it\", and nothing beyond that. The values sit as plain bytes in the same `memory.db`, so whoever can open that file reads them — the separation is enforced on the IPC path, not on disk. For something that has to survive that, use the OS keyring, or keep the data in a file of its own with its own permissions and store only the path here."

