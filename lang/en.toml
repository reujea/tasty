long = "Create or edit a user handler in place, without opening the TOML by hand.\n\nFields that are not given are left as they are — this patches the handler rather than replacing it, so the id, and every binding that refers to it, survive the edit. At least one field must be given. The change is written to `~/.tasty/hook-handlers.toml` right away.\n\nAn IpcSequence that a webhook was already bound to keeps firing what it captured at registration time; re-register the webhook to pick this up."

