[cli.help._root.agent.task-graph.arg.format]
help = "Format: table | json | dot. Default: table (parent ID table). The table lists every edge source as a parent; use json or dot to see edge kinds"

[cli.help._root.agent.dag-list]
about = "List every registered DAG. A DAG is derived, not stored: tasks tagged with the same `metadata.dag` string form one explicit group, and the rest are grouped by weak connectivity (`depends_on` / `Fallback.task` / `Reduce.inputs` / `metadata.fallback_of` / v2 `bindings` / v2 `transitions`). Omit `--workspace` to scan every live workspace"

[cli.help._root.agent.dag-list.arg.workspace_id]
help = "Restrict to one workspace. Omitted = every live workspace"

[cli.help._root.agent.dag-list.arg.include_tasks]
help = "Also include each DAG's task id list (`task_ids`)"

[cli.help._root.agent.dag-get]
about = "Output one DAG (as listed by `dag-list`) as a parent ID table, JSON or Graphviz dot — the same node/edge shape as `task-graph`, restricted to that DAG"

[cli.help._root.agent.dag-get.arg.id]
help = "DAG id from `dag-list` (`d:<metadata.dag>` or `c:<root task id>`)"

[cli.help._root.agent.dag-get.arg.workspace_id]
help = "Restrict the lookup to one workspace. Explicit ids are user-chosen, so two workspaces can carry the same one; pass this to disambiguate"

[cli.help._root.agent.dag-get.arg.format]
help = "Format: table | json | dot. Default: table (parent ID table). The table lists every edge source as a parent; use json or dot to see edge kinds"

[cli.help._root.agent.dag-report]
about = "Output a DAG's report: for each task, the automatic part projected from its stored state and the custom notes of every attempt. Standard output and error are left out unless `--include-raw` is given"

[cli.help._root.agent.dag-report.arg.dag]
help = "DAG id from `dag-list` (`d:<metadata.dag>` or `c:<root task id>`)"

[cli.help._root.agent.dag-report.arg.workspace_id]
help = "Restrict the lookup to one workspace. Omitted = every live workspace"

[cli.help._root.agent.dag-report.arg.task]
help = "Only this task"

[cli.help._root.agent.dag-report.arg.attempt]
help = "Only this attempt of `--task`. An attempt closed by a retry shows the automatic part saved once at that retry (null for an attempt closed before this was saved)"

[cli.help._root.agent.dag-report.arg.include_raw]
help = "Include the stored standard output and error"

[cli.help._root.agent.report]
about = "Write custom notes to the report of the task attempt you are running"

[cli.help._root.agent.report.append]
about = "Append one text note to the attempt's report block. Without `--address` the address comes from `TASTY_TASK_REPORT`, which the task runner gives to the processes it starts. Notes over the limits are cut or counted, not refused"

[cli.help._root.agent.report.append.arg.address]
help = "Report address (`TASTY_TASK_REPORT` value or the one in an agent instruction)"

[cli.help._root.agent.report.append.arg.text]
help = "The note. Plain text; one call is one entry"

[cli.help._root.agent.report.usage]
about = "Print how to write report notes"

[cli.help._root.agent.task-run]
about = "Start, stop, or inspect a workspace runner. Starting it twice is idempotent. The host restores saved state at startup but leaves runners stopped"
long = "Start, stop, or inspect a workspace runner. Starting it twice is idempotent. The host restores saved state at startup but leaves runners stopped.\n\nStopping a runner stops completion checks, not its dispatched processes. Their tasks remain Running. The exception is a running postprocess: it is ended and recorded as cancelled, and its task fails when the runner starts again. Starting again restores handles and checks whether processes are alive or have a saved exit result."

[cli.help._root.agent.task-run.arg.workspace_id]
help = "Workspace id whose runner is being controlled (focus-independent — required)"

[cli.help._root.agent.task-run.arg.action]
help = "start | stop | status. Default: status"

[cli.help._root.agent.task-set-result]
about = "Manually report a task's terminal result (succeeded | failed). For signalling completion of external/manual tasks that the runner thread did not dispatch"

[cli.help._root.agent.task-set-result.arg.workspace_id]
help = "Workspace id (focus-independent — required)"

[cli.help._root.agent.task-set-result.arg.id]
help = "Task id whose result is being reported"

[cli.help._root.agent.task-set-result.arg.state]
help = "Terminal state: `succeeded` | `failed`"

[cli.help._root.agent.task-set-result.arg.output]
help = "Optional output JSON. Accepts inline JSON or `@path/to/file.json`"

[cli.help._root.agent.task-set-result.arg.error]
help = "Optional error message (recommended for state=failed)"

[cli.help._root.agent.task-set-result.arg.exit_code]
help = "Optional process exit code"

[cli.help._root.agent.task-set-result.arg.attempt_id]
help = "Optional attempt id of a typed task run; a report for another attempt is rejected"

[cli.help._root.agent.task-submit]
about = "Submit the structured result of an agent task's current attempt. The value is checked against the task's output type now and becomes the result when the agent's turn ends; a successful submission does not finish the task. The same value may be submitted again; a different value for the same attempt is rejected"

[cli.help._root.agent.task-submit.arg.workspace_id]
help = "Workspace id (focus-independent — required)"

[cli.help._root.agent.task-submit.arg.id]
help = "Agent task id"

[cli.help._root.agent.task-submit.arg.attempt_id]
help = "Attempt id the instruction named; a submission for another attempt is rejected"

[cli.help._root.agent.task-submit.arg.token]
help = "Attempt token the instruction named; a submission with another token is rejected"

[cli.help._root.agent.task-submit.arg.output]
help = "Result JSON. Accepts inline JSON or `@path/to/file.json`"

[cli.help._root.agent.task-delete]
about = "Delete a task. Rejected by default if other tasks still reference it (depends_on / on_failure.fallback.task / reduce.inputs) — the referencing task IDs are returned. `Running` tasks are always rejected regardless of `--cascade`/`--force` (cancel first)"

[cli.help._root.agent.task-delete.arg.workspace_id]
help = "Workspace id (focus-independent — required)"

[cli.help._root.agent.task-delete.arg.id]
help = "Task id to delete"

[cli.help._root.agent.task-delete.arg.cascade]
help = "Also delete every task that transitively references this one"

[cli.help._root.agent.task-delete.arg.force]
help = "Skip the reference check only — state constraints (Running) still apply"

[cli.help._root.agent.task-purge]
about = "Bulk-delete tasks matching state/age filters. At least one of `--states`/`--older-than-ms` is required. Only tasks that are safe to delete (not Running, not referenced from outside the matched set) are actually removed; the rest are reported as retained"

[cli.help._root.agent.task-purge.arg.workspace_id]
help = "Workspace id (focus-independent — required)"

[cli.help._root.agent.task-purge.arg.states]
help = "Comma-separated state names (waiting|ready|running|succeeded|failed|cancelled|skipped|unknown)"

[cli.help._root.agent.task-purge.arg.older_than_ms]
help = "Only tasks whose age (created_at, or finished_at for terminal tasks) exceeds this many milliseconds are candidates"

[cli.help._root.agent.task-purge.arg.dry_run]
help = "Compute and print the plan without deleting anything"

[cli.help._root.agent.barrier-create]
about = "Create a barrier that closes after N signals"
long = "Create a barrier that closes after N signals.\n\nExpiry is checked on the next barrier-signal, barrier-state, or barrier-list call, not by a timer. A timed-out barrier rejects signals and remains until barrier-delete."

[cli.help._root.agent.barrier-create.arg.workspace_id]
help = "Workspace id (focus-independent — required)"

[cli.help._root.agent.barrier-create.arg.name]
help = "Barrier name (unique within the workspace)"

[cli.help._root.agent.barrier-create.arg.count_required]
help = "Required signal count (must be >= 1)"

[cli.help._root.agent.barrier-create.arg.timeout_ms]
help = "Optional timeout in milliseconds, measured from creation time. Omit for a barrier that waits forever"

[cli.help._root.agent.barrier-signal]
about = "Signal a barrier (count_signaled++)"

[cli.help._root.agent.barrier-signal.arg.workspace_id]
help = "Workspace id (focus-independent — required)"

[cli.help._root.agent.barrier-signal.arg.name]
help = "Barrier name to signal"

[cli.help._root.agent.barrier-await]
about = "Read a barrier's current state (older name of barrier-state). Returns immediately; it does not wait"

