help = "Raw bridge mode: stdin/stdout passthrough (detach with Ctrl+\\)"

[cli.help._root.remote.attach.arg.ssh]
help = "Remote SSH target, e.g. --ssh user@host or --ssh gx10. Mutually exclusive with `--profile`"

[cli.help._root.remote.attach.arg.profile]
help = "Attach using a saved tasty-attach profile name. The profile is resolved from `~/.tasty/remote-profiles.toml` to supply user/port/identity/extra options. Mutually exclusive with `--ssh`. The profile's values replace `--remote-tasty` and `--remote-port-mode`"

