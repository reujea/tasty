[cli.help._root.agent.task-await]
about = "Wait for a task to reach a terminal state (blocking). Check the reply's `outcome`: exit status 0 does not mean the task succeeded"
long = "Wait for a task to reach a terminal state (blocking). Check the reply's `outcome`: exit status 0 does not mean the task succeeded.\n\nWithout `--timeout-ms` it waits up to 10 minutes (provisional default); `--timeout-ms 0` waits indefinitely. The reply's `outcome` is `terminal` (with `state`, for example succeeded or failed), `timed_out`, or `not_found`. All three exit with status 0, so read `outcome` first and then `state`. The root `--response-timeout-ms` only bounds how long the CLI waits for the server's reply; it is not the task's timeout."

[cli.help._root.agent.task-await.arg.workspace_id]
help = "Workspace id (focus-independent — required)"

[cli.help._root.agent.task-await.arg.id]
help = "Task id to wait on"

[cli.help._root.agent.task-await.arg.timeout_ms]
help = "Give up waiting after this many milliseconds. `0` = wait indefinitely"

[cli.help._root.agent.task-cancel]
about = "Cancel a task. Downstream is cascaded according to on_failure"

[cli.help._root.agent.task-cancel.arg.workspace_id]
help = "Workspace id (focus-independent — required)"

[cli.help._root.agent.task-cancel.arg.id]
help = "Task id to cancel"

[cli.help._root.agent.task-retry]
about = "Retry a Failed/Cancelled/Skipped/Unknown task"

[cli.help._root.agent.task-retry.arg.workspace_id]
help = "Workspace id (focus-independent — required)"

[cli.help._root.agent.task-retry.arg.id]
help = "Task id to retry"

[cli.help._root.agent.task-retry.arg.reset_downstream]
