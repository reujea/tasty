[cli.help._root.plugin.install]
about = "Install a plugin from a directory containing tasty-plugin.toml"
long = "Install a plugin from a directory containing tasty-plugin.toml.\n\nTwo more things happen, and neither is asked about: every permission the manifest declares is granted immediately, and the plugin is enabled and started unless a disabled mark for that id is already on file. Inspect `tasty-plugin.toml` first, or check afterwards with `plugin permissions <id>` and `plugin revoke <id> <permission>`.\n\nA plugin whose signature Tasty cannot check against a trusted key is unverified. It is not installed unless `--allow-unverified` is given, and the refusal explains why. The choice is remembered until the manifest changes or the plugin is removed."

[cli.help._root.plugin.install.arg.path]
help = "Path to plugin directory (must contain tasty-plugin.toml)"

[cli.help._root.plugin.install.arg.allow_unverified]
help = "Install even if the plugin is unverified. It runs with your account's access; use this only if you trust where it came from"

[cli.help._root.plugin.remove]
about = "Remove an installed plugin by id"
long = "Remove an installed plugin by id.\n\nThe whole plugin directory is deleted, so anything the plugin kept inside it goes with it. For a built-in, removal is also recorded so the next boot does not put it back — bringing it back is `plugin upgrade-builtins --restore-removed <id>`, and it returns enabled."

[cli.help._root.plugin.remove.arg.id]
help = "Plugin id (e.g. com.example.explorer)"

[cli.help._root.plugin.upgrade-builtins]
about = "Re-sync all built-in plugins from the bundle"
long = "Re-sync all built-in plugins from the bundle.\n\nThe manifest version picks the branch and content decides inside it: a higher bundle version rewrites the whole directory, the same version rewrites only what differs, and an installed version higher than the bundle is skipped without reading content — `--force` is for that last branch. Permissions newly declared by a built-in that changed are granted in the same call."

[cli.help._root.plugin.upgrade-builtins.arg.force]
help = "Overwrite even when installed version >= bundle version"

[cli.help._root.plugin.upgrade-builtins.arg.restore_removed]
help = "Restore specific builtins from `removed_builtins` so they become eligible for auto-install in the same call. Repeat for multiple ids"

[cli.help._root.plugin.upgrade-builtins.arg.restore_all]
help = "Restore ALL builtins from `removed_builtins`. Overrides `--restore-removed` when both are given"

[cli.help._root.plugin.upgrade-builtins.arg.restart_running]
help = "Restart running builtin processes whose binary is replaced — graceful swap. Also unblocks Windows sharing violation on in-place overwrite. Default off (conservative — briefly closes affected plugin surfaces)"

[cli.help._root.plugin.enable]
about = "Enable a disabled plugin and start it"
long = "Enable a disabled plugin and start it.\n\nWaits until the plugin connects, fails to start or is cancelled, then exits with a non-zero status unless it connected. The reply carries the start generation and its final state. While waiting it does not take --response-timeout-ms; with --no-wait it sends the request once."

[cli.help._root.plugin.enable.arg.id]
help = "Plugin id"

[cli.help._root.plugin.enable.arg.no_wait]
help = "Print the accepted start and return without waiting for the result"

[cli.help._root.plugin.disable]
about = "Disable a plugin (graceful shutdown if running)"
long = "Disable a plugin (graceful shutdown if running).\n\nThe mark is written to disk, so it survives a restart and a later `plugin install` of the same id will not turn it back on. This is not an uninstall: the directory stays and the plugin keeps its command namespace, so `tasty <namespace> ...` answers `plugin ... is not running` rather than reporting an unknown method. What does go away is everything the plugin contributed — file detectors and handlers, hook handlers, completion strategies, settings pages — so a file it used to open now takes another route."

[cli.help._root.plugin.disable.arg.id]
help = "Plugin id"

