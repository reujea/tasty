[cli.help._root.events]
about = "Read the host event feed by position (fetch, follow)"
long = "Read the host event feed by position (fetch, follow)\n\nThe feed lives in memory only: a restart clears it and starts positions over, so every answer carries an `epoch` that says which generation a position belongs to. A position that has scrolled out of the ring is not quietly replaced by the oldest one — the answer says how many were skipped."

[cli.help._root.events.fetch]
about = "Read events from a position. Prints the answer as one JSON object"
long = "Read events from a position. Prints the answer as one JSON object.\n\nThe events are in its `events` array, next to `next_offset`, `epoch` and the other fields of the answer. For one event per line, use `follow`.\n\nThe cursor is yours, not the host's: pass the `next_offset` from the previous answer to continue. Asking twice with the same arguments gives the same answer, and a slow reader queues nothing on the host side.\n\nEvents live in memory only. A restart clears them and starts positions over, which is why every answer carries an `epoch` — if it differs from the one your offset came from, that offset is from a previous generation."

[cli.help._root.events.fetch.arg.offset]
help = "Position to read from. Default 0, the oldest still retained"

[cli.help._root.events.fetch.arg.max]
help = "How many events at most. Clamped by the host"

[cli.help._root.events.fetch.arg.filter]
help = "Key pattern: an exact key (`agent.task_finished`) or a namespace wildcard (`agent.*`). Same grammar the subscriptions use"

[cli.help._root.events.fetch.arg.wait_ms]
help = "Wait up to this long for something to arrive before answering. Default 0, answer immediately with whatever is there"

[cli.help._root.events.follow]
about = "Follow the feed: long-poll from a position and print each event as a line of JSON, forever. Runs until interrupted"
long = "Follow the feed: long-poll from a position and print each event as a line of JSON, forever. Runs until interrupted.\n\nReconnecting is the same call with the last position, so a consumer that was stopped resumes where it left off. If it was stopped long enough for its position to scroll out of the ring, the answer says so instead of quietly restarting from the oldest event, and this command prints that notice to stderr so a `while read` loop on stdout is not disturbed.\n\nA restart of tasty starts positions over. Pass the `--epoch` your offset came from when you reattach: if tasty restarted since, this command says so on stderr and starts from the beginning of the new generation. Without it, a position past the end of the new feed is reported and handled the same way. If the connection drops, this command prints the `--offset` and `--epoch` to reattach with and exits; with `--reconnect` it keeps trying instead and carries on."

[cli.help._root.events.follow.arg.offset]
help = "Position to start from. Default 0, the oldest still retained"

[cli.help._root.events.follow.arg.filter]
help = "Key pattern, same grammar as `fetch --filter`"

[cli.help._root.events.follow.arg.batch]
help = "How many events per request"

[cli.help._root.events.follow.arg.wait_ms]
help = "How long each request waits before coming back empty"

[cli.help._root.events.follow.arg.epoch]
help = "Generation your offset came from, as printed when the connection drops or returned by `fetch`. If tasty restarted since, start over from the new generation instead of reading an unrelated position"

[cli.help._root.events.follow.arg.reconnect]
help = "When the connection drops, retry every second instead of exiting. The generation is carried over, so a restart is reported and followed from its start"

[cli.help._root.telemetry]
about = "Agent telemetry (record metrics, summary, timeseries, top-N)"
long = "Agent telemetry (record metrics, summary, timeseries, top-N)\n\nTwo sources feed it: what an agent reports with `telemetry record`, and one `ipc_calls` event the host writes per IPC call an agent makes, tagged with the method name (host calls, `telemetry.*` and throttled calls are not counted). Queries read the raw events and nothing else — there is no rollup — and the store is trimmed to the most recent 20,000, so `--since` cannot reliably reach past that. Anomaly records are trimmed separately: the most recent 5,000, and at most 50 hours."

[cli.help._root.telemetry.record-batch]
about = "Record several events in one call — they share one timestamp, so their order is preserved. Use this instead of a loop of `record` when the ordering between the events matters"

[cli.help._root.telemetry.record-batch.arg.events]
help = "Events as a JSON array; each element takes the same fields as `record` (`metric`, `value`, `op`, `tags`, ...)"

[cli.help._root.telemetry.record]
