[cli.help._root.approval.request.arg.choices]
help = "Comma-separated `key:label[:destructive]` triples (e.g. `approve:Approve,deny:Deny:1`). Defaults to `approve / deny` if omitted"

[cli.help._root.approval.request.arg.default_choice]
help = "Choice key recorded when the request times out. The outcome is `timed_out` carrying this key, credited to the system — not `responded`, so `approval history --decision` does not match it"

[cli.help._root.approval.request.arg.timeout_ms]
