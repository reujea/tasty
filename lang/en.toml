[cli.help._root.webhook]
about = "Manage inbound webhooks (register/list/info/unregister) — HTTP → IpcSequence"

[cli.help._root.webhook.register]
about = "Register an inbound webhook and print its issued URL"
long = "Register an inbound webhook and print its issued URL.\n\nProvide exactly one of `--handler <id>` (bind a registered hook handler) or `--sequence <json>` (define an inline IpcSequence). The external HTTP payload only fills `${body.x}` / `${header.x}` / `${query.x}` value slots.\n\nThe listener takes 127.0.0.1 only unless `tasty webhook allow-external on` was set before this start; then it takes every IPv4 interface and the printed `127.0.0.1` URL is just the convenient way to curl it, while whoever can reach the port reaches this webhook. There is no signature verification of any kind: `--auth-token` is one fixed shared secret, and with no `--auth-*` the sequence fires for whoever asks. `--persistent` writes that token in plain text into `~/.tasty/webhooks.toml`.\n\nThe HTTP answer is a fixed acknowledgement chosen before the sequence runs, so `200` says the call matched and was handed off, never that it worked. A step that fails neither stops the steps after it nor changes the answer, which leaves a partly applied sequence as an ordinary outcome; the log is the only place that failure appears."

[cli.help._root.webhook.register.arg.methods]
help = "Allowed HTTP methods (repeatable). Defaults to POST"

[cli.help._root.webhook.register.arg.handler]
help = "Registered hook handler id to bind (source must accept webhook)"

[cli.help._root.webhook.register.arg.sequence]
help = "Inline IpcSequence as a JSON array of {\"method\",\"params\"} objects"

[cli.help._root.webhook.register.arg.persistent]
help = "Persist across restarts (default: temporary, dropped on restart)"

[cli.help._root.webhook.register.arg.ttl_secs]
help = "Time limit in seconds; the webhook auto-expires after this many seconds. Mutually exclusive with --count"

[cli.help._root.webhook.register.arg.count]
help = "Count limit; the webhook auto-destructs after this many accepted calls. Mutually exclusive with --ttl-secs"
long = "Count limit; the webhook auto-destructs after this many accepted calls. Mutually exclusive with --ttl-secs.\n\nAccepted means the request matched the path and one of `--method` and, where auth is set, carried the right token. A method mismatch (`405`) and a rejected token (`401`) leave the count where it was, so a sender who does not know the token cannot spend it. What the count does not measure is whether the sequence then worked: the answer is already sent by that point and nothing puts a call back."

[cli.help._root.webhook.register.arg.auth_location]
help = "Optional auth: where the token is presented. Unset = no auth"

[cli.help._root.webhook.register.arg.auth_key]
help = "Token location key: query param / body field path / header name. Required for query|body|header locations (ignored for bearer)"

[cli.help._root.webhook.register.arg.auth_token]
help = "Fixed shared token the sender must present to pass auth"

[cli.help._root.webhook.list]
about = "List all registered webhooks (URL, methods, handler, steps, lifetime)"

[cli.help._root.webhook.info]
about = "Show a single webhook's details by id (incl. remaining count / expiry)"

[cli.help._root.webhook.info.arg.id]
help = "Webhook opaque id (the `/{id}` path segment)"

[cli.help._root.webhook.unregister]
about = "Unregister a webhook by id; its path returns 404 afterwards"

[cli.help._root.webhook.unregister.arg.id]
help = "Webhook opaque id"

[cli.help._root.webhook.sweep]
about = "Sweep (bulk-remove) all expired webhooks (time-elapsed / count-exhausted)"
long = "Sweep (bulk-remove) all expired webhooks (time-elapsed / count-exhausted).\n\nNothing expires on a timer, so an expired webhook stays registered until something looks at it. A call to its path removes it right then and answers `410` that once — every later call gets `404` — a restart drops the expired persistent ones, and this command clears the whole set at once without waiting for either."

[cli.help._root.webhook.port]
about = "Show the running listener's port, or save the port for the next start"
long = "Show the running listener's port, or save the port for the next start.\n\nWith no argument, asks the running Tasty which address the listener actually opened and how that port was chosen (`argument`, `config` or `probe`), plus the port saved for the next start. With a port, saves it to the data folder's webhooks.toml; with `--unset`, removes the saved port. If Tasty is not running, the file is edited directly and the output says so. Either change applies from the next start. A saved port is explicit: if it cannot be opened, Tasty does not start. Without a saved port and without `--webhook-port`, Tasty tries 28429 and the next 63 ports and takes the first free one."

[cli.help._root.webhook.port.arg.port]
help = "Port to save (1-65535)"

[cli.help._root.webhook.port.arg.unset]
help = "Remove the saved port so the next start picks a free one"

[cli.help._root.webhook.allow-external]
about = "Show or change whether other computers can call webhooks"
long = "Show or change whether other computers can call webhooks.\n\nOff by default: the listener takes 127.0.0.1 only, so only programs on this computer reach it. `on` makes the listener take every IPv4 interface (0.0.0.0) from the next start; then whoever can reach the port reaches the registered webhooks. With no argument, shows the saved value and the address the running listener actually opened."

[cli.help._root.webhook.allow-external.arg.value]
help = "`on` or `off`"

[cli.help._root.webhook.config]
about = "Deprecated: use `tasty webhook port` instead. It still works the same way"

[cli.help._root.webhook.config.arg.port]
help = "Save the listener port (1-65535). Applies from the next start"

[cli.help._root.port]
about = "Print this instance's IPC port to stdout (first step of the auto remote port-discovery chain, `ssh host tasty port`). Reads the port file only — no IPC"

[cli.help._root.screenshot]
about = "Capture a screenshot to a PNG file (focus-independent)"
long = "Capture a screenshot to a PNG file (focus-independent).\n\nWith `--surface`, captures that terminal surface via an offscreen render at its own grid size — works for background tabs/workspaces and never changes focus or the visible frame. Otherwise captures a whole window: `--window` selects it by ID (see `list windows`); if omitted and only one window is open, that one is used.\n\nAn explicit `--window` may name a window that `list windows` does not show, such as the settings or plugins modal. Only the automatic (no `--window`) choice is limited to main windows, and it never falls back to whichever window happens to be focused."

[cli.help._root.screenshot.arg.path]
help = "Output PNG path"

[cli.help._root.screenshot.arg.surface]
help = "Terminal surface ID to capture (offscreen; focus-independent)"

[cli.help._root.screenshot.arg.window]
help = "Window ID to capture (whole tasty frame). Required when multiple windows are open. May name a modal window that `list windows` does not enumerate"

