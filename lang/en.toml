[cli.help._root.surface.completion]
about = "Signal that a surface has completed its work (or needs input), raising attention highlight"
long = "Signal that a surface has completed its work (or needs input), raising attention highlight.\n\nThe target surface is always given explicitly with --surface; it is never inferred from focus."

[cli.help._root.surface.completion.arg.surface]
help = "Surface ID (required)"

[cli.help._root.surface.completion.arg.kind]
help = "Attention kind: \"completion\" (default) or \"needs_input\". Any other value is treated as \"completion\""

[cli.help._root.surface.cursor-position]
about = "Print where the cursor sits in a terminal surface, as column and row"
long = "Print where the cursor sits in a terminal surface, as column and row.\n\nThe target surface is always given explicitly with --surface; it is never inferred from focus."

[cli.help._root.surface.cursor-position.arg.surface]
help = "Surface ID (required)"

[cli.help._root.surface.mouse-tracking]
about = "Print whether the program inside a terminal surface has grabbed the mouse, and at which level"
long = "Print whether the program inside a terminal surface has grabbed the mouse, and at which level.\n\nUse it before sending mouse sequences or expecting drag selection to work: when tracking is on, the program consumes mouse input; when it is off, mouse sequences would land on screen as stray characters. The target surface is always given explicitly with --surface."

[cli.help._root.surface.mouse-tracking.arg.surface]
help = "Surface ID (required)"

[cli.help._root.surface.foreground-process]
about = "Print the process currently in the foreground of a terminal surface"
long = "Print the process currently in the foreground of a terminal surface.\n\nUse it to tell whether a shell is idle or is running something. The target surface is always given explicitly with --surface."

[cli.help._root.surface.foreground-process.arg.surface]
help = "Surface ID (required)"

[cli.help._root.surface.locate]
about = "Print which pane a surface belongs to, and whether it is still in the tree at all"
long = "Print which pane a surface belongs to, and whether it is still in the tree at all.\n\nUse it to check that a surface you created or are waiting on has not been closed. The target surface is always given explicitly with --surface."

[cli.help._root.surface.locate.arg.surface]
help = "Surface ID (required)"

[cli.help._root.surface.html-script]
about = "Print the script and remote content state of an html surface: what was detected in the current document, whether scripts may run and remote content may load, and the notice states"
long = "Print the script and remote content state of an html surface: what was detected in the current document, whether scripts may run and remote content may load, and the notice states.\n\nRead-only: the query never shows the banner and never counts as the user viewing the document. The target surface is always given explicitly with --surface. Not available in a headless build."

[cli.help._root.surface.html-script.arg.surface]
help = "Surface ID (required)"

[cli.help._root.surface.html-script-allow]
about = "Allow the scripts of the document an html surface shows, as the banner button does, and reload it"
long = "Allow the scripts of the document an html surface shows, as the banner button does, and reload it.\n\nPass the url and fingerprint printed by html-script so a document replaced after that query is refused instead of allowed. The result field is \"allowed\" or \"already_allowed\". A refusal names its reason: document_changed, loading, no_document or no_fingerprint. Focus, selection and the active tab stay as they are. The target surface is always given explicitly with --surface. Not available in a headless build."

[cli.help._root.surface.html-script-allow.arg.surface]
help = "Surface ID (required)"

[cli.help._root.surface.html-script-allow.arg.url]
help = "Document url from html-script; refuse if the document differs"

[cli.help._root.surface.html-script-allow.arg.fingerprint]
help = "Document fingerprint from html-script; refuse if it differs"

[cli.help._root.surface.html-remote-allow]
about = "Allow remote content (network stylesheets, images, fonts, frames and scripts) for the document an html surface shows, as the remote notice button does, and reload it"
long = "Allow remote content (network stylesheets, images, fonts, frames and scripts) for the document an html surface shows, as the remote notice button does, and reload it.\n\nThe allowance covers this document only and is separate from the script allowance. Pass the url and fingerprint printed by html-script so a document replaced after that query is refused instead of allowed. The result field is \"allowed\" or \"already_allowed\". A refusal names its reason: unsupported_view, globally_allowed, document_changed, loading, no_document or no_fingerprint. Focus, selection, the active tab and the notice stay as they are. The target surface is always given explicitly with --surface. Not available in a headless build."

[cli.help._root.surface.html-remote-allow.arg.surface]
help = "Surface ID (required)"

[cli.help._root.surface.html-remote-allow.arg.url]
help = "Document url from html-script; refuse if the document differs"

[cli.help._root.surface.html-remote-allow.arg.fingerprint]
help = "Document fingerprint from html-script; refuse if it differs"

[cli.help._root.surface.html-nav]
about = "Print the address of the document an html surface shows and whether it can go back or forward in its history"
long = "Print the address of the document an html surface shows and whether it can go back or forward in its history.\n\nThe address is the last committed one: the final address after redirects, with a #fragment move applied, and the previous document while a load is in flight or after it failed. Read-only. The target surface is always given explicitly with --surface. Not available in a headless build."

[cli.help._root.surface.html-nav.arg.surface]
help = "Surface ID (required)"

[cli.help._root.surface.html-back]
about = "Go back one entry in the history of an html surface"
long = "Go back one entry in the history of an html surface.\n\nThe step is applied on the next redraw as a load the host started, so a script banner waits until the user selects the surface. Nothing happens when there is nowhere to go; check the result with html-nav. Focus and selection stay as they are. The target surface is always given explicitly with --surface. Not available in a headless build."

[cli.help._root.surface.html-back.arg.surface]
help = "Surface ID (required)"

[cli.help._root.surface.html-forward]
about = "Go forward one entry in the history of an html surface"
long = "Go forward one entry in the history of an html surface.\n\nThe step is applied on the next redraw as a load the host started, so a script banner waits until the user selects the surface. Nothing happens when there is nowhere to go; check the result with html-nav. Focus and selection stay as they are. The target surface is always given explicitly with --surface. Not available in a headless build."

[cli.help._root.surface.html-forward.arg.surface]
help = "Surface ID (required)"

[cli.help._root.surface.html-reload]
about = "Reload the document an html surface shows"
long = "Reload the document an html surface shows.\n\nThe reload is applied on the next redraw as a load the host started, so a script banner waits until the user selects the surface. Nothing happens when the surface has no document; check the result with html-nav. Focus and selection stay as they are. The target surface is always given explicitly with --surface. Not available in a headless build."

[cli.help._root.surface.html-reload.arg.surface]
help = "Surface ID (required)"

[cli.help._root.surface.respawn-terminal]
about = "Restart the shell of a terminal surface in place, keeping the surface, its tab and its position"
long = "Restart the shell of a terminal surface in place, keeping the surface, its tab and its position.\n\nThe target surface is always given explicitly with --surface."

[cli.help._root.surface.respawn-terminal.arg.surface]
help = "Surface ID (required)"

