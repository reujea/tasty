held_workspace_body = "This workspace is attached by another client."
force_detach = "Force detach"
force_detach_confirm_title = "Force detach this workspace?"
force_detach_confirm_body = "{} is attached by a client. Detaching ends that session and clears its mirror. The workspace becomes editable and closable again."
occupied_surface = "Held by another client (readonly). Force detach to take over."
occupied_workspace = "Attached by a client"
