[boot.app_error]
title = "Tasty could not start"
body = "Tasty stopped while preparing its first window, before any terminal was opened. Details: {}"
hint = "Start Tasty again. If it keeps happening, check that the data folder (TASTY_HOME, or ~/.tasty by default) is available and see ~/.tasty/debug.log."

