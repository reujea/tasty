help = "Workspace id (focus-independent — required)"

[cli.help._root.agent.barrier-await.arg.name]
help = "Barrier name to poll"

[cli.help._root.agent.barrier-state]
about = "Read a barrier's current state. Returns immediately; it does not wait for the barrier to close"

[cli.help._root.agent.barrier-state.arg.workspace_id]
help = "Workspace id (focus-independent — required)"

[cli.help._root.agent.barrier-state.arg.name]
help = "Barrier name to read"

[cli.help._root.agent.semaphore-create]
about = "Create a semaphore with N permits"

[cli.help._root.agent.semaphore-create.arg.workspace_id]
help = "Workspace id (focus-independent — required)"

[cli.help._root.agent.semaphore-create.arg.name]
help = "Semaphore name (unique within the workspace)"

[cli.help._root.agent.semaphore-create.arg.permits]
help = "Permit count (must be >= 1)"

[cli.help._root.agent.semaphore-set-permits]
about = "Change a semaphore's permit count in place. Growing takes effect at once; shrinking drains — current holders are never revoked, new acquires are refused until the holder count falls under the new limit"

[cli.help._root.agent.semaphore-set-permits.arg.workspace_id]
help = "Workspace id (focus-independent — required)"

[cli.help._root.agent.semaphore-set-permits.arg.name]
help = "Semaphore name to resize"

[cli.help._root.agent.semaphore-set-permits.arg.permits]
help = "New permit count (must be >= 1)"

[cli.help._root.agent.semaphore-acquire]
about = "Acquire 1 permit. Idempotent for the same holder"
long = "Acquire 1 permit. Idempotent for the same holder.\n\nA full semaphore is not an error: the call succeeds and reports `acquired: false` along with the current holders, so read that field rather than the exit code. There is no waiting mode — retrying is the caller's job."

[cli.help._root.agent.semaphore-acquire.arg.workspace_id]
help = "Workspace id (focus-independent — required)"

[cli.help._root.agent.semaphore-acquire.arg.name]
help = "Semaphore name to acquire a permit from"

[cli.help._root.agent.semaphore-acquire.arg.holder]
help = "Holder id (must be non-empty)"

[cli.help._root.agent.semaphore-acquire.arg.ttl_ms]
help = "Expire this permit after this many milliseconds. Re-acquiring with the same holder renews it; acquire/list calls reclaim expired permits. Omit for no expiry"

[cli.help._root.agent.semaphore-release]
about = "Release a permit. No-op if holder isn't currently holding"

[cli.help._root.agent.semaphore-release.arg.workspace_id]
help = "Workspace id (focus-independent — required)"

[cli.help._root.agent.semaphore-release.arg.name]
help = "Semaphore name the permit belongs to"

[cli.help._root.agent.semaphore-release.arg.holder]
help = "Holder id that currently holds the permit"

[cli.help._root.agent.barrier-list]
about = "List all barriers in a workspace"

[cli.help._root.agent.barrier-list.arg.workspace_id]
help = "Workspace id (focus-independent — required)"

[cli.help._root.agent.barrier-delete]
about = "Delete a barrier (no-op if missing)"

[cli.help._root.agent.barrier-delete.arg.workspace_id]
help = "Workspace id (focus-independent — required)"

[cli.help._root.agent.barrier-delete.arg.name]
help = "Barrier name to delete"

[cli.help._root.agent.semaphore-list]
about = "List all semaphores in a workspace"

[cli.help._root.agent.semaphore-list.arg.workspace_id]
help = "Workspace id (focus-independent — required)"

[cli.help._root.agent.semaphore-delete]
about = "Delete a semaphore (no-op if missing)"

[cli.help._root.agent.semaphore-delete.arg.workspace_id]
help = "Workspace id (focus-independent — required)"

[cli.help._root.agent.semaphore-delete.arg.name]
help = "Semaphore name to delete"

[cli.help._root.agent.lease-acquire]
about = "Acquire a lease on an arbitrary resource (advisory, cooperative)"
long = "Acquire a lease on an arbitrary resource (advisory, cooperative).\n\nWhether you got it is not the exit code. `--mode fail` turns a conflict into an error, but `--mode block` succeeds and reports `acquired: false` with the current holder — read that field. Nothing enforces the lease either: it is a marker the participants agree to read.\n\nWithout `--ttl-ms` the lease never expires and only `lease-release` with the same holder id frees it, so a holder that dies keeps the resource. The restart cleanup does not cover that case — it only releases leases a running task holds under its own task id."

[cli.help._root.agent.lease-acquire.arg.workspace_id]
help = "Workspace id (focus-independent — required)"

[cli.help._root.agent.lease-acquire.arg.resource]
help = "Resource identifier (e.g. `file:/path`, `workspace:foo`)"

[cli.help._root.agent.lease-acquire.arg.holder]
help = "Holder id (must be non-empty)"

[cli.help._root.agent.lease-acquire.arg.ttl_ms]
help = "Time-to-live in milliseconds. Omit for a lease that never expires. Expiry is lazy — an expired lease is evicted by the next `lease-acquire` or `lease-list`, not at the moment it lapses"

[cli.help._root.agent.lease-acquire.arg.mode]
help = "Conflict mode: fail | block (default: fail). `block` does not wait — it returns at once with `acquired: false`, and retrying is the caller's job"

[cli.help._root.agent.lease-release]
about = "Release a lease. Only the current holder can release"

[cli.help._root.agent.lease-release.arg.workspace_id]
help = "Workspace id (focus-independent — required)"

[cli.help._root.agent.lease-release.arg.resource]
help = "Resource identifier the lease was acquired on"

[cli.help._root.agent.lease-release.arg.holder]
help = "Holder id that currently holds the lease"

[cli.help._root.agent.lease-list]
about = "List all leases in a workspace (expired leases auto-evicted)"

[cli.help._root.agent.lease-list.arg.workspace_id]
help = "Workspace id (focus-independent — required)"

[cli.help._root.agent.task-reduce]
about = "Combine results from N tasks into one value (strategies: first_success | all | merge_json | concat_text | custom:<cmd>)"

[cli.help._root.agent.task-reduce.arg.workspace_id]
help = "Workspace id (focus-independent — required)"

[cli.help._root.agent.task-reduce.arg.inputs]
help = "Comma-separated input task IDs (in reduce order)"

[cli.help._root.agent.task-reduce.arg.strategy]
help = "Strategy: `first_success` | `all` | `merge_json` | `concat_text` | `custom:<command>`"

[cli.help._root.agent.task-reduce.arg.extract_path]
help = "JSON Pointer (e.g. `/stdout/text`) extracted from each input's `output` before reducing — recommended when reducing `Run` task results, whose `output` is `{pid,stdout:{text,...},stderr:{...}}` rather than a plain value. Inputs missing the path are treated as `null` and reported in the response's `warnings` (the rest of the reduce still proceeds)"

[cli.help._root.agent.rate-limit-set]
about = "Configure a rate limit bucket for (agent, metric) — `limit` tokens per `per_ms` ms"
long = "Configure a rate limit bucket for (agent, metric) — `limit` tokens per `per_ms` ms.\n\nOne metric is actually spent from: `ipc_calls`. A bucket stored under any other name is listed by `rate-limit-list` and charged by nothing, so it throttles nothing.\n\nThe `ipc_calls` bucket is charged one token per IPC call, and a call over budget comes back as `-32010 throttled` with a Deny in the audit log. Not every call is charged: a caller with no session token — the plain CLI — and the host's own calls are exempt, as are `telemetry.*`, `agent.rate_limit_*` and `system.info`. The last two are what let a throttled agent read and lift its own limit."

[cli.help._root.agent.rate-limit-set.arg.agent]
help = "Agent id"

[cli.help._root.agent.rate-limit-set.arg.metric]
help = "Metric name. `ipc_calls` is the only one anything spends from"

[cli.help._root.agent.rate-limit-set.arg.limit]
help = "Token refill amount per window"

[cli.help._root.agent.rate-limit-set.arg.per_ms]
help = "Window length in milliseconds (e.g. `60000` for per-minute)"

[cli.help._root.agent.rate-limit-set.arg.burst]
help = "Bucket capacity (defaults to `limit`)"

[cli.help._root.agent.rate-limit-list]
about = "List all configured rate limit buckets (with current token state)"

[cli.help._root.agent.rate-limit-remove]
about = "Remove a rate limit bucket by id"

[cli.help._root.agent.rate-limit-remove.arg.id]
help = "Bucket id, as reported by `rate-limit-list`"

[cli.help._root.agent.rate-limit-status]
about = "Inspect rate limit state, optionally filtered by agent and/or metric"

[cli.help._root.agent.rate-limit-status.arg.agent]
help = "Only report buckets belonging to this agent id"

[cli.help._root.agent.rate-limit-status.arg.metric]
help = "Only report buckets for this metric name"

[cli.help._root.file-handler]
about = "File handler — reload the user configuration (`~/.tasty/file-handlers.toml`), list the merged file format detectors, or dispatch a path"

[cli.help._root.file-handler.reload]
about = "Reload `~/.tasty/file-handlers.toml`. Host and plugin entries are unaffected"

[cli.help._root.file-handler.detectors]
about = "List the file format detectors as they are merged now — display name, icon, enabled state and rules — together with what each source (host, plugin, user) contributed"

[cli.help._root.file-handler.dispatch]
about = "Open a path through the file-handler dispatch flow — the same route the explorer's double-click takes"
long = "Open a path through the file-handler dispatch flow — the same route the explorer's double-click takes.\n\nPrints the acceptance (with a `run` number) on one line, then waits for the final result and prints it on a second line: `state` is `succeeded` or `failed`, and `result` says what was opened or why it was not. An opened tab is reported in `surface_id`. Exits with code 1 unless the final state is `succeeded`."

[cli.help._root.file-handler.dispatch.arg.path]
help = "Path to dispatch"

[cli.help._root.file-handler.dispatch.arg.depth]
help = "Detection depth: `cheap` (extension, filename glob, directory check) or `deep` (also inspect contents). Ignored when the origin surface belongs to a mirror workspace: the path is a remote file, so only the extension and filename glob are checked. The response still echoes the requested depth"

[cli.help._root.file-handler.dispatch.arg.origin_surface]
help = "Add the resulting surface as a tab of this surface's pane instead of the focused pane"

[cli.help._root.file-handler.dispatch.arg.ignore_size_limit]
help = "Skip the large-file confirmation popup and open immediately"

[cli.help._root.file-handler.dispatch.arg.no_wait]
help = "Print only the acceptance and return without waiting. Look the result up later with `tasty file-handler result --run <N>`"

[cli.help._root.file-handler.result]
about = "Show the progress or final result of a dispatch by its `run` number"
long = "Show the progress or final result of a dispatch by its `run` number.\n\n`done` is false while it is still running. The last 128 runs, counted together with hook handler dispatches, are kept; an older or unknown run is an error."

[cli.help._root.file-handler.result.arg.run]
help = "The `run` number from the dispatch acceptance"

[cli.help._root.clipboard]
about = "Clipboard — operate on the local clipboard"

[cli.help._root.clipboard.set-text]
about = "Write text to the local clipboard"

[cli.help._root.clipboard.set-text.arg.text]
help = "Text to write to the clipboard"

[cli.help._root.hook-handler]
about = "Hook handler — shared hook/webhook handler registry (list / get / upsert / remove / reload / dispatch)"

[cli.help._root.hook-handler.list]
about = "List every registered hook handler (host/plugin/user, incl. disabled)"

[cli.help._root.hook-handler.get]
about = "Show one handler by id, including the full action body"
long = "Show one handler by id, including the full action body.\n\n`list` only counts the steps of an IpcSequence; this prints the calls themselves. The `action` object it prints is exactly what `upsert --action` takes, so a sequence can be read, edited and sent back."

[cli.help._root.hook-handler.get.arg.id]
help = "Hook handler id to show (e.g. `host/notify`, `user/wh-...`)"

[cli.help._root.hook-handler.upsert]
about = "Create or edit a user handler in place, without opening the TOML by hand"
long = "Create or edit a user handler in place, without opening the TOML by hand.\n\nFields that are not given are left as they are — this patches the handler rather than replacing it, so the id, and every binding that refers to it, survive the edit. At least one field must be given. The change is written to `~/.tasty/hook-handlers.toml` right away.\n\nAn IpcSequence that a webhook was already bound to keeps firing what it captured at registration time; re-register the webhook to pick this up."

[cli.help._root.hook-handler.upsert.arg.id]
help = "Hook handler id as `<owner>/<short-name>` (e.g. `user/my-handler`)"

[cli.help._root.hook-handler.upsert.arg.source]
help = "Trigger source gate: `hook`, `webhook` or `any`"

[cli.help._root.hook-handler.upsert.arg.priority]
help = "Ordering priority (lower runs first)"

[cli.help._root.hook-handler.upsert.arg.display_name_key]
help = "Translation key for the display name"

[cli.help._root.hook-handler.upsert.arg.disabled]
help = "Disable (`true`) or enable (`false`) the handler"

[cli.help._root.hook-handler.upsert.arg.action]
help = "Whole action as JSON, in the shape `get` prints: `{\"kind\":\"ipc_sequence\",\"calls\":[...]}` or `{\"kind\":\"shell_command\",\"command\":\"...\",\"args\":[...]}`"

[cli.help._root.hook-handler.upsert.arg.calls]
help = "Calls for an IpcSequence, e.g. [{\"method\":\"system.info\",\"params\":{}}]. Uses the same shape as webhook register --sequence"

[cli.help._root.hook-handler.remove]
about = "Remove the user-origin part of a handler. Host/plugin defaults stay"
long = "Remove the user-origin part of a handler. Host/plugin defaults stay.\n\nIf host or a plugin planted the same id, that default becomes visible again; the answer says so in `still_present`."

[cli.help._root.hook-handler.remove.arg.id]
help = "Hook handler id to remove (e.g. `user/my-handler`)"

[cli.help._root.hook-handler.reload]
about = "Reload `~/.tasty/hook-handlers.toml` (user source only; host/plugin unaffected)"

[cli.help._root.hook-handler.dispatch]
about = "Manually fire a registered hook handler by id (test / automation entry point)"
long = "Manually fire a registered hook handler by id (test / automation entry point).\n\nFor an IpcSequence handler, `--body`/`--header`/`--query` fill its `${body.x}`/`${header.x}`/`${query.x}` value slots. Prints the acceptance (with a `run` number) on one line, then waits for the final result and prints it on a second line: `state` is `succeeded`, `partial`, `failed` or `unknown`, `result` says what happened and `steps` lists each step. A shell command handler succeeds once its process starts; `exit_code` is filled once it exits and is not judged. Exits with code 1 unless the final state is `succeeded`."

[cli.help._root.hook-handler.dispatch.arg.id]
help = "Hook handler id to fire (e.g. `host/notify`, `user/wh-...`)"

