long = "Fire a surface hook by name, as if that event had just happened.\n\nThe target surface is always given explicitly with --surface."

[cli.help._root.surface.fire-hook.arg.surface]
help = "Surface ID (required)"

[cli.help._root.surface.fire-hook.arg.event]
help = "Hook event name to fire (required)"

[cli.help._root.surface.attention]
about = "Inspect or clear the attention highlight of a surface"
long = "Inspect or clear the attention highlight of a surface.\n\nThe reverse of `completion`. The other two clear paths (real render focus and reading the notification) are GUI-local events, so this is the only way to clear attention on a headless instance."

[cli.help._root.surface.attention.get]
about = "Show the attention kind recorded for a surface: \"completion\", \"needs_input\", or null when the surface has none"
long = "Show the attention kind recorded for a surface: \"completion\", \"needs_input\", or null when the surface has none.\n\nThe target surface is always given explicitly with --surface; it is never inferred from focus. Allowed while the surface is occupied by a remote attach session (this is a read-only query)."

[cli.help._root.surface.attention.get.arg.surface]
help = "Surface ID (required)"

[cli.help._root.surface.attention.clear]
about = "Clear the attention highlight of a surface"
long = "Clear the attention highlight of a surface.\n\nThe target surface is always given explicitly with --surface; it is never inferred from focus. Clearing a surface that has no attention succeeds and reports \"cleared\": false. Rejected for a surface that is hard-occupied by a remote attach session, and for a mirror surface of a remote workspace: in both cases the attention belongs to the instance that owns the surface."

[cli.help._root.surface.attention.clear.arg.surface]
help = "Surface ID (required)"

[cli.help._root.surface.attention.clear.arg.kind]
help = "Only clear when the recorded kind matches: \"completion\" or \"needs_input\". Omit to clear regardless of kind. Any other value is rejected"

