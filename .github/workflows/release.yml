name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  create-release:
    if: github.event_name == 'push'
    runs-on: [self-hosted, Linux]
    # 실측 최대 0.2분 × 5. 기준: docs/dev-guide/ci-gates.md#잡-시간-상한
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Extract and verify version
        id: version
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          CARGO_VERSION=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          if [ "$TAG_VERSION" != "$CARGO_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) != Cargo.toml version ($CARGO_VERSION)"
            exit 1
          fi
          echo "version=$TAG_VERSION" >> "$GITHUB_OUTPUT"

      - name: Extract changelog from tag commit
        run: git log -1 --format=%b > "$RUNNER_TEMP/release-notes.md"

      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ steps.version.outputs.version }}" \
            --draft \
            --title "v${{ steps.version.outputs.version }}" \
            --notes-file "$RUNNER_TEMP/release-notes.md"

  build-macos:
    needs: create-release
    if: ${{ always() && (needs.create-release.result == 'success' || github.event_name == 'workflow_dispatch') }}
    runs-on: [self-hosted, macOS]
    # 업무용 맥과 러너를 함께 쓴다. 부하가 높으면 40분으로 끝나지 않는다. 기준: docs/dev-guide/ci-gates.md#잡-시간-상한
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Build DMG + headless tar.gz
        run: bash scripts/build-macos-dmg.sh

      - name: Upload to release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ needs.create-release.outputs.version }}"
          gh release upload --clobber "v${VERSION}" "dist/Tasty-${VERSION}-macos-arm64.dmg"
          gh release upload --clobber "v${VERSION}" "dist/tasty-headless-${VERSION}-macos-arm64.tar.gz"
          gh release upload --clobber "v${VERSION}" "dist/SHA256SUMS-macos.txt"

      - name: Clean up dist
        if: always()
        run: rm -rf dist

  # 두 Windows 잡은 아키텍처를 명시해 빌드한다. ARM64는 같은 x64 호스트의 전용 러너(라벨 win-arm64)가
  # 교차 빌드하므로 두 잡은 서로 다른 러너에서 병렬로 돌 수 있다. 실제로 겹친 실행은 아직 측정하지 않았다.
  # 근거와 확인 범위: docs/dev-guide/release.md#windows-arm64
  build-windows:
    needs: create-release
    if: ${{ always() && (needs.create-release.result == 'success' || github.event_name == 'workflow_dispatch') }}
    runs-on: [self-hosted, Windows]
    # 실측 최대 25.9분 × 3. 기준: docs/dev-guide/ci-gates.md#잡-시간-상한
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4

      # 빌드 스크립트가 cleanup 전에 PE 머신 타입·체크섬·산출물 명부를 확인하고 로그에 남긴다.
      - name: Build ZIP, MSI and headless ZIP (x64)
        shell: pwsh
        run: ./scripts/build-windows.ps1 -Arch x64

      - name: Upload to release
        if: github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $VERSION = "${{ needs.create-release.outputs.version }}"
          gh release upload --clobber "v${VERSION}" "dist/tasty-${VERSION}-windows-x64.zip"
          gh release upload --clobber "v${VERSION}" "dist/tasty-${VERSION}-windows-x64.msi"
          gh release upload --clobber "v${VERSION}" "dist/tasty-headless-${VERSION}-windows-x64.zip"
          gh release upload --clobber "v${VERSION}" "dist/SHA256SUMS-windows.txt"

      - name: Clean up dist
        if: always()
        shell: pwsh
        run: Remove-Item -Recurse -Force dist -ErrorAction SilentlyContinue

  build-windows-arm64:
    needs: create-release
    if: ${{ always() && (needs.create-release.result == 'success' || github.event_name == 'workflow_dispatch') }}
    runs-on: [win-arm64]
    # 실측 최대 25.9분 × 5. 기준: docs/dev-guide/ci-gates.md#잡-시간-상한
    timeout-minutes: 130
    steps:
      - uses: actions/checkout@v4

      # x64 호스트에서는 ARM64 실행 파일을 실행할 수 없어 --version 대신 PE 머신 타입(0xAA64)을 확인한다.
      - name: Build ZIP, MSI and headless ZIP (arm64)
        shell: pwsh
        run: ./scripts/build-windows.ps1 -Arch arm64

      - name: Upload to release
        if: github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $VERSION = "${{ needs.create-release.outputs.version }}"
          gh release upload --clobber "v${VERSION}" "dist/tasty-${VERSION}-windows-arm64.zip"
          gh release upload --clobber "v${VERSION}" "dist/tasty-${VERSION}-windows-arm64.msi"
          gh release upload --clobber "v${VERSION}" "dist/tasty-headless-${VERSION}-windows-arm64.zip"
          gh release upload --clobber "v${VERSION}" "dist/SHA256SUMS-windows-arm64.txt"

      - name: Clean up dist
        if: always()
        shell: pwsh
        run: Remove-Item -Recurse -Force dist -ErrorAction SilentlyContinue

  build-linux-x64:
    needs: create-release
    if: ${{ always() && (needs.create-release.result == 'success' || github.event_name == 'workflow_dispatch') }}
    runs-on: [self-hosted, Linux, X64]
    # 실측 최대 9.3분 × 5. 기준: docs/dev-guide/ci-gates.md#잡-시간-상한
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - name: Setup PATH
        run: |
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build tar.gz + deb + rpm + AppImage + headless tar.gz
        run: bash scripts/build-linux.sh

      - name: Upload to release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ needs.create-release.outputs.version }}"
          gh release upload --clobber "v${VERSION}" "dist/tasty-${VERSION}-linux-x64.tar.gz"
          gh release upload --clobber "v${VERSION}" "dist/tasty-headless-${VERSION}-linux-x64.tar.gz"
          gh release upload --clobber "v${VERSION}" "dist/tasty_${VERSION}-1_amd64.deb"
          gh release upload --clobber "v${VERSION}" "dist/tasty-${VERSION}-1.x86_64.rpm"
          gh release upload --clobber "v${VERSION}" "dist/Tasty-${VERSION}-x86_64.AppImage"
          gh release upload --clobber "v${VERSION}" "dist/SHA256SUMS-linux-x64.txt"

      - name: Clean up dist
        if: always()
        run: rm -rf dist

  build-linux-arm64:
    needs: create-release
    if: ${{ always() && (needs.create-release.result == 'success' || github.event_name == 'workflow_dispatch') }}
    runs-on: [self-hosted, Linux, ARM64]
    # 실측 최대 7.2분 × 5. 기준: docs/dev-guide/ci-gates.md#잡-시간-상한
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Setup PATH
        run: |
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build tar.gz + deb + rpm + AppImage + headless tar.gz
        run: bash scripts/build-linux.sh

      - name: Upload to release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ needs.create-release.outputs.version }}"
          gh release upload --clobber "v${VERSION}" "dist/tasty-${VERSION}-linux-arm64.tar.gz"
          gh release upload --clobber "v${VERSION}" "dist/tasty-headless-${VERSION}-linux-arm64.tar.gz"
          gh release upload --clobber "v${VERSION}" "dist/tasty_${VERSION}-1_arm64.deb"
          gh release upload --clobber "v${VERSION}" "dist/tasty-${VERSION}-1.aarch64.rpm"
          gh release upload --clobber "v${VERSION}" "dist/Tasty-${VERSION}-aarch64.AppImage"
          gh release upload --clobber "v${VERSION}" "dist/SHA256SUMS-linux-arm64.txt"

      - name: Clean up dist
        if: always()
        run: rm -rf dist

  publish-release:
    needs: [create-release, build-macos, build-windows, build-windows-arm64, build-linux-x64, build-linux-arm64]
    if: github.event_name == 'push'
    runs-on: [self-hosted, Linux]
    # 실측 최대 0.2분 × 5. 기준: docs/dev-guide/ci-gates.md#잡-시간-상한
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ needs.create-release.outputs.version }}"
          gh release edit "v${VERSION}" --draft=false
