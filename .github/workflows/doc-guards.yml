name: Doc Guards

# 문서만 바뀐 push도 검사하도록 경로 필터를 두지 않는다.
# 네이티브 의존성이 없는 tasty-doc-guards를 공용 러너에서 실행해
# self-hosted 러너의 빌드 작업과 경합하지 않게 한다.
# 범위: docs/dev-guide/guard-relocation.md#문서-검사를-옮길-위치

on:
  push:
    branches: [develop, release, main]
  pull_request:
    branches: [develop, release, main]
  workflow_dispatch:

jobs:
  doc-guards:
    runs-on: ubuntu-latest
    # 실측 최대 1.8분 × 3. 기준: docs/dev-guide/ci-gates.md#잡-시간-상한
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # 앱이 따르는 디자인 정본(tasty-page)을 dtcg/SOURCE에 기록한 커밋으로 받는다.
      # 저장소 작업 트리 밖에 두어 저장소를 순회하는 문서 검사가 그 트리를 읽지 않게 한다.
      - name: Fetch the recorded tasty-page commit
        run: |
          dir="$(bash scripts/fetch-design-source.sh "$RUNNER_TEMP/tasty-page")"
          echo "TASTY_PAGE_DIR=$dir" >> "$GITHUB_ENV"

      # 한 테스트 바이너리가 실패해도 나머지 결과를 수집한다.
      - name: cargo test -p tasty-doc-guards
        run: cargo test -p tasty-doc-guards --locked --no-fail-fast
