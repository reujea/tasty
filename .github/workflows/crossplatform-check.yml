name: Cross-platform Check

# Windows·Linux 컴파일과 테스트를 실행한다. Windows ARM64는 컴파일만, Android는 터미널 코어 컴파일만 검사한다. macOS 잡은 crossplatform-check-macos.yml에 있다.
on:
  push:
    branches: [develop, release, main]
    # 문서만 바뀐 push는 생략한다. 문서 검사는 doc-guards.yml에서 실행한다.
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  pull_request:
    branches: [develop, release, main]
  workflow_dispatch:

# 브랜치(develop·release·main) push는 실행 중인 run을 취소하지 않는다. 잡이 push 간격보다 길어 취소하면 끝까지 가는 run이 없다.
# 대기 run은 새 push가 대신하므로 대기열은 쌓이지 않는다. PR은 최신 커밋만 보면 되므로 취소한다.
# 러너가 offline일 수 있는 macOS 잡은 이 그룹을 붙잡지 않도록 별도 워크플로로 나눴다.
# 기준: docs/dev-guide/ci-gates.md#연속-push와-실행-취소
concurrency:
  group: crossplatform-check-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check-windows:
    runs-on: [self-hosted, Windows]
    # 실측 최대 13.7분 × 3. 기준: docs/dev-guide/ci-gates.md#잡-시간-상한
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # 재사용하는 러너에는 이전 CRLF 파일이 남을 수 있다. 문자열 기반 소스 검사가
      # 줄바꿈 차이로 실패하지 않도록 필요한 경우에만 다시 체크아웃한다.
      # 항상 다시 쓰면 mtime이 바뀌어 Cargo 증분 빌드를 재사용하기 어렵다.
      - name: normalize the working tree to committed line endings
        shell: pwsh
        run: |
          $before = @(git ls-files --eol | Select-String 'w/crlf')
          Write-Host "CRLF in working tree (before): $($before.Count)"
          if ($before.Count -gt 0) {
            $before | Select-Object -First 5 | ForEach-Object { Write-Host "  $_" }
            # Git이 기존 파일을 수정되지 않은 것으로 판단할 수 있어 먼저 삭제한다.
            $before | ForEach-Object {
              Remove-Item -LiteralPath (($_.Line -split "`t")[-1]) -Force -ErrorAction SilentlyContinue
            }
            git checkout --force -- .
            $after = @(git ls-files --eol | Select-String 'w/crlf')
            Write-Host "CRLF in working tree (after): $($after.Count)"
            if ($after.Count -gt 0) { throw "renormalize did not take" }
          }

      # 앞 스텝이 실패해도 Clippy를 실행할 수 있도록 설치 스텝에도 같은 조건을 둔다.
      - name: ensure clippy component
        if: ${{ !cancelled() }}
        shell: pwsh
        run: rustup component add clippy

      # CRLF 정규화 실패는 Rust 컴파일을 막지 않으므로 Clippy는 계속 실행한다.
      # 기존 warning을 모두 오류로 바꾸지 않고 deny 수준의 오류만 차단한다.
      - name: cargo clippy
        if: ${{ !cancelled() }}
        shell: pwsh
        run: cargo clippy --workspace --all-targets --locked

      # Windows 전용 분기와 플랫폼 의존 동작을 검사한다.
      # --no-fail-fast로 한 테스트 바이너리가 실패해도 나머지 결과를 수집한다.
      # GUI 통합 테스트는 데스크톱 세션을 요구하므로 아래에서 대상 패키지를 따로 지정한다.
      - name: cargo test (unit)
        if: ${{ !cancelled() }}
        shell: pwsh
        run: cargo test --workspace --lib --bins --locked --no-fail-fast

      # 화면 없이 실행할 수 있는 공유 메모리·문서 검사 패키지의 통합 테스트만 실행한다.
      # Windows의 핸들 전달과 경로 구분자는 Linux 실행 결과로 검증할 수 없다.
      # GUI를 사용하는 루트 통합 테스트는 여기에 포함하지 않는다.
      # 문서 검사의 design_source_* 시험은 dtcg/SOURCE 커밋의 tasty-page가 필요하다.
      - name: cargo test (windows integration — shm · doc-guards)
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $commit = (Get-Content crates/tasty-design-tokens/dtcg/SOURCE -Raw).Trim()
          $dir = Join-Path $env:RUNNER_TEMP 'tasty-page'
          if (Test-Path $dir) { Remove-Item -Recurse -Force $dir }
          git init -q $dir
          if ($LASTEXITCODE -ne 0) { throw "git init failed" }
          # 러너의 시스템 설정 core.autocrlf=true를 따르면 CRLF로 체크아웃되어 토큰 JSON 바이트 비교가 깨진다.
          git -C $dir config core.autocrlf false
          if ($LASTEXITCODE -ne 0) { throw "git config failed" }
          git -C $dir config core.eol lf
          if ($LASTEXITCODE -ne 0) { throw "git config failed" }
          git -C $dir fetch -q --depth 1 https://github.com/zilhak/tasty-page.git $commit
          if ($LASTEXITCODE -ne 0) { throw "tasty-page fetch failed" }
          git -C $dir checkout -q --detach FETCH_HEAD
          if ($LASTEXITCODE -ne 0) { throw "tasty-page checkout failed" }
          $env:TASTY_PAGE_DIR = $dir
          cargo test -p tasty-shm -p tasty-doc-guards --locked --no-fail-fast

      # 데스크톱 세션을 조사하는 참고 정보이며 실패해도 잡을 중단하지 않는다.
      # Windows Forms의 창 생성 성공만으로 winit/wgpu 실행을 보장하지 않는다.
      # 앞 스텝이 실패한 경우에도 진단을 남기기 위해 !cancelled()를 사용한다.
      - name: desktop session (diagnostic — 재고 나면 지운다)
        if: ${{ !cancelled() }}
        continue-on-error: true
        shell: pwsh
        run: |
          "UserInteractive : $([System.Environment]::UserInteractive)"
          "SessionId       : $((Get-Process -Id $PID).SessionId)  (0 이면 서비스 세션 = 화면 없음)"
          "---- qwinsta ----"
          try { qwinsta } catch { "qwinsta 를 못 불렀다: $_" }
          "---- 실제 창 생성 ----"
          try {
            Add-Type -AssemblyName System.Windows.Forms
            $f = New-Object System.Windows.Forms.Form
            $f.Show(); Start-Sleep -Milliseconds 200; $f.Close(); $f.Dispose()
            "window: ok — 데스크톱 세션이 있다"
          } catch {
            "window: FAILED — $($_.Exception.Message)"
          }

  # Windows ARM64 타깃 컴파일을 검사한다. x64 Windows 호스트의 전용 러너(라벨 win-arm64)에서
  # 교차 컴파일하며 테스트 실행과 링크·패키징은 포함하지 않는다. C 의존성은 MSVC ARM64 빌드 도구로 컴파일한다.
  check-windows-arm64:
    runs-on: [win-arm64]
    # check-windows 대리 실측 최대 13.7분 × 5. 기준: docs/dev-guide/ci-gates.md#잡-시간-상한
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4

      - name: ensure aarch64-pc-windows-msvc target
        shell: pwsh
        run: rustup target add aarch64-pc-windows-msvc

      - name: cargo check (windows arm64)
        shell: pwsh
        run: cargo check --workspace --all-targets --target aarch64-pc-windows-msvc --locked

  # GUI 기능을 끈 빌드와 테스트를 검사한다. 같은 러너에서 GUI 단위 테스트도 실행한다.
  check-headless:
    runs-on: [self-hosted, Linux, X64]
    # 실측 최대 15.7분 × 3. 기준: docs/dev-guide/ci-gates.md#잡-시간-상한
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - name: Setup PATH
        run: |
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # 시험 하나가 node 로 WebView 판정 스크립트를 실행한다(src/host_api/webview/same_document.rs).
      # 러너 머신에는 node 가 없다. 기준: docs/dev-guide/ci-gates.md#단위-시험의-node
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: cargo check (headless)
        run: cargo check --workspace --no-default-features --locked

      # headless 전용 구현과 IPC·attach·PTY 통합 경로를 검사한다.
      # GUI 전용 gui_tests 타깃은 Cargo의 required-features로 제외된다.
      # e2e 하네스는 같은 feature로 빌드한 headless 바이너리를 실행한다.
      #
      # 창이 필요한 시험은 #[cfg(feature = "gui")]로 이 조합에서 컴파일하지 않으므로
      # 이름으로 건너뛰는 시험은 없다(docs/dev-guide/unit-test-isolation.md).
      # 문서 검사의 design_source_* 시험은 dtcg/SOURCE 커밋의 tasty-page가 필요하다.
      - name: cargo test (headless)
        run: |
          TASTY_PAGE_DIR="$(bash scripts/fetch-design-source.sh "$RUNNER_TEMP/tasty-page")"
          export TASTY_PAGE_DIR
          cargo test --workspace --no-default-features --locked --no-fail-fast

      # 기본 feature의 Clippy에서는 제외되는 headless 전용 코드도 검사한다.
      - name: cargo clippy (headless)
        if: ${{ !cancelled() }}
        run: cargo clippy --workspace --all-targets --no-default-features --locked

      # Linux의 GUI 개발 빌드를 컴파일하고 단위 테스트를 실행한다.
      # release 검사와는 debug_assertions 조건이 다르며 통합 테스트는 포함하지 않는다.
      # 앞 스텝이 실패해도 이 조합의 결과를 얻기 위해 !cancelled()를 사용한다.
      # 잡 이름은 외부의 required status check에서 참조할 수 있어 유지한다.
      # gui 조합의 단위 시험 중 winit EventLoop를 X11로 만드는 시험(src/x11_test_loop.rs를 쓰는 시험)은
      # 디스플레이가 없으면 XOpenDisplayFailed로 실패하므로 스텝 전체를 Xvfb 안에서 실행한다.
      # 시험 자식이 연결을 열고 닫으므로 클라이언트가 0이 된 순간의 서버 리셋을 -noreset으로 막고,
      # 연결 실패를 서버 쪽에서도 읽을 수 있게 Xvfb 출력을 -e 파일에 남긴다(아래 xvfb 진단 스텝이 출력).
      # 기준과 확인 절차는 docs/dev-guide/ci-gates.md의 gui 단위 단계 절에 있다.
      - name: cargo test (linux, gui, unit)
        if: ${{ !cancelled() }}
        run: |
          command -v xvfb-run || { echo "이 러너에 xvfb-run이 없어 gui 단위 시험을 실행할 수 없습니다."; exit 1; }
          env -u WAYLAND_DISPLAY xvfb-run -a -e "$RUNNER_TEMP/xvfb-gui-unit.log" \
            --server-args="-screen 0 1920x1080x24 -noreset" \
            cargo test --workspace --lib --bins --locked --no-fail-fast

      # 위 gui 단위 스텝의 Xvfb 출력을 거르지 않고 전부 출력한다(xauth 오류도 이 파일에 들어간다).
      # xvfb-run이 끝나면 서버도 끝나므로 서버 상태 대신 xvfb-run 판과 로그를 남긴다.
      - name: xvfb (diagnostic)
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          xvfb-run --help 2>&1 | sed -n '1,3p' || true
          dpkg -l xvfb 2>/dev/null | tail -1 || true
          if [ -s "$RUNNER_TEMP/xvfb-gui-unit.log" ]; then
            cat "$RUNNER_TEMP/xvfb-gui-unit.log"
          else
            echo "Xvfb 로그 없음(파일이 없거나 비어 있음)"
          fi

      # headless 조합에서 컴파일하지 않는 창 소유권 테스트를 전용 Xvfb에서 실행한다.
      # 아직 관측용이므로 실패해도 잡을 중단하지 않는다. 이 스텝의 결과를 따로 확인한다.
      # 차단 검사로 바꾸려면 CI에서 연속 통과할 횟수를 정하고 실제 결과를 확인한다.
      # 기준과 확인 절차는 docs/dev-guide/ci-gates.md에 기록한다.
      - name: cargo test (linux, gui, e2e — 관측용)
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          command -v xvfb-run || { echo "이 러너에 xvfb-run이 없어 GUI 테스트를 실행할 수 없습니다."; exit 1; }
          # xvfb-run 안에서 정해진 DISPLAY를 하네스에 전달해야 하므로 sh -c를 사용한다.
          # 격리 조건: docs/dev-guide/e2e-tests.md#3-환경-격리
          xvfb-run -a --server-args="-screen 0 1920x1080x24" \
            sh -c 'TASTY_E2E_DISPLAY="$DISPLAY" cargo test --workspace --locked --no-fail-fast \
              --test e2e_tests -- multi_window_owner_routing --exact'

      # markdown 주소창이 WebKitGTK에서 실제로 상단에 붙는지 getBoundingClientRect로 잰다(Linux 전용).
      # 바탕 포커스 시트가 문서를 다시 싣지 않고 바탕·표 값을 바꾸는지도 잰다.
      # 시험은 #[ignore]라 위 gui 유닛 단계에서는 실행되지 않고 여기서 이름으로 지목한다.
      # e2e 단계와 같은 이유로 아직 관측용이다. 승격 기준은 docs/dev-guide/ci-gates.md에 있다.
      - name: cargo test (linux, gui, webview layout — 관측용)
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          command -v xvfb-run || { echo "이 러너에 xvfb-run이 없어 webview 레이아웃 시험을 실행할 수 없습니다."; exit 1; }
          env -u WAYLAND_DISPLAY xvfb-run -a --server-args="-screen 0 1920x1080x24" \
            cargo test -p tasty-plugin-markdown --locked --no-fail-fast -- --ignored --exact \
              render::webview_layout_tests::address_bar_stays_on_top_in_webkitgtk
          # GTK는 한 프로세스에서 한 스레드만 초기화하므로 시험마다 따로 실행한다.
          env -u WAYLAND_DISPLAY xvfb-run -a --server-args="-screen 0 1920x1080x24" \
            cargo test -p tasty-plugin-markdown --locked --no-fail-fast -- --ignored --exact \
              render::bed_focus_webkit_tests::bed_focus_sheet_switches_state_values_in_place

      # 실패 원인을 조사할 때도 필요하므로 앞 스텝의 실패와 관계없이 진단한다.
      # 디스크·도구 상태 출력에 실패해도 컴파일·테스트 결과를 바꾸지 않는다.
      - name: disk (diagnostic)
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          df -h .
          du -sh target 2>/dev/null || echo "target 없음"
          du -sh ~/.cargo 2>/dev/null || true
          command -v xvfb-run || echo "xvfb-run 없음"

  # Linux GUI release 설정을 컴파일한다. debug_assertions가 꺼진 코드를 확인한다.
  # cargo check이므로 테스트 실행, 코드 생성·LTO, 배포 패키지 검사는 포함하지 않는다.
  check-release:
    runs-on: [self-hosted, Linux, X64]
    # 실측 최대 1.7분 × 3. 기준: docs/dev-guide/ci-gates.md#잡-시간-상한
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup PATH
        run: |
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: cargo check (gui, release)
        run: cargo check --workspace --release --locked

  # Android(aarch64-linux-android) 타깃에서 터미널 코어(tasty-terminal·tasty-terminal-link)가 컴파일되는지 검사한다.
  # 두 크레이트의 Android 컴파일 실패를 검출한다. 현재 의존 그래프는 NDK 없이 검사된다.
  # 링크·실행과 다른 크레이트의 Android 컴파일은 검사하지 않는다.
  check-android:
    runs-on: [self-hosted, Linux, X64]
    # check-release 대리 실측 최대 1.7분 × 5. 기준: docs/dev-guide/ci-gates.md#잡-시간-상한
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup PATH
        run: |
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: ensure aarch64-linux-android target
        run: rustup target add aarch64-linux-android

      - name: cargo check (android, terminal core)
        run: cargo check -p tasty-terminal -p tasty-terminal-link --target aarch64-linux-android --locked
