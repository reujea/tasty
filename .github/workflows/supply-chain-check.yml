name: Supply Chain Check

# 의존성·설정 변경은 push와 PR에서, 새 보안 공지는 주간 실행에서 확인한다.
# push만 Cargo.lock/deny.toml, workspace에서 제외한 tasty-plugin-sdk-wasm의
# Cargo.toml/Cargo.lock, 이 워크플로 파일 경로로 제한하며 PR에는 경로 필터를 두지 않는다.
# deny.toml의 advisories, licenses, bans, sources 규칙을 적용한다.

on:
  push:
    branches: [develop, release, main]
    paths:
      - Cargo.lock
      - deny.toml
      - crates/tasty-plugin-sdk-wasm/Cargo.toml
      - crates/tasty-plugin-sdk-wasm/Cargo.lock
      - .github/workflows/supply-chain-check.yml
  pull_request:
    branches: [develop, release, main]
  schedule:
    # 매주 월요일 09:00 UTC에 보안 공지를 확인한다.
    - cron: "0 9 * * 1"
  workflow_dispatch:

concurrency:
  group: supply-chain-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cargo-deny:
    runs-on: [self-hosted, Linux, X64]
    # 실측 최대 0.4분 × 3. 기준: docs/dev-guide/ci-gates.md#잡-시간-상한
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup PATH
        run: |
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Ensure cargo-deny
        run: |
          if ! command -v cargo-deny >/dev/null 2>&1; then
            cargo install cargo-deny --locked
          fi
          cargo-deny --version

      - name: cargo deny --workspace check
        run: cargo deny --workspace check

      # workspace에서 제외한 크레이트는 자체 Cargo.lock을 쓰므로 --workspace에 잡히지 않는다.
      # 앞 단계가 실패해도 이 그래프의 결과를 따로 확인한다.
      - name: cargo deny check (tasty-plugin-sdk-wasm, workspace exclude)
        if: success() || failure()
        run: cargo deny --manifest-path crates/tasty-plugin-sdk-wasm/Cargo.toml check
