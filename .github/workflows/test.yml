name: Test

# semver-guards는 develop·release·main push와 수동 실행에서 API 호환성·변경 기록·CLI 명칭을 검사한다.
# GUI가 필요하지 않으므로 --no-default-features로 실행한다.
# test-linux-x64는 기본 feature의 전체 테스트를 수동으로만 실행한다.
# GUI 테스트에 필요한 러너 환경을 확인한 뒤 자동 실행 여부를 결정한다.
# PR 실행은 self-hosted 러너의 다른 작업과 경합하므로 현재 등록하지 않는다.
# 실행 조건과 범위: docs/dev-guide/ci-gates.md
on:
  push:
    branches: [develop, release, main]
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semver-guards:
    runs-on: [self-hosted, Linux, X64]
    # 실측 최대 2.5분 × 3. 기준: docs/dev-guide/ci-gates.md#잡-시간-상한
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup PATH
        run: |
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # 한 테스트 바이너리가 실패해도 나머지 결과를 수집한다.
      - name: cargo test (semver guards)
        run: >
          cargo test --locked --no-default-features --no-fail-fast
          --test api_baseline_0_7
          --test changelog_unreleased
          --test cli_naming_count_drift

  test-linux-x64:
    # push에서는 전체 테스트를 실행하지 않는다.
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, Linux, X64]
    # crossplatform-check check-headless 대리 실측 최대 15.7분 × 5. 기준: docs/dev-guide/ci-gates.md#잡-시간-상한
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4

      - name: Setup PATH
        run: |
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # 시험 하나가 node 로 WebView 판정 스크립트를 실행한다(src/host_api/webview/same_document.rs).
      # 러너 머신에는 node 가 없다. 기준: docs/dev-guide/ci-gates.md#단위-시험의-node
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build tests
        run: cargo test --workspace --no-run --locked

      # 문서 검사의 design_source_* 시험은 dtcg/SOURCE 커밋의 tasty-page가 필요하다.
      - name: Run tests
        run: |
          TASTY_PAGE_DIR="$(bash scripts/fetch-design-source.sh "$RUNNER_TEMP/tasty-page")"
          export TASTY_PAGE_DIR
          cargo test --workspace --locked --no-fail-fast
