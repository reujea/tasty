[package]
name = "tasty-ipc"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Tasty IPC wire framing, session, caller-context and method registry"
repository = "https://github.com/zilhak/tasty"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "macros", "sync"] }
tracing = "0.1"
rand = "0.9"
tasty-plugin-protocol = { path = "../tasty-plugin-protocol" }
tasty-plugin-manifest = { path = "../tasty-plugin-manifest" }
tasty-utils = { path = "../tasty-utils" }
tasty-memory = { path = "../tasty-memory" }
tasty-telemetry = { path = "../tasty-telemetry" }
tasty-agent = { path = "../tasty-agent" }
tempfile = "3"

[dev-dependencies]
tempfile = "3"
tasty-type-appearance = { path = "../tasty-type-appearance" }

[lints]
workspace = true

[[test]]
name = "port_owner_process"
harness = false
