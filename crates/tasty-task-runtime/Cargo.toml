[package]
name = "tasty-task-runtime"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Task execution, runner lifecycle, hook completion, and engine task scopes"

[dependencies]
tasty-agent = { path = "../tasty-agent" }
tasty-memory = { path = "../tasty-memory" }
tasty-ipc = { path = "../tasty-ipc" }
tasty-utils = { path = "../tasty-utils" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.9"
tracing = "0.1"

[features]
# 다른 크레이트의 시험이 러너 스레드 상태를 조회하는 함수. dev-dependency로 켠다. 제품 빌드에는 없다.
test-support = []

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(any(windows, target_os = "linux"))'.dependencies]
tasty-reaper = { path = "../tasty-reaper" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3"
tasty-latency-control = { path = "../tasty-latency-control" }
tasty-plugin-agent-common = { path = "../tasty-plugin-agent-common" }
tasty-test-support = { path = "../tasty-test-support" }
# writer 없이 바로 실행하는 핸들을 시험 구성에서 쓴다.
tasty-memory = { path = "../tasty-memory", features = ["test-support"] }

[lints]
workspace = true
