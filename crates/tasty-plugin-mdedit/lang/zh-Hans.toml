restore = "恢复前"

[mdedit.settings]
snapshot_keep_count = "每个文件保留的快照数"
snapshot_keep_days = "快照保留期限"
days_suffix = "天"

[mdedit.cli]
desc = "Markdown 协同编辑 — 按标题路径读取和编辑 Markdown 文件的节"

[mdedit.cli.sub.read]
description = "输出文件（或其标题大纲）及内容哈希"

[mdedit.cli.sub.section]
description = "对按标题路径选中的一个节执行 get|append|prepend|insert-before|replace"

[mdedit.cli.sub.task]
description = "切换节内的一行复选框"

[mdedit.cli.sub.agent_note]
description = "在节末尾追加 '> [!agent] HH:MM 标题' 记录块"

[mdedit.cli.sub.snapshot]
description = "对文件的自动快照执行 list|restore"

[mdedit.cli.sub.status]
description = "显示文件的内容哈希、已打开的编辑器（修改 / 冲突 / 审查）状态及受保护节数"

[mdedit.cli.arg.file]
help = "Markdown 文件"

[mdedit.cli.arg.outline]
help = "输出标题大纲而非正文"

[mdedit.cli.arg.op]
help = "操作：get（读取）| append（末尾追加）| prepend（标题下方）| insert-before（标题上方）| replace（替换正文）"

[mdedit.cli.arg.heading]
help = "标题路径，例如 '# 2026.10.22' 或 '# 待办 > ## Project'"

[mdedit.cli.arg.text]
help = "要插入的文本（仅写入操作）"

[mdedit.cli.arg.if_match]
help = "仅当文件哈希仍等于此值时才写入，否则拒绝"

[mdedit.cli.arg.action_task]
help = "操作：toggle（切换勾选）"

[mdedit.cli.arg.match]
help = "在该节的复选框行中恰好只出现在一行的文本"

[mdedit.cli.arg.to]
help = "toggle（默认）| checked | unchecked"

[mdedit.cli.arg.title]
help = "记录的单行标题"

[mdedit.cli.arg.note_text]
help = "正文行（每行变为 '> 行'）"

[mdedit.cli.arg.time]
help = "要显示的 HH:MM（默认：当前时间）"

[mdedit.cli.arg.no_time]
help = "不写入时间"

[mdedit.cli.arg.action_snapshot]
help = "操作：list（列表）| restore（恢复）"

[mdedit.cli.arg.id]
help = "要恢复的快照 ID（来自 'list'）"
