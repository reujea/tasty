[mdedit.conflict]
title = "冲突 — 你的编辑与磁盘上的文件"
apply = "应用"
at_line = "第 {} 行"
ours = "保留我的"
theirs = "保留磁盘的"
both = "保留两者"

[mdedit.review]
title = "外部写入的更改"
keep_all = "全部保留"
keep = "保留"
revert = "还原"
at_line = "第 {} 行"

[mdedit.origin]
agent = "智能体"
external = "外部"

[mdedit.snapshots]
title = "快照"
empty = "尚无快照。"
restore = "恢复"

[mdedit.snapshots.reason]
external = "外部写入前"
agent = "智能体写入前"
