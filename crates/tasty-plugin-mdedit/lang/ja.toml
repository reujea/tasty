apply = "適用"
at_line = "{} 行目"
ours = "自分の方"
theirs = "ディスクの方"
both = "両方"

[mdedit.review]
title = "外部から書き込まれた変更"
keep_all = "すべて残す"
keep = "残す"
revert = "元に戻す"
at_line = "{} 行目"

[mdedit.origin]
agent = "エージェント"
external = "外部"

[mdedit.snapshots]
title = "スナップショット"
empty = "スナップショットはまだありません。"
restore = "復元"

[mdedit.snapshots.reason]
external = "外部書き込みの直前"
agent = "エージェント書き込みの直前"
save = "保存の直前"
restore = "復元の直前"

[mdedit.settings]
snapshot_keep_count = "ファイルごとに保持するスナップショット数"
snapshot_keep_days = "スナップショットの保持期間"
days_suffix = "日"

[mdedit.cli]
desc = "Markdown 共同編集 — 見出しパスでセクションを読み書きする"

[mdedit.cli.sub.read]
description = "ファイル(または見出し一覧)と内容ハッシュを出力する"

[mdedit.cli.sub.section]
description = "見出しパスで選んだセクション 1 つを get|append|prepend|insert-before|replace"

[mdedit.cli.sub.task]
description = "セクション内のチェックボックス 1 行を切り替える"

[mdedit.cli.sub.agent_note]
description = "セクションの末尾に '> [!agent] HH:MM タイトル' 記録ブロックを追加する"

[mdedit.cli.sub.snapshot]
description = "ファイルの自動スナップショットを list|restore"

[mdedit.cli.sub.status]
description = "ファイルの内容ハッシュ、開いているエディタ(変更・競合・レビュー)、ガード数を表示する"

[mdedit.cli.arg.file]
help = "Markdown ファイル"

[mdedit.cli.arg.outline]
help = "本文の代わりに見出し一覧を出力する"

[mdedit.cli.arg.op]
help = "操作: get(読む) | append(末尾) | prepend(見出しの下) | insert-before(見出しの上) | replace(本文を置換)"

[mdedit.cli.arg.heading]
help = "見出しパス。例: '# 2026.10.22' または '# やること > ## Project'"

[mdedit.cli.arg.text]
help = "挿入するテキスト(書き込み時のみ)"

[mdedit.cli.arg.if_match]
help = "ファイルのハッシュがこの値と一致する場合のみ書き込む"

[mdedit.cli.arg.action_task]
help = "操作: toggle(チェック切り替え)"

[mdedit.cli.arg.match]
help = "セクション内のチェックボックス行のうち 1 行だけに含まれるテキスト"

[mdedit.cli.arg.to]
help = "toggle(既定) | checked | unchecked"

[mdedit.cli.arg.title]
help = "記録の 1 行タイトル"

[mdedit.cli.arg.note_text]
help = "本文の行(各行が '> 行' になる)"

[mdedit.cli.arg.time]
help = "表示する HH:MM(既定: 現在)"

[mdedit.cli.arg.no_time]
help = "時刻を書かない"

[mdedit.cli.arg.action_snapshot]
help = "操作: list(一覧) | restore(復元)"

[mdedit.cli.arg.id]
help = "復元するスナップショット id('list' の結果)"
