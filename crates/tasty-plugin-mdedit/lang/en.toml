[mdedit.settings]
snapshot_keep_count = "Snapshots to keep per file"
snapshot_keep_days = "Keep snapshots for"
days_suffix = "days"

[mdedit.cli]
desc = "Markdown co-editing — read and edit sections of a markdown file by heading path"

[mdedit.cli.sub.read]
description = "Print the file (or its heading outline) with its content hash"

[mdedit.cli.sub.section]
description = "get|append|prepend|insert-before|replace one section chosen by heading path"

[mdedit.cli.sub.task]
description = "Toggle one checkbox line inside a section"

[mdedit.cli.sub.agent_note]
description = "Append a '> [!agent] HH:MM title' record block at the end of a section"

[mdedit.cli.sub.snapshot]
description = "list|restore automatic snapshots of a file"

[mdedit.cli.sub.status]
description = "Show the content hash, open editors (dirty/conflict/review) and guard count of a file"

[mdedit.cli.arg.file]
help = "Markdown file"

[mdedit.cli.arg.outline]
help = "Print the heading outline instead of the text"

[mdedit.cli.arg.op]
help = "get | append | prepend | insert-before | replace"

[mdedit.cli.arg.heading]
help = "Heading path, e.g. '# 2026.10.22' or '# Todo > ## Project'"

[mdedit.cli.arg.text]
help = "Text to insert (writes only)"

[mdedit.cli.arg.if_match]
help = "Refuse unless the file hash still equals this value"

[mdedit.cli.arg.action_task]
help = "toggle"

[mdedit.cli.arg.match]
help = "Text that appears on exactly one checkbox line of the section"

[mdedit.cli.arg.to]
help = "toggle (default) | checked | unchecked"

[mdedit.cli.arg.title]
help = "One-line title of the record"

[mdedit.cli.arg.note_text]
help = "Body lines (each becomes '> line')"

[mdedit.cli.arg.time]
help = "HH:MM to show (default: now)"

[mdedit.cli.arg.no_time]
help = "Leave the time out"

[mdedit.cli.arg.action_snapshot]
help = "list | restore"

[mdedit.cli.arg.id]
help = "Snapshot id to restore (from 'list')"
