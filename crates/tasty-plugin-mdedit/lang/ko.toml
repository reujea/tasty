[mdedit.cli]
desc = "마크다운 공동 편집 — 헤딩 경로로 섹션을 읽고 고친다"

[mdedit.cli.sub.read]
description = "파일(또는 헤딩 목차)과 내용 해시를 출력한다"

[mdedit.cli.sub.section]
description = "헤딩 경로로 고른 섹션 하나를 get|append|prepend|insert-before|replace"

[mdedit.cli.sub.task]
description = "섹션 안의 체크박스 한 줄을 토글한다"

[mdedit.cli.sub.agent_note]
description = "섹션 끝에 '> [!agent] HH:MM 제목' 기록 블록을 붙인다"

[mdedit.cli.sub.snapshot]
description = "파일의 자동 스냅샷 list|restore"

[mdedit.cli.sub.status]
description = "파일의 내용 해시, 열린 편집기(수정·충돌·검토) 상태, 가드 수를 보여 준다"

[mdedit.cli.arg.file]
help = "마크다운 파일"

[mdedit.cli.arg.outline]
help = "본문 대신 헤딩 목차를 출력한다"

[mdedit.cli.arg.op]
help = "연산: get(읽기) | append(끝에) | prepend(제목 아래) | insert-before(제목 위) | replace(본문 교체)"

[mdedit.cli.arg.heading]
help = "헤딩 경로. 예: '# 2026.10.22' 또는 '# 할 일 > ## Project A'"

[mdedit.cli.arg.text]
help = "넣을 텍스트(쓰기 연산만)"

[mdedit.cli.arg.if_match]
help = "파일 해시가 이 값과 같을 때만 쓴다"

[mdedit.cli.arg.action_task]
help = "동작: toggle(체크 전환)"

[mdedit.cli.arg.match]
help = "섹션의 체크박스 줄 중 정확히 한 줄에만 들어 있는 텍스트"

[mdedit.cli.arg.to]
help = "toggle(기본) | checked | unchecked"

[mdedit.cli.arg.title]
help = "기록의 한 줄 제목"

[mdedit.cli.arg.note_text]
help = "본문 줄(각 줄이 '> 줄' 이 된다)"

[mdedit.cli.arg.time]
help = "표시할 HH:MM(기본: 지금)"

[mdedit.cli.arg.no_time]
help = "시각을 적지 않는다"

[mdedit.cli.arg.action_snapshot]
help = "동작: list(목록) | restore(복원)"

[mdedit.cli.arg.id]
help = "복원할 스냅샷 id('list' 결과)"
