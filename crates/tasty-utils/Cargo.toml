[package]
name = "tasty-utils"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Cross-cutting utility helpers for Tasty — path resolution, etc. Small leaf crate, must not depend on any tasty-* crate."

[dependencies]
directories = "6"
tracing = "0.1"
url = "2"

[features]
# 소비 크레이트의 dev-dependency에서만 켜는 스레드 로컬 홈 경로 override.
# release 여부와 무관하게 feature를 켜면 컴파일된다.
test-support = []

[target.'cfg(unix)'.dependencies]
# flistxattr_query, fgetxattr_query는 1.1.6부터 있다. 이 판부터 빈 버퍼는 크기 조회가 아니다.
rustix = { version = "1.1.6", features = ["fs"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
