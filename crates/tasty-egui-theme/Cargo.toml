[package]
name = "tasty-egui-theme"
version = "0.1.1"
edition = "2024"
license = "MIT"
description = "Theme ↔ egui adapter helpers (Visuals/Style apply, hint_text wrapper)"

[dependencies]
egui = "0.31"
tasty-i18n = { path = "../tasty-i18n" }
tasty-type-appearance = { path = "../tasty-type-appearance", features = ["egui-compat"] }
tasty-type-geometry = { path = "../tasty-type-geometry" }
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
tasty-themes = { path = "../tasty-themes" }

# 설치된 Windows 글꼴의 글자 보유를 egui와 같은 파서로 재는 시험만 쓴다.
[target.'cfg(windows)'.dev-dependencies]
ab_glyph = "0.2"

[lints]
workspace = true
