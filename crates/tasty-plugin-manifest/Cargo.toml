[package]
name = "tasty-plugin-manifest"
version = "0.1.9"
edition = "2024"
license = "MIT"
description = "Tasty plugin manifest schema, parse and schema-agnostic validation"
repository = "https://github.com/zilhak/tasty"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tasty-utils = { path = "../tasty-utils" }
semver = "1"
tasty-plugin-protocol = { path = "../tasty-plugin-protocol" }
tasty-type-appearance = { path = "../tasty-type-appearance" }
# 팝업 선언 변환(PopupContribute → PopupDecl)의 크기 값. protocol이 이미 받는 leaf 크레이트다.
tasty-type-geometry = { path = "../tasty-type-geometry" }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
