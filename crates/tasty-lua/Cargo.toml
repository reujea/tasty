[package]
name = "tasty-lua"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Host-only Lua scripting layer for Tasty (registered scripts, shortcut-triggered, worker-isolated)"

[dependencies]
mlua = { version = "0.10", features = ["lua54", "vendored", "send", "serialize"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tasty-utils = { path = "../tasty-utils" }

[dev-dependencies]
tasty-utils = { path = "../tasty-utils", features = ["test-support"] }

[lints]
workspace = true
