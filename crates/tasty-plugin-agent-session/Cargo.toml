[package]
name = "tasty-plugin-agent-session"
version = "0.1.40"
edition = "2024"
license = "MIT"
description = "External Tasty plugin: Claude Code chat-tab sessions driven over stream-json"
repository = "https://github.com/zilhak/tasty"

[[bin]]
name = "tasty-plugin-agent-session"
path = "src/main.rs"

[dependencies]
tasty-plugin-sdk = { path = "../tasty-plugin-sdk" }
tasty-plugin-agent-common = { path = "../tasty-plugin-agent-common" }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[lints]
workspace = true
