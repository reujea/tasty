# CLI ヘルプ — マニフェストの `*_i18n_key` と 1:1。

[sup.cli]
desc = "Claude Code・pi のチャットタブセッションとそのエージェントプロファイル・ロールフォルダを操作する"

[sup.cli.sub.list]
description = "エージェントセッションの一覧と、稼働中の数を出す。停止したセッションは会話を保ち、次のターンで再開する。"

[sup.cli.sub.link-add]
description = "セッションを surface に結び、互いから辿れるようにする。知らないセッションは拒否する — 何も指さない結びは、結びが無いより悪い。"

[sup.cli.sub.link-of]
description = "この surface がどのセッションに結ばれているか。結ばれていないことはエラーではない — ほとんどの surface はそうだ。"

[sup.cli.sub.link-remove]
description = "surface をセッションから解く。セッションにも surface にも触れず、印だけを消す。`delete` と違い戻せる — 結び直せば元通り。結ばれていないものを解くのも成功だ。"

[sup.cli.sub.link-siblings]
description = "このセッションが結ばれている surface のすべて。tasty は*「誰がこの子を起こしたか」*を問うが、我々のセッションに親の列は無い — そこで結びが実際に表せる唯一の関係を答える: 複数 surface にまたがるセッション。surface 一つはセッションを正確に一つ持つので、逆方向は存在し得ない。"

[sup.cli.sub.status]
description = "この surface に結ばれたセッションが今何をしているか。"

[sup.cli.sub.sleep]
description = "この surface のセッションのプロセスを今止める。会話は残るので、次の `tell` が文脈ごと再開する。"

[sup.cli.sub.tell]
description = "この surface に結ばれたセッションにターンを送り、答えを待つ。停止したセッションは自動で再開され、その一ターンだけ数秒余計にかかる。 最大2分待ち、その時点で実行中のターンはまだ実行中と答える — 回答は後で `output` で読む。チャットタブならそのタブのキューを通るので、タブにも表示され、タブから送ったターンと重ならない。"

[sup.cli.sub.abort]
description = "この surface のセッションが走らせているターンだけを取り消す — セッションは終えない。シェルタブの Ctrl+C と同じだ: 作業は止まり、セッションは残って次のターンを受け、何も走っていない時に押しても無害。`sleep` と違いプロセスは生きている。"

[sup.cli.sub.add-dir]
description = "この surface のセッションに作業フォルダを追加します — Claude Code の /add-dir と同じです。一覧はセッションごとに保たれ、claude に渡されます。セッションが起動中なら会話を保ったまますぐ再起動し、そうでなければ次の再開時に適用されます。ターン実行中は拒否します。"

[sup.cli.sub.remove-dir]
description = "add-dir で追加した作業フォルダをこの surface のセッションから外します。適用は add-dir と同じです: 起動中ならすぐ、そうでなければ次の再開時。"

[sup.cli.sub.clear]
description = "この surface のセッションで会話を新しく始めます — Claude Code の /clear と同じです。セッション・タブ・設定は残り、エージェントは以前のターンを忘れ、会話タブからも消えます。ターンの実行中や待機中のメッセージがあれば拒否し、クリアが終わってから応答します。"

[sup.cli.sub.sync-compact]
description = "このチャットタブにつながったセッションでプロジェクト同期をしてから compact する。同期ターンが正常に終わったときだけ compact を送る。ターン実行中・キューがあれば拒否し、同期ターンを送った時点で答える — 残りはステータス行が示す。"

[sup.cli.sub.start]
description = "新しいエージェントセッションを起こし、この surface に一度で結ぶ。surface が既にセッションを持つなら拒否する — 持てるのは一つで、上書きすれば前のものが孤児になる。 --copy-of を渡すと別のチャットタブのプロファイルと設定を複製して起こす。"

[sup.cli.sub.broadcast]
description = "一つのエージェントプロファイルで起こした全セッションに同じターンを送る（エージェント未指定なら生きている全部）。一部が失敗しても残りは取り消さない — 送れた分と失敗した分は別々に返る。"

[sup.cli.sub.delete]
description = "セッション記録を恒久的に消す。`sleep` でも `abort` でもない — 座標を消すので、そのセッションが持っていた会話は二度と再開できない。生きている間は拒否する（先に止める）。UI のどこにもこのボタンを意図的に置いていない。"

[sup.cli.sub.output]
description = "この surface のセッションが直近に言ったこと。`watch` と違い後ろを見る — 誰も見ていない間に走ったターンにも、その後眠らせたセッションにも答える。"

[sup.cli.sub.watch]
