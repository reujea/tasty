[sup.about]
context = "エージェント(例: Claude Code)の auto-compact が文書を残さない問題(メモリ上で要約・整理するだけ)を解決します。\n複数のエージェントに同じ設定をまとめて適用し、コンテキストを新鮮で軽く保ちます(コスト・応答の遅れを改善)。\n- 自動実行: セッションのコンテキストが基準(トークン)に達すると、下の手順を自動で行います。\n- 手順: 「同期の指示文」でプロンプトを実行(現在の状態・再開地点の文書を保存) → 「compact の焦点指示」で compact を実行"
sync = "推奨: オン。ターン終了時のコンテキストが基準を超えると、そのタブが 60 秒静かになってから同期します。基準より 200,000 トークン以上多ければ待ちません。基準はコンテキストウィンドウの 90% を超えないように下げて使います(200k のウィンドウなら 180,000)。同じセッションの自動実行の間隔は 10 分以上で、compact 後も基準を超えていれば、コンテキストが基準を下回るまで止まります。"
idle_sync = "推奨: オン。プロンプトキャッシュは最後のリクエストから 5 分(または 1 時間)で切れ、その後の最初のリクエストはコンテキスト全体をキャッシュに書き直します(キャッシュ読み取りの 12 倍を超えるコスト)。そのため、API を呼んだ最後のターンが終わってからキャッシュ寿命の 1 分前(240秒・3,540秒)に、コンテキストが基準以上のときだけ同期します。休み 1 回につき 1 回で、次のメッセージを送ると再び開き、同じエージェントプロファイルでは一度に 1 タブだけ開きます。基準が作業中より低いのは意図したものです。"
limit_sync = "推奨: オン。5 時間・7 日の使用上限のうち大きい方の使用率がこの値に達すると、上限で止められてセッションが切れる前に同期して compact します。上限がリセットされるまで 1 回です。使用率は claude.ai ログインのプロファイルでしか受け取れないため、API キーのプロファイルでは動きません。"
reclaim = "推奨: オン。休んでいるタブごとに claude プロセスがメモリを使います。最後に触れたとき(メッセージ・タブ操作・セッション宛てのコマンド)からキャッシュ寿命の 1 分前(240秒・3,540秒)が過ぎると、プロセスを終了します。アイドル時の同期が走るタブはその完了後(失敗しても)、基準未満かアイドル時の同期がオフならすぐに終了します。バックグラウンド作業が残るセッションは終了せず、次のメッセージで会話を続けて再び起動します。"
cache_watch = "推奨: オン。休んでいないのにターン最初のリクエストが会話全体をキャッシュに書き直すと(システムプロンプト・ツール定義が変わった場合など)、ステータス行と通知行で知らせます。1 時間キャッシュが 5 分キャッシュに下がると、セッションごとに 1 回知らせます。オフにすると通知だけが消え、指標は残ります。"
memory_saver = "推奨: チャットタブを多く開いておくときはオン(既定はオフ)。隠れたチャットタブの画面(WebView)を解放してメモリを節約します。会話・キュー・書きかけの文はそのままで、再び表示されたときに画面を描き直します。長い会話ほど描き直しに時間がかかり、スクロールは一番下から始まります。"

