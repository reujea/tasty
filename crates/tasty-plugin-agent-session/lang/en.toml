[sup.cli.sub.link-list]
description = "Every surface-to-session pair currently tied, plus how many surfaces could not be read."

[sup.cli.sub.traffic]
description = "API traffic shaping: whether it is on, the upload and download limits (KB/s), bytes relayed, open and failed tunnels, and the local proxies with their upstream."

