# CLI 도움말 — 매니페스트의 `*_i18n_key` 와 1:1 이다.
# 영어 카탈로그는 매니페스트 원문과 **같아야** 한다
# (`plugin_help_catalog` 가 대조한다).

[sup.cli]
desc = "Drive Claude Code and pi chat-tab sessions, their agent profiles and role folders"

[sup.cli.sub.list]
description = "List agent sessions with how many are running. A stopped session keeps its conversation and resumes on the next turn."

[sup.cli.sub.link-add]
description = "Tie a session to a surface so each can be found from the other. Refuses an unknown session — a link to nothing is worse than no link."

[sup.cli.sub.link-of]
description = "Which session is this surface tied to. Not being tied is not an error condition of the tool — most surfaces are not."

[sup.cli.sub.link-remove]
description = "Untie a surface from its session. Touches neither the session nor the surface — only the mark. Unlike `delete` this is reversible: link again and it is back. Untying something never tied is still success."

[sup.cli.sub.link-siblings]
description = "Every surface this session is tied to. tasty asks 'who spawned this child'; our sessions have no parent column, so this answers the one relation the ties can actually express: a session spanning several surfaces. A surface holds exactly one session, so the reverse direction cannot exist."

[sup.cli.sub.status]
description = "What the session tied to this surface is doing right now."

[sup.cli.sub.sleep]
description = "Stop this surface's session process now. The conversation is kept, so the next `tell` resumes it with its context."

[sup.cli.sub.tell]
description = "Send a turn to the session tied to this surface and wait for the answer. A stopped session is resumed automatically, which costs that one turn a few extra seconds. Waits up to two minutes; a turn still running by then is reported as such, and its answer can be read later with `output`. On a chat tab the turn goes through the tab's queue, so it shows up in the tab and never overlaps a turn sent there."

[sup.cli.sub.abort]
description = "Cancel the turn this surface's session is running, without ending the session. This is what Ctrl+C does in a shell tab: the work stops, the session stays and takes the next turn, and it is harmless when nothing is running. Unlike `sleep` the process stays up."

[sup.cli.sub.add-dir]
description = "Give this surface's session another working directory, the same as /add-dir in Claude Code. The list is kept per session and passed to claude; if the session is running it is restarted at once with its conversation intact, otherwise the folder applies on the next resume. Refuses while a turn is running."

[sup.cli.sub.remove-dir]
description = "Take a working directory added with add-dir off this surface's session. Applies the same way as add-dir: at once if the session is running, otherwise on the next resume."

[sup.cli.sub.clear]
description = "Start a fresh conversation in this surface's session, the same as /clear in Claude Code. The session, its tab and its settings stay; the agent forgets the earlier turns and a chat tab drops them too. Refuses while a turn is running or messages are queued, and answers once the clear has gone through."

[sup.cli.sub.sync-compact]
description = "Run project sync on the session tied to this chat tab, then compact it. Compact is sent only when the sync turn ends well. Refuses while a turn is running or messages are queued, and answers once the sync turn has been sent; the status line shows the rest."

[sup.cli.sub.start]
description = "Spawn a new agent session and tie it to this surface in one step. Refuses if the surface already holds a session, because a surface can only carry one and overwriting would orphan the first. With --copy-of, the new session copies another chat tab's profile and settings."

[sup.cli.sub.broadcast]
description = "Send the same turn to every session started under one agent profile, or to all live sessions when no agent is named. Partial failure does not cancel the rest — sent and failed come back separately."

[sup.cli.sub.delete]
description = "Permanently remove a session record. This is not `sleep` and not `abort`: it erases the coordinate, so the conversation that session held can never be resumed. Refuses while the session is alive — stop it first. There is deliberately no button for this anywhere in the UI."

[sup.cli.sub.output]
description = "What this surface's session said most recently. Unlike `watch`, this looks backwards — it answers even for turns that ran while nothing was watching, and for a session that has since been put to sleep."

[sup.cli.sub.watch]
description = "Follow the turn this surface's session is running, event by event, and return what arrived. Works for a turn started anywhere, including a `tell` from this same plugin; while it watches, other calls to this plugin wait."

[sup.cli.sub.sync]
description = "Bring every linked tab's attention highlight in line with what its session is actually doing."

[sup.cli.sub.profile-list]
description = "List agent profiles. Each profile is one JSON file in the plugin's profiles folder; with no files, a built-in profile named claude is offered."

[sup.cli.sub.profile-show]
description = "Show one agent profile as JSON."

[sup.cli.sub.profile-set]
description = "Create or replace an agent profile. Fields: agent_type (claude or pi), command, cwd, env, model, permission_mode, settings, add_dirs, args, cache_ttl (5m or 1h). Sessions already running keep the profile they started with."

[sup.cli.sub.profile-remove]
description = "Delete an agent profile file. Sessions started from it keep running, but cannot resume until a profile of that name exists again."

[sup.cli.arg.profile_args.name]
help = "Profile name (letters, digits, - _ .)"

[sup.cli.arg.profile_set_args.name]
help = "Profile name (letters, digits, - _ .)"

