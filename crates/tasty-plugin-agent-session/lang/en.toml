[sup.about]
context = "When the context reaches a threshold, the tab first runs project sync to record the current state and the resume point in documents, then compacts around those documents and the work in progress. One shared threshold here replaces tuning each agent, keeping the context lean so cost and response latency stay down. Claude Code's auto-compact only summarizes in memory and writes no documents, so sync runs before it. Turning a feature switch off leaves its threshold field visible."
sync = "Recommended: on. When the context at the end of a turn passes the threshold, the tab syncs after it has been quiet for 60 seconds. If the context is 200,000 tokens or more over the threshold, it does not wait. The threshold is lowered so it never exceeds 90% of the context window (180,000 for a 200k window). Automatic runs in one session are at least 10 minutes apart, and if the context is still over the threshold after compact, it stops until the context drops below it."
idle_sync = "Recommended: on. The prompt cache goes cold 5 minutes (or 1 hour) after the last request, and the first request after that writes the whole context to the cache again (more than 12 times the cost of a cache read). So one minute before the cache expires after the last turn that called the API (240 s/3,540 s), the tab syncs, but only when the context is at or above the threshold. It runs once per rest and opens again after you send the next message, and only one tab per agent profile runs it at a time. The threshold being lower than the working one is intended."
limit_sync = "Recommended: on. When the larger of the 5-hour and 7-day usage limits reaches this share, the tab syncs and compacts before the limit cuts the session off. It runs once until the limit resets. Usage is only reported for claude.ai login profiles, so it does not run for API key profiles."
reclaim = "Recommended: on. Every resting tab keeps a claude process holding memory. One minute before the cache lifetime has passed since you last touched the session (a message, a tab action or a command aimed at the session) (240 s/3,540 s), the process is shut down. A tab that will run the idle sync is released after that sync ends (even if it fails); below the threshold or with the idle sync off it is released right away. A session with background work left is not released, and the next message starts it again and continues the conversation."
cache_watch = "Recommended: on. When the first request of a turn writes the whole conversation to the cache again although the session did not rest (for example after a system prompt or tool definition change), the status line and a notice line say so. When a 1-hour cache drops to a 5-minute cache, you get one notice per session. Turning it off removes only the notices; the metrics stay."
memory_saver = "Recommended: on when you keep many chat tabs open (off by default). Hidden chat tabs drop their page (WebView) to save memory. The conversation, the queue and unsent drafts stay, and the page is drawn again when the tab shows. Long conversations take longer to draw again, and scrolling starts at the bottom."

[sup.default]
sync_prompt = "project sync"
compact_prompt = "Keep in-progress work, next steps and identifiers (paths, IDs, numbers) from the resume-point document verbatim, and summarize the exploration. Write the summary in English, the language of this sentence."

