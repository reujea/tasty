[sup.about]
context = "에이전트(예: Claude Code)의 auto-compact 가 문서를 남기지 않는 문제(메모리 안에서만 요약 · 정리)를 해결합니다.\n여러 에이전트에 같은 설정을 쉽게 적용해 컨텍스트를 싱싱하고 가볍게 유지합니다(비용 · 응답 지연 개선).\n- 자동 실행: 세션 컨텍스트가 기준(토큰)에 닿으면 아래 절차를 자동으로 수행합니다.\n- 절차: 「현행화 지시문」으로 프롬프트 실행(현재 상태 · 재개 지점 문서 저장) → 「compact 초점 지시문」으로 compact 실행"
sync = "권장: 켬. 턴이 끝났을 때 컨텍스트가 기준을 넘으면 그 탭이 60초 동안 조용해진 뒤 현행화합니다. 기준보다 200,000 토큰 이상 많으면 기다리지 않습니다. 기준은 컨텍스트 최대 크기의 90% 를 넘지 않게 낮춰 씁니다(200k 컨텍스트면 180,000). 같은 세션의 자동 실행 사이는 10분 이상이고, compact 뒤에도 기준을 넘으면 컨텍스트가 기준 아래로 내려갈 때까지 멈춥니다."
idle_sync = "권장: 켬. 프롬프트 캐시는 마지막 요청 뒤 5분(또는 1시간)이 지나면 식고, 식은 뒤 첫 요청은 컨텍스트 전체를 캐시에 다시 씁니다(캐시 읽기보다 12배 넘게 비쌉니다). 그래서 API 를 부른 마지막 턴이 끝난 뒤 캐시 수명 1분 전(240초 · 3,540초)에, 컨텍스트가 기준 이상일 때만 현행화합니다. 쉼 한 번에 한 번이고 다음 말을 보내야 다시 열리며, 같은 에이전트 프로필에서는 한 번에 한 탭만 엽니다. 기준이 작업 중보다 낮은 것은 의도입니다."
limit_sync = "권장: 켬. 5시간 · 7일 사용 한도 중 큰 쪽의 사용률이 이 값에 닿으면, 한도에 막혀 세션이 끊기기 전에 현행화하고 compact 합니다. 한도가 초기화되기 전까지 한 번입니다. 사용률은 claude.ai 로그인 프로필에서만 받으므로 API 키 프로필에서는 동작하지 않습니다."
reclaim = "권장: 켬. 쉬는 탭마다 claude 프로세스가 메모리를 차지합니다. 마지막으로 손댄 때(말 · 탭 조작 · 세션을 겨눈 명령)부터 캐시 수명 1분 전(240초 · 3,540초)이 지나면 프로세스를 내립니다. 유휴 현행화가 돌 탭은 그것이 끝난 뒤(실패해도), 기준 미만이거나 유휴 현행화가 꺼졌으면 바로 내립니다. 백그라운드 작업이 남은 세션은 내리지 않고, 다음 말이 대화를 이어 다시 띄웁니다."
cache_watch = "권장: 켬. 쉬지 않았는데 턴의 첫 요청이 대화 전체를 캐시에 다시 쓰면(시스템 프롬프트 · 도구 정의가 바뀐 경우 등) 상태줄과 알림 줄로 알립니다. 1시간 캐시가 5분 캐시로 내려가면 세션마다 한 번 알립니다. 끄면 알림만 사라지고 지표는 남습니다."
memory_saver = "권장: 대화 탭을 많이 열어 둘 때 켬(기본 끔). 가려진 대화 탭의 화면(WebView)을 내려 메모리를 아낍니다. 대화 · 대기열 · 쓰던 글은 그대로이고 다시 보일 때 화면을 다시 그립니다. 긴 대화일수록 다시 그리는 데 오래 걸리고 스크롤은 맨 아래부터 시작합니다."

