description = "에이전트 세션 목록과 그중 몇이 도는지를 낸다. 멈춘 세션은 대화를 간직하고 다음 턴에 재개된다."

[sup.cli.sub.link-add]
description = "세션을 surface 에 묶어 서로에게서 찾을 수 있게 한다. 모르는 세션은 거부한다 — 없는 것을 가리키는 끈은 끈이 없는 것보다 나쁘다."

[sup.cli.sub.link-of]
description = "이 surface 가 어느 세션에 묶여 있나. 안 묶인 것은 오류가 아니다 — 대부분의 surface 가 그렇다."

[sup.cli.sub.link-remove]
description = "surface 를 세션에서 푼다. 세션도 surface 도 건드리지 않고 표시만 지운다. `delete` 와 달리 되돌릴 수 있다 — 다시 묶으면 돌아온다. 묶인 적 없는 것을 푸는 것도 성공이다."

[sup.cli.sub.link-siblings]
description = "이 세션이 묶인 surface 전부. tasty 는 *\"누가 이 자식을 띄웠나\"* 를 묻지만 우리 세션에는 부모 칼럼이 없다 — 그래서 끈이 실제로 말할 수 있는 관계 하나를 답한다: 여러 surface 에 걸친 세션. surface 하나는 세션을 정확히 하나 들므로 반대 방향은 존재할 수 없다."

[sup.cli.sub.status]
description = "이 surface 에 묶인 세션이 지금 무엇을 하는지."

[sup.cli.sub.sleep]
description = "이 surface 의 세션 프로세스를 지금 멈춘다. 대화는 남으므로 다음 `tell` 이 맥락과 함께 재개한다."

[sup.cli.sub.tell]
description = "이 surface 에 묶인 세션에 턴을 보내고 답을 기다린다. 멈춘 세션은 자동으로 재개되며, 그 한 턴만 몇 초 더 걸린다. 최대 2분 기다리고, 그때까지 도는 턴은 아직 도는 중이라고 답한다 — 답은 나중에 `output` 으로 읽는다. 대화 탭이면 그 탭의 대기열을 거쳐, 탭에도 보이고 탭에서 보낸 턴과 겹치지 않는다."

[sup.cli.sub.abort]
description = "이 surface 의 세션이 돌고 있는 턴만 취소한다 — 세션은 끝내지 않는다. 셸 탭의 Ctrl+C 와 같다: 일은 멈추고 세션은 남아 다음 턴을 받으며, 도는 것이 없을 때 눌러도 무해하다. `sleep` 과 달리 프로세스는 살아 있다."

[sup.cli.sub.add-dir]
description = "이 surface 의 세션에 작업 폴더를 더한다 — Claude Code 의 /add-dir 와 같다. 목록은 세션별로 남고 claude 에 넘겨진다. 세션이 떠 있으면 곧바로 대화를 유지한 채 다시 띄우고, 아니면 다음 재개 때 적용된다. 턴이 도는 중이면 거부한다."

[sup.cli.sub.remove-dir]
description = "add-dir 로 더한 작업 폴더를 이 surface 의 세션에서 뺀다. 적용은 add-dir 와 같다: 떠 있으면 곧바로, 아니면 다음 재개 때."

[sup.cli.sub.clear]
description = "이 surface 의 세션에서 대화를 새로 시작한다 — Claude Code 의 /clear 와 같다. 세션 · 탭 · 설정은 남고, 에이전트는 이전 턴을 잊으며 대화 탭에서도 사라진다. 턴이 도는 중이거나 대기 중인 말이 있으면 거부하고, 비우기가 끝난 뒤 답한다."

[sup.cli.sub.sync-compact]
description = "이 대화 탭에 이어진 세션에서 프로젝트 현행화를 하고 compact 한다. 현행화 턴이 잘 끝났을 때만 compact 를 보낸다. 턴이 돌거나 대기열이 있으면 거절하고, 현행화 턴을 보낸 뒤 답한다 — 나머지는 상태줄이 보인다."

[sup.cli.sub.start]
description = "새 에이전트 세션을 띄워 이 surface 에 한 번에 묶는다. surface 가 이미 세션을 들고 있으면 거부한다 — 하나만 들 수 있고 덮어쓰면 앞의 것이 고아가 된다. --copy-of 를 주면 다른 대화 탭의 프로필과 설정을 복제해 띄운다."

[sup.cli.sub.broadcast]
description = "한 에이전트 프로필로 띄운 모든 세션에 같은 턴을 보낸다(에이전트를 안 적으면 살아 있는 전부). 일부가 실패해도 나머지는 취소되지 않는다 — 보낸 것과 실패한 것이 따로 돌아온다."

[sup.cli.sub.delete]
description = "세션 기록을 영구히 지운다. `sleep` 도 `abort` 도 아니다 — 좌표를 지우므로 그 세션이 들던 대화는 다시는 재개할 수 없다. 살아 있는 동안은 거부한다(먼저 멈춘다). UI 어디에도 이 단추를 일부러 두지 않았다."

[sup.cli.sub.output]
description = "이 surface 의 세션이 가장 최근에 한 말. `watch` 와 달리 뒤를 본다 — 아무도 안 보는 사이 돈 턴도, 그 뒤 재운 세션도 답한다."

[sup.cli.sub.watch]
description = "이 surface 의 세션이 도는 턴을 사건 단위로 따라가며 도착한 것을 낸다. 어디서 시작한 턴이든 지켜본다 — 같은 플러그인의 `tell` 이 보낸 턴도 된다. 지켜보는 동안에는 이 플러그인의 다른 호출이 기다린다."

[sup.cli.sub.sync]
description = "묶인 모든 탭의 주목 표시를 세션이 실제로 하는 일에 맞춘다."

[sup.cli.sub.profile-list]
description = "agent 프로필 목록. 프로필 하나는 plugin 프로필 폴더의 JSON 파일 하나다. 파일이 없으면 기본 프로필 claude 하나를 낸다."

[sup.cli.sub.profile-show]
description = "agent 프로필 하나를 JSON 으로 보인다."

[sup.cli.sub.profile-set]
description = "agent 프로필을 만들거나 통째로 바꾼다. 칸: agent_type(claude · pi) · command · cwd · env · model · permission_mode · settings · add_dirs · args · cache_ttl(5m · 1h). 이미 도는 세션은 시작할 때의 프로필을 그대로 쓴다."

[sup.cli.sub.profile-remove]
description = "agent 프로필 파일을 지운다. 그 프로필로 띄운 세션은 계속 돌지만, 같은 이름의 프로필이 다시 생기기 전에는 재개할 수 없다."

