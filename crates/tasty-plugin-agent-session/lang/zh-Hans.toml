[sup.cli]
desc = "操作 Claude Code 和 pi 的聊天标签页会话及其智能体配置档和角色文件夹"

[sup.cli.sub.list]
description = "列出智能体会话及正在运行的数量。已停止的会话保留其对话，并在下一轮时恢复。"

[sup.cli.sub.link-add]
description = "将会话绑定到 Surface，以便双方可以互相查找。拒绝未知会话——指向不存在对象的绑定比没有绑定更糟。"

[sup.cli.sub.link-of]
description = "此 Surface 绑定到哪个会话。未绑定不属于此工具的错误情况——大多数 Surface 都未绑定。"

[sup.cli.sub.link-remove]
description = "解除 Surface 与其会话的绑定。不触及会话和 Surface，只移除标记。与 `delete` 不同，此操作可逆：重新绑定即可恢复。解除从未绑定的对象也视为成功。"

[sup.cli.sub.link-siblings]
description = "此会话绑定的所有 Surface。tasty 询问的是“谁 Spawn 了这个子实例”；我们的会话没有父级列，因此这里回答绑定实际能表达的唯一关系：一个会话跨越多个 Surface。一个 Surface 恰好持有一个会话，因此反方向的关系不可能存在。"

[sup.cli.sub.status]
description = "绑定到此 Surface 的会话当前正在做什么。"

[sup.cli.sub.sleep]
description = "立即停止此 Surface 的会话进程。对话会保留，因此下一次 `tell` 会带着上下文恢复该会话。"

[sup.cli.sub.tell]
description = "向绑定到此 Surface 的会话发送一轮并等待答复。已停止的会话会自动恢复，这会使该轮多花几秒。最多等待两分钟；届时仍在运行的轮次会如实报告，其答复稍后可通过 `output` 读取。在聊天标签页中，该轮会经过标签页的队列，因此会显示在标签页中，且不会与在那里发送的轮次重叠。"

[sup.cli.sub.abort]
description = "取消此 Surface 的会话正在运行的轮次，但不结束会话。作用与 Shell 标签页中的 Ctrl+C 相同：工作停止，会话保留并接收下一轮；没有运行内容时执行也无害。与 `sleep` 不同，进程保持运行。"

[sup.cli.sub.add-dir]
description = "为此 Surface 的会话添加另一个工作目录，等同于 Claude Code 中的 /add-dir。列表按会话保存并传给 claude；如果会话正在运行，会立即重启并保持对话不变，否则该目录在下次恢复时生效。有轮次正在运行时拒绝执行。"

[sup.cli.sub.remove-dir]
description = "从此 Surface 的会话中移除通过 add-dir 添加的工作目录。生效方式与 add-dir 相同：会话正在运行时立即生效，否则在下次恢复时生效。"

[sup.cli.sub.clear]
description = "在此 Surface 的会话中开始新对话，等同于 Claude Code 中的 /clear。会话、其标签页和设置保留；智能体会忘记之前的轮次，聊天标签页也会将其移除。有轮次正在运行或有消息排队时拒绝执行，清空完成后才返回答复。"

[sup.cli.sub.sync-compact]
description = "在绑定到此聊天标签页的会话上运行项目同步，然后执行 compact。仅当同步轮次正常结束时才发送 compact。有轮次正在运行或有消息排队时拒绝执行，同步轮次发送后即返回答复；其余进度显示在状态栏中。"

[sup.cli.sub.start]
description = "一步完成新智能体会话的启动并将其绑定到此 Surface。如果 Surface 已持有会话则拒绝执行，因为一个 Surface 只能承载一个会话，覆盖会使第一个会话成为孤立会话。使用 --copy-of 时，新会话会复制另一个聊天标签页的配置档和设置。"

[sup.cli.sub.broadcast]
description = "向在同一智能体配置档下启动的所有会话发送同一轮；未指定智能体时发送给所有存活的会话。部分失败不会取消其余发送——成功和失败的结果分别返回。"

[sup.cli.sub.delete]
description = "永久删除会话记录。这不是 `sleep`，也不是 `abort`：它会抹除坐标，因此该会话持有的对话将永远无法恢复。会话存活时拒绝执行——先将其停止。UI 中有意没有为此提供任何按钮。"

[sup.cli.sub.output]
description = "此 Surface 的会话最近说了什么。与 `watch` 不同，此命令向后查看——即使是无人监视时运行的轮次，或此后已进入休眠的会话，也能返回答复。"

[sup.cli.sub.watch]
description = "逐个事件跟踪此 Surface 的会话正在运行的轮次，并返回已到达的内容。适用于在任何地方启动的轮次，包括由同一插件的 `tell` 发送的轮次；监视期间，对此插件的其他调用会等待。"

[sup.cli.sub.sync]
description = "使所有已绑定标签页的注意力高亮与其会话的实际状态保持一致。"

[sup.cli.sub.profile-list]
description = "列出智能体配置档。每个配置档是插件 profiles 文件夹中的一个 JSON 文件；没有文件时，提供名为 claude 的内置配置档。"

[sup.cli.sub.profile-show]
description = "以 JSON 显示一个智能体配置档。"

[sup.cli.sub.profile-set]
description = "创建或替换智能体配置档。字段：agent_type（claude 或 pi）、command、cwd、env、model、permission_mode、settings、add_dirs、args、cache_ttl（5m 或 1h）。已在运行的会话保持其启动时的配置档。"

[sup.cli.sub.profile-remove]
description = "删除智能体配置档文件。由其启动的会话会继续运行，但在同名配置档再次存在之前无法恢复。"

[sup.cli.arg.profile_args.name]
