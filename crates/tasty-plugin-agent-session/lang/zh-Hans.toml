[sup.prompt]
denied = "用户已拒绝"

[sup.about]
context = "解决智能体（例如 Claude Code）的自动 compact 不写入任何文档的问题（只在内存中总结）。\n一次将相同设置应用于多个智能体，使上下文保持新鲜、轻量（降低成本和响应延迟）。\n- 自动运行：会话的上下文达到阈值（token）时，以下步骤会自动运行。\n- 步骤：将“同步指令”作为提示词发送（保存当前状态和恢复点文档）→ 使用“compact 重点指令”执行 compact"
sync = "推荐：开启。轮次结束时的上下文超过阈值后，标签页在静默 60 秒后同步。如果上下文超出阈值 200,000 token 或更多，则不等待。阈值会被下调，使其不超过上下文窗口的 90%（200k 窗口为 180,000）。同一会话中的自动运行至少间隔 10 分钟；如果 compact 后上下文仍超过阈值，则停止运行，直到上下文降到阈值以下。"
idle_sync = "推荐：开启。提示词缓存在最后一次请求后 5 分钟（或 1 小时）失效，之后的第一个请求会将整个上下文重新写入缓存（成本超过缓存读取的 12 倍）。因此，在最后一个调用 API 的轮次之后、缓存过期前一分钟（240 秒/3,540 秒），标签页会同步，但仅在上下文达到或超过阈值时。每次休眠只运行一次，发送下一条消息后重新开放，且每个智能体配置档同一时间只有一个标签页运行。阈值低于工作时阈值是有意为之。"
limit_sync = "推荐：开启。当 5 小时和 7 天用量上限中较大者达到此比例时，标签页会在上限切断会话前进行同步和 compact。在上限重置前只运行一次。仅 claude.ai 登录的配置档会报告用量，因此对 API 密钥配置档不运行。"
reclaim = "推荐：开启。每个休眠的标签页都有一个占用内存的 claude 进程。自你最后一次操作该会话（消息、标签页操作或针对该会话的命令）起，在缓存生命周期结束前一分钟（240 秒/3,540 秒），该进程会被关闭。将运行空闲同步的标签页会在同步结束后释放（即使同步失败）；低于阈值或空闲同步关闭时则立即释放。仍有后台工作的会话不会被释放，下一条消息会重新启动它并继续对话。"
cache_watch = "推荐：开启。当会话并未休眠，但某轮的第一个请求却将整个对话重新写入缓存时（例如系统提示词或工具定义变更后），状态栏和通知行会提示。1 小时缓存降为 5 分钟缓存时，每个会话会收到一次通知。关闭后仅移除通知，指标仍保留。"
memory_saver = "推荐：打开大量聊天标签页时开启（默认关闭）。隐藏的聊天标签页会释放其页面（WebView）以节省内存。对话、队列和未发送的草稿会保留，标签页显示时会重新绘制页面。对话越长，重新绘制所需时间越长，且滚动位置从底部开始。"

