[package]
name = "tasty-plugin-agent-stream"
version = "0.1.181"
edition = "2024"
license = "MIT"
description = "External Tasty plugin: AI agent transcript tail / relay pipeline"
repository = "https://github.com/zilhak/tasty"

[[bin]]
name = "tasty-plugin-agent-stream"
path = "src/main.rs"

[dependencies]
tasty-plugin-sdk = { path = "../tasty-plugin-sdk" }
tasty-plugin-agent-common = { path = "../tasty-plugin-agent-common" }
serde_json = "1"
tasty-utils = { path = "../tasty-utils" }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
# SSE 엔드포인트(`src/sse/server.rs`)용 blocking HTTP 서버. 본체 웹훅과 같은 선택이며
# 근거는 docs/features/webhook/index.md — SDK 가 async 를 지원하지 않아 plugin 도 blocking + 전용 스레드가
# 자연스럽다. `default-features = false` 로 TLS 는 빼고 프록시에 위임한다.
tiny_http = { version = "0.12", default-features = false }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
