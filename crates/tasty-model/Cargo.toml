[package]
name = "tasty-model"
edition = "2024"
version = "0.1.0"
authors = ["zilhak <zilhak1@gmail.com>"]
license = "MIT"
description = "Tasty workspace / pane / tab / surface domain model."

[dependencies]
tasty-type-geometry = { path = "../tasty-type-geometry" }
tasty-type-appearance = { path = "../tasty-type-appearance" }
tasty-utils         = { path = "../tasty-utils" }
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow     = "1"
directories = "6"
tracing    = "0.1"
sha2       = "0.10"
url        = "2"

[lints]
workspace = true
