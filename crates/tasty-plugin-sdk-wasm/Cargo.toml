# 본 crate 가 다른 워크스페이스에 흡수되지 않도록 빈 [workspace] 명시.
# (worktree 부모 디렉터리에 별 cargo workspace 가 있을 때 발생하는 충돌 회피.)
[workspace]

[package]
name = "tasty-plugin-sdk-wasm"
version = "0.1.2-poc"
edition = "2024"
license = "MIT"
description = "POC: Host-side WASM (wasi-preview2 component) runtime for Tasty plugins. Excluded from main workspace."
repository = "https://github.com/zilhak/tasty"
publish = false

# 메인 workspace에서 제외한 WASM 실행 실험. 자체 Cargo.lock을 사용한다.
# cargo build --release --manifest-path crates/tasty-plugin-sdk-wasm/Cargo.toml

[dependencies]
# wasmtime은 49.x 줄을 쓴다. 이 crate가 이미 49 API로 옮겨졌기 때문이다.
# RustSec 공지가 49를 요구하지는 않는다. 2026-11-22 advisory DB의 wasmtime·wasmtime-wasi
# 공지로는 36.x 줄도 36.0.22 이상이면 모두 피한다(RUSTSEC-2026-0567·0573은 36.x가
# 영향 범위 밖이다).
# 50.x는 rust-toolchain.toml의 1.96.0보다 높은 Rust 1.97을 요구한다.
# 새 공지가 나오면 그 패키지의 Cargo.lock 판을 unaffected·patched에 대조한다.
# 둘 어디에도 들지 않으면 49 계열 수정판으로 올린다. 수정판이 없으면 새 공지와
# 기존 공지를 모두 피하는 판을 찾아, 필요하면 툴체인을 올려 새 줄로 가거나
# API를 되돌려 36.x로 돌아간다.
# 정식 지원은 보류 상태다.
# 현재 정책: docs/dev-guide/plugin-packaging.md#정책-현행.
wasmtime = { version = "49", default-features = false, features = [
    "runtime",
    "cranelift",
    "component-model",
    "cache",
    # wasmtime::Error를 anyhow::Error로 바꾸는 From 구현(poc-host의 `?`)에 필요하다.
    "anyhow",
] }
wasmtime-wasi = { version = "49", default-features = false, features = ["p1", "p2"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"

[features]
default = []
# 메인 바이너리에 연결하지 않으며 poc-host에서 별도로 실행한다.
