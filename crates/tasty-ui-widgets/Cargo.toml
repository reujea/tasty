[package]
name = "tasty-ui-widgets"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Reusable egui layout/widget primitives shared by main app and gallery"

[dependencies]
egui = "0.31"
egui_extras = "0.31"
icu_normalizer = { version = "2.1", default-features = false, features = ["compiled_data"] }
unicode-segmentation = "1.12"
tasty-icons = { path = "../tasty-icons", features = ["egui"] }
tasty-dag-layout = { path = "../tasty-dag-layout" }
tasty-egui-theme = { path = "../tasty-egui-theme" }
tasty-type-appearance = { path = "../tasty-type-appearance", features = ["egui-compat"] }
tasty-type-geometry = { path = "../tasty-type-geometry" }

[dev-dependencies]
# 번역 문구로 배치를 재는 시험이 내장 언어 목록과 언어 파일을 읽는다.
tasty-i18n = { path = "../tasty-i18n" }
toml = "0.8"
# 라벨 글꼴 시험이 고정폭 글꼴의 글자 표를 읽는다.
tasty-font = { path = "../tasty-font" }
ttf-parser = "0.25"
# 토스트 구조 상수가 DTCG 토큰 값과 같은지 시험에서 대조한다.
tasty-design-tokens = { path = "../tasty-design-tokens" }
# path_field_focus 통합테스트가 headless Context 구동에 실제 Theme 을 요구한다.
tasty-themes = { path = "../tasty-themes" }
# 스크롤 화살표 테스트가 chevron 글리프를 실제 텍스처로 칠해 tint를 읽는다. svg 로더가 없으면 글리프가 칠해지지 않는다.
egui_extras = { version = "0.31", features = ["svg"] }

[lints]
workspace = true
