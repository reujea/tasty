[package]
name = "tasty-remote"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Client-side remote-instance capabilities for Tasty — browse and create workspaces on a remote tasty over SSH or loopback"
repository = "https://github.com/zilhak/tasty"

[dependencies]
# Workspace crates
tasty-i18n = { path = "../tasty-i18n" }
tasty-ipc = { path = "../tasty-ipc" }
tasty-remote-profiles = { path = "../tasty-remote-profiles" }
tasty-ssh = { path = "../tasty-ssh" }
tasty-model = { path = "../tasty-model" }
tasty-utils = { path = "../tasty-utils" }
tracing = "0.1"
base64 = "0.22"
url = "2"
flate2 = "=1.1.9"
sha2 = "0.10"
httparse = "=1.10.1"
tokio = { version = "=1.54.1", features = ["io-util", "time"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
anyhow = "1"

[features]
# 다른 크레이트의 시험이 시도 토큰의 취소 닫기 계수를 읽고 연결 단계 사이에 끼어들게 한다.
test-support = []

[lints]
workspace = true

[dev-dependencies]
tokio = { version = "=1.54.1", features = ["rt", "macros", "sync", "net"] }
# 의존 크레이트에는 호출자의 cfg(test)가 적용되지 않아 시험 도우미 기능을 명시한다.
tasty-utils = { path = "../tasty-utils", features = ["test-support"] }
# 경고 로그를 단언하는 시험이 구독자를 걸고 혼자 돈다(rerun_alone).
tracing-subscriber = { version = "0.3", features = ["fmt"] }
tasty-test-support = { path = "../tasty-test-support" }
