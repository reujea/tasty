# cargo deny check로 보안 공지·라이선스·중복 버전·의존성 출처를 검사한다.
# 현재 해결하지 못한 보안 공지는 아래 ignore에서 이유와 재검토 조건을 관리한다.

[graph]
# 선택 기능의 의존성도 검사한다.
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
  # quick-xml DoS 두 건: 빌드 시 신뢰하는 XML만 처리한다.
  # Linux Wayland 빌드의 wayland-scanner가 고정된 프로토콜 XML을 읽는다.
  # wayland-scanner의 quick-xml ^0.39와 winit 의존성에 묶여 있다.
  # 공식 winit으로 복귀할 때 quick-xml 0.41 이상으로 올릴 수 있는지 확인하고 해제한다.
  "RUSTSEC-2026-0194", # quick-xml: 시작 태그 중복 속성 검사 quadratic 런타임
  "RUSTSEC-2026-0195", # quick-xml: NsReader 무제한 네임스페이스 할당 메모리 고갈

  # 아직 교체하지 못한 유지보수 종료 간접 의존성.
  "RUSTSEC-2024-0436", # paste 1.0.15 unmaintained
  "RUSTSEC-2024-0370", # proc-macro-error 1.0.4 unmaintained
  "RUSTSEC-2017-0008", # serial 0.4.0 unmaintained. portable-pty 0.8의 직렬 포트 기능으로 들어온다.
  "RUSTSEC-2026-0192", # ttf-parser 0.25.1 unmaintained

  # pin-utils 0.1.0 유지보수 종료. 알려진 취약점이 아니다.
  # nix 0.25(portable-pty 0.8)와 nix 0.26(termwiz 0.22)의 기본 기능 aio로 들어온다.
  # nix 안의 사용처는 sys/aio.rs이고 이 저장소의 코드는 nix aio를 쓰지 않는다.
  # portable-pty 0.9로 올리면 사라지지만 터미널 동작이 달라진다. Windows ConPTY에 INHERIT_CURSOR가
  # 항상 켜지고, Unix에서 SHELL 값과 상대 경로 실행 파일 검색 결과가 바뀐다.
  # 세 OS에서 실제 실행으로 동작을 확인한 뒤 portable-pty 0.9·termwiz 0.23으로 함께 올릴 때 해제한다.
  # serial 예외도 그때 함께 해제한다.
  "RUSTSEC-2026-0441", # pin-utils 0.1.0 unmaintained

  # 고정된 git2 0.20.4의 메모리 안전성 문제. 호환 수정 버전으로 올릴 때 해제한다.
  "RUSTSEC-2026-0183", # git2 0.20.4: Remote::list() 잠재 UB
  "RUSTSEC-2026-0184", # git2 0.20.4: BlameHunk Signature 잠재 UB

  # unsound 기본 검사 범위는 workspace의 직접 의존성이다. unmaintained는 간접 의존성도 본다.
  # git2는 tasty-git-core·tasty-plugin-git-viewer의 직접 의존성이므로 위 예외가 필요하다.
  # glib 0.18.5의 RUSTSEC-2024-0429와 rand 0.8.5의 RUSTSEC-2026-0097은
  # lock에 남아 있지만 간접 의존성이라 이 범위에서는 보고되지 않는다.
  # 검사되지 않는 항목을 ignore에 넣으면 advisory-not-detected 경고가 발생한다.
  # unsound 범위를 all로 넓힐 때는 두 의존성의 갱신 가능성과 예외 필요 여부를 다시 확인한다.

]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "0BSD",
  "BSL-1.0",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "CC0-1.0",
  "WTFPL",
  "MPL-2.0",        # 파일단위 copyleft — 링크 사용만, 소스 수정 시 해당 파일 공개 주의
  "OFL-1.1",        # 폰트 자산
  "Ubuntu-font-1.0", # 폰트 자산
]

# 제품에 컴파일되지 않는다. rustls-platform-verifier가 dev 의존성과 wasm32 전용 의존성으로만 선언해
# Linux·Windows·macOS 대상의 normal·build 그래프에 없다. [graph]에 targets가 없어 cargo-deny만 이 크레이트를 본다.
# 전역 allow로 넣지 않아 같은 라이선스의 다른 크레이트가 생기면 다시 판단하게 한다.
[[licenses.exceptions]]
crate = "webpki-root-certs"
allow = ["CDLA-Permissive-2.0"]

[bans]
multiple-versions = "warn"     # 간접 의존성의 버전 중복은 경고로 확인한다.
# 내부 크레이트의 버전 없는 path 의존성도 wildcard로 분류된다.
# allow-wildcard-paths는 publish=false인 크레이트에만 적용되므로 현재는 경고로 둔다.
# 내부 크레이트의 비공개 배포 설정을 정리한 뒤 deny 전환을 검토한다.
wildcards = "warn"
allow-wildcard-paths = true    # publish=false인 크레이트의 path wildcard는 제외한다.

[sources]
unknown-registry = "deny"
unknown-git = "allow"       # winit의 Git 포크를 사용한다.
